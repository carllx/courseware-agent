# Visual System Constitution (视觉系统宪法)
# SSOT: Single Source of Truth
# Style: Isometric Skeuomorphic Breakdown (等距视角拟物拆解风 / 2.5D等距 × 拟物化组件拆解 × 高信息密度)

meta:
  version: "2.0.0"
  last_updated: "2026-05-28"
  maintainer: "Antigravity Agent"
  principles: "Isometric Spatial Depth (Anna Kua), Skeuomorphic Realism & Component Breakdown (Zhang Shenghuan), High Information Density"
  course_target: "Information Visualization (信息可视化)"

# 1. 全局风格定义 (用于 AI 生成 Prompt)
style:
  # 核心风格词
  keywords: "isometric 2.5D architectural-grade diagram, highly detailed skeuomorphic component breakdown, realistic but clean materials, exploded view, clear spatial hierarchy, strict grid layout with subtle black outlines, high information density, modern industrial design aesthetics, white background, engaging and pedagogical"
  # 环境氛围
  atmosphere: "realistic and engaging, highly detailed, structural depth, spatial clarity, modern product design, technical but approachable"
  # 否定词 (彻底禁止干扰认知的元素)
  negative_prompt: "flat 2D, purely abstract shapes, dada, photomontage, collage, messy, asymmetrical tension, dirty shadows, cyberpunk, neon colors, cartoons, clip art, busy background, chaotic, decorative noise"
  
  # 按 Layout 类型的 Prompt 变体 (描述资产图像本身)
  prompt_variants:
    Title: "isometric conceptual hero diagram, exploded view of a core concept, realistic skeuomorphic details, vast white space"
    Diagram: "isometric 2.5D information architecture diagram, skeuomorphic components connected by subtle lines, high information density"
    List: "isometric sequence of disassembled parts, ordered elements aligned in 3D space, realistic textures, pure white negative space"
    Comparison: "isometric visual dichotomy, symmetric exploded view comparing two realistic skeuomorphic structures"
    Split: "detailed isometric structural anatomy illustration, exploded view of realistic components, extremely clean aesthetic, suitable for placing alongside text"
    Grid: "isometric matrix of precise skeuomorphic components, uniform 3D spacing, clean subtle borders"
    Image: "objective scientific isometric visualization, highly realistic materials, clean structural representation"

    # 教学锚定变体（用于 RenderMode: pedagogical）
    Pedagogical_Split: "isometric pedagogical anatomy diagram, skeuomorphic component breakdown of SPECIFIC RECOGNIZABLE OBJECTS described in Keywords, highly realistic but clean textures, clear spatial hierarchy, exploded view, absolute pure white background, suitable for placing alongside text"
    Pedagogical_Center: "centered isometric pedagogical diagram, detailed skeuomorphic component breakdown of SPECIFIC RECOGNIZABLE OBJECTS described in Keywords, absolute pure white background, exploded view showing internal structure, high information density"
    Pedagogical_Grid: "isometric matrix of pedagogical components, detailed skeuomorphic breakdown of SPECIFIC RECOGNIZABLE OBJECTS described in Keywords, absolute pure white background, uniform spatial alignment"

  # 预编译 Prompt 模板
  prompt_templates:
    base_en: "isometric 2.5D architectural-grade diagram, highly detailed skeuomorphic component breakdown, exploded view, realistic but clean materials, clear spatial hierarchy, strict grid layout with subtle black outlines, high information density, white background, English text labels only on focal elements"
    suffix_negative: "flat 2D, purely abstract shapes, dada, photomontage, collage, messy, asymmetrical tension, dirty shadows, cyberpunk, neon colors, cartoons, clip art, busy background, chaotic, decorative noise, Chinese text, hex codes, color palettes, floating labels on background, annotations on non-essential equipment"
    
    # 教学锚定模板（RenderMode: pedagogical 专用）
    pedagogical_en: "isometric pedagogical diagram, skeuomorphic component breakdown of SPECIFIC RECOGNIZABLE OBJECTS from Keywords (each object must be clearly identifiable in 3D space), highly realistic but clean textures, exploded view showing internal structure, clear spatial hierarchy, absolute pure white background, high information density, English text labels only on focal elements"
    suffix_negative_pedagogical: "flat 2D, purely abstract shapes, dada, photomontage, collage, messy, asymmetrical tension, dirty shadows, cyberpunk, neon colors, cartoons, clip art, busy background, chaotic, decorative noise, unrecognizable abstract shapes, Chinese text, hex codes, color palettes, floating labels on background, annotations on non-essential equipment"
    text_directive: "All visible text in the image MUST be in ENGLISH, using modern sans-serif fonts. NO CHINESE CHARACTERS. Only label the most essential focal elements."

# 2. 色彩系统 (PPT / H5 / Python 通用)
palette:
  # 基础色 (Absolute White Mode)
  bg_base: "#FFFFFF"         # 纯白画布 (Pure White) — 降低一切外在负荷
  bg_surface: "#FFFFFF"      # 纯白卡片，无界限
  bg_elevated: "#F5F5F5"     # 极浅灰 (Slight Gray) — 仅用于必须的区块区隔
  bg_dark: "#0F0F0F"         # 极黑 (Absolute Black) — 反转区块
  
  # 品牌主色 (极高对比度)
  primary: "#000000"         # 纯黑 (Black) — 数据墨水的主体
  secondary: "#DA291C"       # 瑞士红 (Swiss Red) — 唯一的视觉高光，用于记忆锚点 (Von Restorff Effect)
  tertiary: "#555555"        # 深灰 (Dark Gray) — 次要层级结构线
  
  # 语义色 (极简映射)
  success: "#000000"         # 黑
  warning: "#DA291C"         # 红
  error: "#DA291C"           # 红
  info: "#555555"            # 灰
  
  # 文本色
  text_main: "#000000"       # 纯黑 — 极高可读性
  text_secondary: "#555555"  # 深灰
  text_muted: "#999999"      # 浅灰
  text_on_dark: "#FFFFFF"    # 纯白
  
  # 边框与分割
  border: "#E0E0E0"          # 极淡的结构线
  divider: "#000000"         # 粗黑线仅作大区位分割标志

# 3. 排版系统
typography:
  font_cn_primary: "Noto Sans SC"       # 无衬线几何体
  font_cn_body: "Noto Sans SC"
  font_cn_fallback: "Microsoft YaHei"
  font_cn_mac: "PingFang SC"
  
  font_en_primary: "Helvetica Neue"     # 瑞士体之魂，客观极简
  font_en_body: "Helvetica Neue"
  font_en_display: "Helvetica Neue"
  
  size_hero: 64
  size_h1: 44
  size_h2: 32
  size_body: 18
  size_caption: 14
  size_label: 12

# 4. 几何与动效参数
physics:
  stroke_width_base: 1    # 极细数据线 (1px)，强调精密感
  stroke_width_large: 4   # 粗线用于强结构分隔
  corner_radius_base: 0   # 强硬直角，客观数学感
  corner_radius_large: 0  
  cap_join_style: "square" 
  easing: "ease-out"       
  motion_short: "150ms"
  motion_medium: "300ms"

# 5. PPT 版式映射
ppt_layout_styles:
  Title:
    background: "bg_base"
    title_color: "text_main"
    accent: "secondary"
    effect: "none"
  List:
    background: "bg_base"
    title_color: "text_main"
    bullet_icon_color: "secondary" # 红色小方块
    effect: "none"
  Diagram:
    background: "bg_base"
    node_fill: "bg_base"
    node_border_color: "primary"
    line_color: "text_secondary"
    label_color: "text_main"
    accent: "secondary"
  Comparison:
    background: "bg_base"
    left_accent: "primary"
    right_accent: "secondary"
    divider_color: "border"
  Split:
    background: "bg_base"
    left_panel: "bg_base"
    right_panel: "bg_base"
    divider: "border"
  Grid:
    background: "bg_base"
    card_bg: "bg_base"
    card_border: "border"
    card_accent: "secondary"
  Image:
    background: "bg_base"
    caption_color: "text_muted"

# 6. 尺寸与比例标准
dimensions:
  ppt_slide:
    ratio: "16:9"
    width: 1920
    height: 1080
    suffix: "isometric pedagogical exploded view, pure white background"
  infographic:
    ratio: "16:9"
    width: 1920
    height: 1080
    suffix: "isometric skeuomorphic technical diagram, clear spatial layout"
  diagram:
    ratio: "1:1"
    width: 1080
    height: 1080
    suffix: "isometric component breakdown, white background"
  icon:
    ratio: "1:1"
    width: 512
    height: 512
    suffix: "isometric 2.5D skeuomorphic icon, pure white background"

# 7. 教学记忆优化专门路由 (Memory Optimization Routing)
# 本主题强制执行 "等距视角拟物拆解 (Isometric Skeuomorphic Breakdown)" 风格
pedagogical_routing: |
  ## 核心理念：写实拟物增强亲和力，组件拆解保证高信息量，等距视角构建空间层级
  
  所有的视觉生成必须融合张圣焕的“拟物化组件拆解”与安娜·库阿的“等距视角”：
  - 剔除绝对扁平和过度抽象的纯线框，引入具有真实材质质感（如塑料、金属、木材等）的拟物化设计。
  - 画面必须采用 Isometric (2.5D 等距视角)，展现立体空间结构。
  - 使用“爆炸图/组件拆解 (Exploded view / Component breakdown)”的方式展现物体内部构造和逻辑关系。
  - 保持背景为纯白，保留轻微的结构描边以确保清晰度。
  
  Step 1 - 锚点确认 (1:1 实体映射)：
    仔细阅读 [VISUAL] 块的 Scene 和 Keywords，提取最具体的实体名词（如“牛排和盐”、“X轴插槽”）。绝对禁止将其泛化或归类（禁止将“牛排”泛化为“食物”）。
  
  Step 2 - 文本与颜色代码净化 (Prompt Sanitization)：
    如果在 prompt 中需要指定颜色，必须将其转化为自然语言描述（如 "pure white", "swiss red accents"），绝对禁止将十六进制代码（如 #000000, #DA291C）直接写入 prompt 字符串，以防产生文本幻觉。
  
  Step 3 - 拟物与等距转化：
    将具体概念具象化为真实的物理对象，并将其置于等距视角（Isometric）下。例如逐字稿提到“牛排”，必须生成有着逼真肉类纹理的 2.5D 煎锅和牛排。
    
  Step 4 - 组件拆解与克制标注 (Exploded View & Focused Labeling)：
    在 prompt 中显式要求将物品进行结构拆解。如有必要出现标注文字，必须强制全英文，并严格限制仅标注最核心元素。明确指示 AI 禁止对背景环境、非核心设备添加多余标签。
    
  Step 5 - 纯净测试：
    生成后，检查画面背景是否为纯净的白色，文字是否均为英文且无十六进制代码幻觉，是否无多余干扰标注。不达标必须重绘。

