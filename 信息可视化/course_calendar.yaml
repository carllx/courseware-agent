calendar:
- week: 1
  chapter: 1
  chapter_title: 数据作为媒介
  chapter_subtitle: 格式塔感知与 Vibe 范式初探
  topic: 数据作为媒介：格式塔感知与 Vibe 范式初探
  content: 1.1 认知外显：视觉系统、格式塔重构与自然语言建模
  exp_id: 1
  hours_theory: 3
  hours_practice: 2
  teaching_requirements:
    knowledge: 理解数据可视化的基本概念与发展历程，掌握可视化有效性的基本分析框架
    ability: 初步体验无代码可视化工具与自然语言建模的映射关系
  focus: 可视化有效性的 What/Why/How 三大基石
  difficulty: 自然语言到视觉元素的映射关系理解
  ideology: 结合中国大数据发展战略，认识数据可视化在国家治理与社会服务中的作用
  teaching_method: 理论讲授、案例演示、工具实操
  lessons:
  - topic: 认知外显：视觉系统、格式塔重构与自然语言建模
    objectives:
    - 解释《信息可视化设计》第一、二章中从壁画到大数据的视觉隐喻演变脉络
    - 运用 Munzner Ch1 关于可视化有效性的 What/Why/How 框架分析图表设计
    - 应用格式塔四维认知框架（分组、层级、闭合、动态协同）诊断病理图表特征
    - 评估 RAWGraphs 与 Vibe Coding 双轨实战中的渲染效能差异与算法降噪机制
    - 创建针对真实数据图表的『格式塔靶向处方』，并执行极简降噪与视觉重构
    steps:
    - stage: 导入
      summary: '【课程情境导入】

        1. 首节课开篇介绍课程概况与评估方式，以安斯库姆四重奏案例引入可视化的认知价值

        2. 明确本节课核心聚焦点：可视化有效性的 What/Why/How 三大基石

        3. 激发学生学习动机与探索兴趣。'
      minutes: 25
    - stage: 讲授
      summary: '【核心理论与技能解析】

        1. 授课主线：视觉感知与前注意处理原理、格式塔原则的图表映射、Vibe Coding 范式介绍

        2. 知识点拆解：1.1 认知外显：视觉系统、格式塔重构与自然语言建模

        3. 重难点突破：针对“自然语言到视觉元素的映射关系理解”，采用案例剖析策略。

        4. 支撑目标：解释《信息可视化设计》第一、二章中从壁画到大数据的视觉隐喻演变脉络'
      ideology: 结合中国大数据发展战略，认识数据可视化在国家治理与社会服务中的作用
      minutes: 110
    - stage: 实践
      summary: '【课堂实践与操作训练】

        1. 实践任务指导：RAWGraphs 零代码数据映射与 AI 自然语言生成 (Vibe Coding) 初步比对实操

        2. 核心任务目标：自行选取一组合法公开数据集，运用 RAWGraphs 进行零代码映射探索，同时尝试撰写结构化 Prompt 驱动 AI 辅助工具生成对照图表。提交这两种范式下的图表产出及完整 Prompt 记录，配合 300
        字设计决策说明分析两者优劣。

        3. 教师巡回指导，及时发现并纠正学生实践中的认知偏差。'
      minutes: 75
    - stage: 小结
      summary: '【知识凝练与教学反思】

        1. 归纳梳理：回顾核心概念：可视化是认知外包而非装饰

        2. 强化记忆：系统性总结本节课核心知识点与技能框架。

        3. 布置课后延伸思考与预习任务。'
      minutes: 15
  supported_objectives:
  - 知识1
  - 素质1
  task: 自行选取一组合法公开数据集，运用 RAWGraphs 进行零代码映射探索，同时尝试撰写结构化 Prompt 驱动 AI 辅助工具生成对照图表。提交这两种范式下的图表产出及完整 Prompt 记录，配合 300 字设计决策说明分析两者优劣。
- week: 2
  chapter: 2
  chapter_title: 视觉叙事
  chapter_subtitle: 与符号隐喻
  topic: 视觉叙事与符号隐喻
  content: 2.1 不仅是数据，更是隐喻：构建符号的艺术表达
  exp_id: 2
  hours_theory: 3
  hours_practice: 2
  teaching_requirements:
    knowledge: 掌握视觉标记与通道的有效性法则，理解图表类型的符号隐喻机理
    ability: 能运用 AI 辅助工具进行基础图表的艺术化生成与矢量精修
    quality: 培养文化审美自觉，理解中西视觉叙事差异
  focus: 标记 (Marks) 与通道 (Channels) 的有效性排序法则
  difficulty: 如何基于数据语义选择恰当的视觉隐喻而非简单堆砌装饰
  ideology: 对比中西视觉叙事传统中的信息表达差异，培养文化审美自觉
  teaching_method: 理论讲授、案例对比分析、AI 辅助生成实操、矢量设计实践
  lessons:
  - topic: 不仅是数据，更是隐喻：构建符号的艺术表达
    objectives:
    - 基于《信息可视化设计》第三章理解图表的时空隐喻与类型选择
    - 掌握 Munzner Ch5/Ch6 中关于标记 (Marks) 与通道 (Channels) 的有效性法则
    - 通过 AI 辅助生成基础图表，对比色彩、形状等通道改变带来的艺术情绪差异
    - 掌握使用 Figma 进行矢量输出与排版精修
    steps:
    - stage: 复习
      summary: '【上次课知识回顾】

        1. 回顾 W01 核心概念：可视化作为认知外包，前注意处理原理

        2. 检查学生对前置知识的掌握情况，建立新旧知识的逻辑桥梁。'
      minutes: 10
    - stage: 导入
      summary: '【课程情境导入】

        1. 图表类型的时空隐喻——从 Excel 下拉菜单中跳出

        2. 明确本节课核心聚焦点：标记 (Marks) 与通道 (Channels) 的有效性排序法则

        3. 激发学生学习动机与探索兴趣。'
      minutes: 15
    - stage: 讲授
      summary: '【核心理论与技能解析】

        1. 授课主线：标记与通道有效性法则、视觉弹出死亡边界、数据墨水比原则与反 3D 饼图

        2. 知识点拆解：2.1 不仅是数据，更是隐喻：构建符号的艺术表达

        3. 重难点突破：针对“如何基于数据语义选择恰当的视觉隐喻而非简单堆砌装饰”，采用案例剖析策略。

        4. 支撑目标：基于《信息可视化设计》第三章理解图表的时空隐喻与类型选择'
      ideology: 对比中西视觉叙事传统中的信息表达差异，培养文化审美自觉
      minutes: 95
    - stage: 演示
      summary: '【核心理论与技能解析】

        1. 授课主线：Mini-Lab 介绍：电影作为数据——Movie Barcode 色彩指纹演示，展示逐帧色彩提取与 Marks/Channels 映射关系（待定拓展实践，详见 knowledge/notes/film-as-data-cinematic-visualization.md）

        2. 知识点拆解：2.1 不仅是数据，更是隐喻：构建符号的艺术表达

        3. 重难点突破：针对“如何基于数据语义选择恰当的视觉隐喻而非简单堆砌装饰”，采用案例剖析策略。

        4. 支撑目标：基于《信息可视化设计》第三章理解图表的时空隐喻与类型选择'
      minutes: 15
    - stage: 实践
      summary: '【课堂实践与操作训练】

        1. 实践任务指导：教师预制标本通道审计（Black Museum） + Figma SVG 外科手术精修三阶段对比实验

        2. 核心任务目标：从真实世界（新闻/财报/报告）狩猎一张通道映射严重错误的劣质数据图，结合教师提供的校园采样数据集或自选公开数据源，在 Figma 中按 Munzner 通道有效性与数据墨水比原则进行三阶段重建精修，提交三阶段对比图
        + 300 字通道决策报告。

        3. 教师巡回指导，及时发现并纠正学生实践中的认知偏差。'
      minutes: 75
    - stage: 小结
      summary: '【知识凝练与教学反思】

        1. 归纳梳理：总结标记-通道-隐喻三位一体的设计语法

        2. 强化记忆：系统性总结本节课核心知识点与技能框架。

        3. 布置课后延伸思考与预习任务。'
      minutes: 15
  supported_objectives:
  - 知识1
  - 能力1
  - 能力3
  task: 从真实世界（新闻/财报/报告）狩猎一张通道映射严重错误的劣质数据图，结合教师提供的校园采样数据集或自选公开数据源，在 Figma 中按 Munzner 通道有效性与数据墨水比原则进行三阶段重建精修，提交三阶段对比图 + 300
    字通道决策报告。
- week: 3
  chapter: 3
  chapter_title: 数据提炼
  readings:
  - 'Munzner Ch2 (What: Data Abstraction)'
  - 'Munzner Ch3 (Why: Task Abstraction)'
  chapter_subtitle: 与自然语言建模
  topic: 数据提炼与自然语言建模 (Specification)
  content: 3.1 看不见的冰山：从数据抽象到重塑 (Data Abstraction & Tidy Data)
  hours_theory: 3
  hours_practice: 2
  teaching_requirements:
    knowledge: 理解数据抽象与任务抽象的理论框架，掌握面向大模型的数据定义策略
    ability: 能独立完成复杂数据的结构化建模与清洗
    quality: 培养严谨求实的数据素养，强调数据治理中的诚信与规范意识
  focus: 数据类型抽象与 Tidy Data 规范化建模
  difficulty: 如何将非结构化的现实世界数据转化为面向大模型的规范化自然语言描述
  ideology: 强调数据治理中的诚信与规范意识，培养严谨求实的数据素养
  teaching_method: 理论讲授、作品解码分析、数据建模实操、AI 辅助清洗演练
  lessons:
  - topic: 看不见的冰山：从数据抽象到重塑 (Data Abstraction & Tidy Data)
    objectives:
    - 深入理解 Munzner 框架的 What（数据抽象）与 Why（任务抽象）核心体系
    - 掌握属性类型的精确辨析（量化/序数/分类）及其与 Key/Value 语义的绑定关系
    - 理解并践行 Hadley Wickham 的 Tidy Data（整洁数据）三原则
    - 熟练运用自然语言提示词（Prompt），指导 AI 完成复杂宽表到 Tidy Data 的清洗流
    steps:
    - stage: 复习
      summary: '【上次课知识回顾】

        1. 回顾 W02 标记与通道编码原则，引出数据质量对可视化的影响

        2. 检查学生对前置知识的掌握情况，建立新旧知识的逻辑桥梁。'
      minutes: 10
    - stage: 导入
      summary: '【课程情境导入】

        1. 展示 AI 面对未处理原始数据时的失败案例，引出数据抽象的必要性

        2. 明确本节课核心聚焦点：数据类型抽象与 Tidy Data 规范化建模

        3. 激发学生学习动机与探索兴趣。'
      minutes: 15
    - stage: 讲授
      summary: '【核心理论与技能解析】

        1. 授课主线：Munzner 数据抽象分类体系（What）、任务抽象漏斗（Why）、Tidy Data 三原则

        2. 知识点拆解：3.1 看不见的冰山：从数据抽象到重塑 (Data Abstraction & Tidy Data)

        3. 重难点突破：针对“如何将非结构化的现实世界数据转化为面向大模型的规范化自然语言描述”，采用案例剖析策略。

        4. 支撑目标：深入理解 Munzner 框架的 What（数据抽象）与 Why（任务抽象）核心体系'
      ideology: 强调数据治理中的诚信与规范意识，培养严谨求实的数据素养
      minutes: 110
    - stage: 实践
      summary: '【课堂实践与操作训练】

        1. 实践任务指导：自然语言结构化 Prompt 驱动 AI 清洗灾难级宽表为 Tidy Data

        2. 核心任务目标：从公开数据源获取一份原始宽表数据，利用 LLM Prompt 清洗为 Tidy CSV，并撰写约500字的数据抽象分析（Item/Attribute/Derive 策略）。

        3. 教师巡回指导，及时发现并纠正学生实践中的认知偏差。'
      minutes: 75
    - stage: 小结
      summary: '【知识凝练与教学反思】

        1. 归纳梳理：总结数据抽象到整洁化的全链路，预告下周用自然语言指挥 AI 进行 D3.js 创作

        2. 强化记忆：系统性总结本节课核心知识点与技能框架。

        3. 布置课后延伸思考与预习任务。'
      minutes: 15
  supported_objectives:
  - 知识2
  - 素质1
  - 素质2
  task: 从公开数据源获取一份原始宽表数据，利用 LLM Prompt 清洗为 Tidy CSV，并撰写约500字的数据抽象分析（Item/Attribute/Derive 策略）。
- week: 4
  chapter: 4
  chapter_title: 概念驱动创作
  readings:
  - 《信息可视化设计》第四章（中外设计师案例与方法论）
  - Munzner Ch7 (Arrange Tables — 四步空间排布语法)
  - Scott Murray Ch5 (Data — 数据绑定与 enter 模式), Ch6 (Drawing with Data — SVG 基础绘图)
  chapter_subtitle: 用设计语言指挥 D3.js
  topic: 概念驱动创作：用前三周的设计语言指挥 D3.js
  content: 4.1 从画布到代码画布：用你已学的视觉语法驱动 AI 创作 D3 图表
  exp_id: 3
  hours_theory: 2
  hours_practice: 3
  teaching_requirements:
    knowledge: 理解数据到视觉的映射在 D3.js 中的实现逻辑，掌握用设计概念而非代码术语驱动 AI 生成的方法
    ability: 能运用前三周所学的视觉设计概念构建精准的自然语言指令，指挥 AI 生成 D3.js 交互图表
    quality: 培养人脑构思视觉意象与 AI 实现代码细节的创作协作意识
  focus: 将 W01-W03 的设计理论转化为 AI 能理解的创作指令
  difficulty: 如何用已学的设计语言精准描述想要的视觉效果，使 AI 生成符合预期的 D3 图表
  ideology: 以中国数据新闻实践（澎湃新闻美数课、财新数据可视化）为例，展示本土数据叙事创新
  teaching_method: 概念回顾串联、AI 创作实操、作品审美研讨、沙箱协作调试
  lessons:
  - topic: 从画布到代码画布：用你已学的视觉语法驱动 AI 创作 D3 图表
    objectives:
    - 回顾并串联 W01 格式塔感知与 W02 标记与通道与 W03 数据抽象的完整概念链，形成概念到指令的翻译能力
    - 理解 D3.js 的核心设计哲学——数据驱动文档，即每一个数据点对应一个视觉元素
    - 掌握用艺术语言描述视觉映射规则的方法——什么数据对应什么形状与什么视觉属性
    - 在代码沙箱中体验 AI 生成 D3 图表的完整工作流，提取高品质 SVG 矢量源资产
    steps:
    - stage: 复习
      summary: |-
        【概念串联回顾——三周知识的汇流】
        1. 回顾 W01 格式塔：视觉分组、层级、闭合如何帮助我们在指令中描述图表的视觉层次
        2. 回顾 W02 标记与通道：矩形/圆/线是 D3 的画笔，位置/颜色/大小是 D3 的视觉属性——这些概念今天将从理论走向实战
        3. 回顾 W03 Tidy Data：整洁数据是 AI 生成图表的燃料——数据格式不对，指令再好也画不出图
      minutes: 15
    - stage: 导入
      summary: |-
        【课程情境导入】
        1. 从空间排布理论引入：折线图的谎言与饼图的原罪——图表类型选择的隐性陷阱
        2. 对比 W01 的 RAWGraphs（拖拽选菜单）vs 今天的 D3（用语言描述你想要的画面）——从点菜到写菜谱
        3. 明确本节课核心聚焦点：学会用你已经掌握的设计语言指挥 AI 创作 D3 图表
      minutes: 15
    - stage: 讲授
      summary: |-
        【核心理论与技能解析】
        1. D3 的设计哲学（用艺术语言讲解）：D3 = 数据驱动文档——你的数据就是颜料，D3 就是画布，你用自然语言告诉 AI 怎么画
        2. 视觉映射三要素（连接 W02 Marks/Channels）：什么数据、什么形状（矩形/圆形/线条）、什么属性（位置/颜色/大小）——这就是你写指令的核心框架
        3. 比例的艺术（用设计直觉讲比例尺）：500 个苹果不能画成 500 像素高——比例就像缩放画幅，把真实世界的数值缩进画布。告诉 AI 把数据范围按比例映射到图表高度就够了
        4. SVG 画布的上下颠倒：与 Figma/PS 不同，SVG 的 y 轴是从上往下增大的——这是 AI 生成图表中最常见的视觉 bug 来源，知道这一点就能快速定位问题
        5. Prompt 精准度示范：帮我画个柱状图 vs 用矩形标记表示每个城市的人口，高度按比例映射，颜色深浅对应增长率，从底部向上生长
      ideology: 以中国数据新闻实践（澎湃新闻美数课、财新数据可视化）为例，展示本土数据叙事创新
      minutes: 60
    - stage: 实践
      summary: |-
        【课堂实践与操作训练——D3 概念驱动三阶创作】
        1. 第一阶：基础出图（30 min）——使用 W03 清洗后的 Tidy 数据集，用自然语言指令要求 AI 生成一个基础 D3 柱状图，观察初次生成结果
        2. 第二阶：概念精修（40 min）——运用 W02 的标记/通道知识迭代指令：要求调整颜色映射、添加数据标签、修正比例关系，体验概念越精准则图表越接近设想
        3. 第三阶：艺术提取（50 min）——在沙箱中完成最终调优，导出 SVG 矢量源资产，在 Figma 中进行最终的艺术精修与排版
        4. 教师巡回指导，重点帮助学生从模糊描述过渡到精准的设计语言指令
      minutes: 120
    - stage: 小结
      summary: |-
        【知识凝练与教学反思】
        1. 归纳梳理：今天的核心收获——前三周学的每一个概念都是你与 AI 对话的设计词汇
        2. 强化记忆：概念越精准 AI 越听话——指令的质量取决于你的设计素养，而非编程技能
