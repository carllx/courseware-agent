student_analysis: '本课程面向数字媒体艺术专业大二学生（24级影视班/游戏班），已完成交互设计基础等先修课程。学生普遍具有较强的视觉审美与数字工具操作能力，但编程基础薄弱，数据处理经验有限。课程通过 Vibe Coding 自然语言驱动范式降低技术门槛，使学生能聚焦于视觉叙事与数据艺术的创意表达。

  '
