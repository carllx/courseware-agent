objectives:
  knowledge:
  - index: 1
    desc: 解释数据可视化与视觉编码的基本理论，分析数据类型、视觉通道映射规律，并评价跨学科知识在信息可视化设计中的整合策略
    mappings:
    - requirement: 2 专业知识
      point: 2.2 跨学科知识整合
      support_level: M
  - index: 2
    desc: 阐述数据抽象分类体系与 Tidy Data 整洁数据规范，构建面向大语言模型的结构化数据建模策略并验证其有效性
    mappings:
    - requirement: 2 专业知识
      point: 2.1 基础知识掌握
      support_level: H
  - index: 3
    desc: 列举网络拓扑、空间数据与交互操作的可视化原理及其差异，比较 Scrollytelling 叙事架构的设计方法论与传统展示方式的适用场景
    mappings:
    - requirement: 2 专业知识
      point: 2.2 跨学科知识整合
      support_level: H
  ability:
  - index: 1
    desc: 能够通过自然语言建模，灵活驱动 D3 或 ECharts 等高级框架进行复杂交互叙事的生成
    mappings:
    - requirement: 4 实际应用能力
      point: 4.1 专业技术实现能力
      support_level: M
  - index: 2
    desc: 能综合运用嵌套模型验证法与数据调研策略，独立完成从议题选择到交互原型设计的全流程规划
    mappings:
    - requirement: 3 创造性思维
      point: 3.2 独立创意思考与原创设计
      support_level: M
  - index: 3
    desc: 能运用矢量精修工具与生成艺术技法，将抽象数据转化为具有视觉冲击力与人文深度的数据艺术作品
    mappings:
    - requirement: 4 实际应用能力
      point: 4.1 专业技术实现能力
      support_level: H
  quality:
  - index: 1
    desc: 具备运用现代信息技术手段获取、整理与呈现数据的能力，能以数字信息化手段系统性解决可视化项目问题
    mappings:
    - requirement: 5 信息能力
      point: 5.2 信息收集与筛选
      support_level: M
  - index: 2
    desc: 具备数据治理中的诚信与规范意识，能在数据获取和可视化呈现中坚守学术伦理底线
    mappings:
    - requirement: 5 信息能力
      point: 5.1 信息应用
      support_level: H
  - index: 3
    desc: 能以数据艺术作品关照文化保护与社会公平等议题，在项目展示与互评中体现专业诚信与社会责任意识
    mappings:
    - requirement: 6 沟通表达
      point: 6.2 沟通策略和适应性
      support_level: M
student_analysis: |
  本课程面向数字媒体艺术专业大二学生（24级影视班/游戏班），已完成交互设计基础等先修课程。学生普遍具有较强的视觉审美与数字工具操作能力，但编程基础薄弱，数据处理经验有限。课程通过 Vibe Coding 自然语言驱动范式降低技术门槛，使学生能聚焦于视觉叙事与数据艺术的创意表达。
semester_config:
  start_date: '2026-03-02'
textbooks:
- title: 信息可视化设计
  author: 郝亚维, 张博文
  publisher: 电子工业出版社
  year: '2023'
  type: textbook
  citation: "郝亚维, 张博文. 信息可视化设计[M]. 北京: 电子工业出版社, 2023."
- title: Visualization Analysis & Design
  author: Tamara Munzner
  publisher: CRC Press
  year: '2014'
  type: reference
  citation: "Tamara Munzner. Visualization Analysis & Design[M]. Boca Raton: CRC Press, 2014."
calendar:
- week: 1
  chapter_title: "第一章 数据作为媒介：格式塔感知与 Vibe 范式初探"
  topic: 数据作为媒介：格式塔感知与 Vibe 范式初探
  content: 1.1 认知外显：视觉系统、格式塔重构与自然语言建模
  hours_theory: 3
  hours_practice: 2
  teaching_requirements:
    knowledge: 理解数据可视化的基本概念与发展历程，掌握可视化有效性的基本分析框架
    ability: 初步体验无代码可视化工具与自然语言建模的映射关系
  focus: 可视化有效性的 What/Why/How 三大基石
  difficulty: 自然语言到视觉元素的映射关系理解
  ideology: 结合中国大数据发展战略，认识数据可视化在国家治理与社会服务中的作用
  teaching_method: 理论讲授、案例演示、工具实操
  lessons:
  - topic: 认知外显：视觉系统、格式塔重构与自然语言建模
    objectives:
    - 解释《信息可视化设计》第一、二章中从壁画到大数据的视觉隐喻演变脉络
    - 运用 Munzner Ch1 关于可视化有效性的 What/Why/How 框架分析图表设计
    - 应用格式塔四维认知框架（分组、层级、闭合、动态协同）诊断病理图表特征
    - 评估 RAWGraphs 与 Vibe Coding 双轨实战中的渲染效能差异与算法降噪机制
    - 创建针对真实数据图表的『格式塔靶向处方』，并执行极简降噪与视觉重构
    steps:
    - stage: 导入
      summary: 首节课开篇介绍课程概况与评估方式，以安斯库姆四重奏案例引入可视化的认知价值
      minutes: 25
    - stage: 讲授
      summary: 视觉感知与前注意处理原理、格式塔原则的图表映射、Vibe Coding 范式介绍
      ideology: 结合中国大数据发展战略，认识数据可视化在国家治理与社会服务中的作用
      minutes: 110
    - stage: 实践
      summary: RAWGraphs 零代码数据映射与 AI 自然语言生成 (Vibe Coding) 初步比对实操
      minutes: 75
    - stage: 小结
      summary: 回顾核心概念：可视化是认知外包而非装饰
      minutes: 15
  supported_objectives:
  - 知识1
  - 素质1
  task: 自行选取一组合法公开数据集，运用 RAWGraphs 进行零代码映射探索，同时尝试撰写结构化 Prompt 驱动 AI 辅助工具生成对照图表。提交这两种范式下的图表产出及完整 Prompt 记录，配合 300 字设计决策说明分析两者优劣。
- week: 2
  chapter_title: "第二章 视觉叙事与符号隐喻"
  topic: 视觉叙事与符号隐喻
  content: 2.1 不仅是数据，更是隐喻：构建符号的艺术表达
  exp_id: 2   # 对应实验2「静态图表设计」启动周
  hours_theory: 3
  hours_practice: 2
  teaching_requirements:
    knowledge: 掌握视觉标记与通道的有效性法则，理解图表类型的符号隐喻机理
    ability: 能运用 AI 辅助工具进行基础图表的艺术化生成与矢量精修
    quality: 培养文化审美自觉，理解中西视觉叙事差异
  focus: 标记 (Marks) 与通道 (Channels) 的有效性排序法则
  difficulty: 如何基于数据语义选择恰当的视觉隐喻而非简单堆砌装饰
  ideology: 对比中西视觉叙事传统中的信息表达差异，培养文化审美自觉
  teaching_method: 理论讲授、案例对比分析、AI 辅助生成实操、矢量设计实践
  lessons:
  - topic: 不仅是数据，更是隐喻：构建符号的艺术表达
    objectives:
    - 基于《信息可视化设计》第三章理解图表的时空隐喻与类型选择
    - 掌握 Munzner Ch5/Ch6 中关于标记 (Marks) 与通道 (Channels) 的有效性法则
    - 通过 AI 辅助生成基础图表，对比色彩、形状等通道改变带来的艺术情绪差异
    - 掌握使用 Figma 进行矢量输出与排版精修
    steps:
    - stage: 复习
      summary: 回顾 W01 核心概念：可视化作为认知外包，前注意处理原理
      minutes: 10
    - stage: 导入
      summary: 图表类型的时空隐喻——从 Excel 下拉菜单中跳出
      minutes: 15
    - stage: 讲授
      summary: 标记与通道有效性法则、视觉弹出死亡边界、数据墨水比原则与反 3D 饼图
      ideology: 对比中西视觉叙事传统中的信息表达差异，培养文化审美自觉
      minutes: 95
    - stage: 演示
      summary: 'Mini-Lab 介绍：电影作为数据——Movie Barcode 色彩指纹演示，展示逐帧色彩提取与 Marks/Channels 映射关系（待定拓展实践，详见 knowledge/notes/film-as-data-cinematic-visualization.md）'
      minutes: 15
    - stage: 实践
      summary: 教师预制标本通道审计（Black Museum） + Figma SVG 外科手术精修三阶段对比实验
      minutes: 75
    - stage: 小结
      summary: 总结标记-通道-隐喻三位一体的设计语法
      minutes: 15
  supported_objectives:
  - 知识1
  - 能力1
  - 能力3
  task: 从真实世界（新闻/财报/报告）狩猎一张通道映射严重错误的劣质数据图，结合实验1清洗后的 Tidy 数据集，在 Figma 中按 Munzner 通道有效性与数据墨水比原则进行三阶段重建精修，提交三阶段对比图 + 300 字通道决策报告。
- week: 3
  chapter_title: "第三章 数据提炼与自然语言建模"
  topic: 数据提炼与自然语言建模 (Specification)
  content: 3.1 看不见的冰山：从数据抽象到重塑 (Data Abstraction & Tidy Data)
  exp_id: 1   # 对应实验1「数据获取与清洗」启动周
  hours_theory: 3
  hours_practice: 2
  teaching_requirements:
    knowledge: 理解数据抽象与任务抽象的理论框架，掌握面向大模型的数据定义策略
    ability: 能独立完成复杂数据的结构化建模与清洗
    quality: 培养严谨求实的数据素养，强调数据治理中的诚信与规范意识
  focus: 数据类型抽象与 Tidy Data 规范化建模
  difficulty: 如何将非结构化的现实世界数据转化为面向大模型的规范化自然语言描述
  ideology: 强调数据治理中的诚信与规范意识，培养严谨求实的数据素养
  teaching_method: 理论讲授、作品解码分析、数据建模实操、AI 辅助清洗演练
  lessons:
  - topic: 看不见的冰山：从数据抽象到重塑 (Data Abstraction & Tidy Data)
    objectives:
    - 深入理解 Munzner 框架的 What（数据抽象）与 Why（任务抽象）核心体系
    - 掌握属性类型的精确辨析（量化/序数/分类）及其与 Key/Value 语义的绑定关系
    - 理解并践行 Hadley Wickham 的 Tidy Data（整洁数据）三原则
    - 熟练运用自然语言提示词（Prompt），指导 AI 完成复杂宽表到 Tidy Data 的清洗流
    steps:
