    objectives:
    - 掌握 Munzner Ch7 表格数据空间排布的底层原理与布局选项
    - 利用文本向 AI 精准下达 ECharts 声明式图表的生成与配置要求
    - 挑战 D3.js 深度视觉定制：在代码沙箱 (Artifacts) 内浅层微调，提取绝美静态源数据 (SVG)
    - 培养人脑构思架构与AI填充代码的 Vibe 工作流协作感
    steps:
    - stage: 复习
      summary: 回顾 W03 数据类型体系与 Tidy Data 原则
      minutes: 10
    - stage: 导入
      summary: 从空间排布理论引入：折线图的谎言与饼图的原罪
      minutes: 15
    - stage: 讲授
      summary: Munzner Ch7 表格排布原理、ECharts 声明式架构、D3.js 比例尺与数据绑定
      ideology: 以国产开源框架 ECharts 的全球影响力为例，增强技术自信与开源贡献意识
      minutes: 65
    - stage: 实践
      summary: AI 驱动 ECharts 急速生成 + D3 审美微操与矢量提取竞速 + 双轨范式综合打样
      minutes: 120
    - stage: 小结
      summary: 对比声明式与指令式模型适用边界，强调代码沙箱对“提取极限画质源资产”的绝大红利
      minutes: 15
  supported_objectives:
  - 知识1
  - 知识2
  - 能力1
