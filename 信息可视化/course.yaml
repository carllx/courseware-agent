      minutes: 10
    - stage: 导入
      summary: 展示 AI 面对未处理原始数据时的失败案例，引出数据抽象的必要性
      minutes: 15
    - stage: 讲授
      summary: Munzner 数据抽象分类体系（What）、任务抽象漏斗（Why）、Tidy Data 三原则
      ideology: 强调数据治理中的诚信与规范意识，培养严谨求实的数据素养
      minutes: 110
    - stage: 实践
      summary: 自然语言结构化 Prompt 驱动 AI 清洗灾难级宽表为 Tidy Data
      minutes: 75
    - stage: 小结
      summary: 总结数据抽象到整洁化的全链路，预告 D3/ECharts 框架
      minutes: 15
  supported_objectives:
  - 知识2   # ISSUE-005修复：W3主题为 Tidy Data = 知识目标 2
  - 素质1
  - 素质2
  task: 从公开数据源获取一份原始宽表数据，利用 LLM Prompt 清洗为 Tidy CSV，并撰写约500字的数据抽象分析（Item/Attribute/Derive 策略）。
- week: 4
  chapter_title: "第四章 声明式生成与深层定制的 Vibe 指挥术"
  topic: 声明式生成 (ECharts) 与深层定制 (D3) 的 Vibe 指挥术
  content: 4.1 驾驭复杂：高低阶框架的语言驱动策略
  exp_id: 3   # 对应实验3「交互可视化开发」启动周
  hours_theory: 2
  hours_practice: 3
  teaching_requirements:
    knowledge: 掌握高低阶可视化框架的核心差异与应用场景
    ability: 能运用自然语言精准驱动 ECharts 与 D3.js 进行图表生成与深层定制
    quality: 培养人脑构思架构与 AI 填充代码的 Vibe 工作流协作感
  focus: ECharts 声明式配置与 D3.js 底层定制的差异化应用策略
  difficulty: 理解 D3.js 坐标系边界约束及高效运作沙箱提取绝美矢量图纸的组合方案
  ideology: 以国产开源框架 ECharts 的全球影响力为例，增强技术自信与开源贡献意识
  teaching_method: 理论讲授、框架对比演示、Vibe Coding 实操、协作调试
  lessons:
