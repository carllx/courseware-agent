- week: 5
  chapter_title: "第五章 数据情绪与生成艺术"
  topic: 数据情绪与生成艺术
  content: 5.1 无形之境：网络拓扑、地缘隐喻与力导向生成艺术
  hours_theory: 2
  hours_practice: 3
