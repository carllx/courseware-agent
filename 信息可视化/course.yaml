experiments:
- id: 1
  name: 数据获取与清洗
  type: 验证性
  hours: 4
  group_size: 1
  requirement: 必做
  objectives: |
    （一）建立数据处理基础意识，掌握将原始数据规范化为可视化就绪格式的完整流程。
    （二）能使用 Python（Pandas）或 AI 辅助识别缺失值、异常值，完成数据清洗。
    （三）掌握 Tidy Data 规范，将数据重构为每行一观测、每列一变量的标准格式。
  equipment: |
    1. 硬件：个人计算机（学校机房或自备）
    2. 软件：Windows 10+；Python / Jupyter Notebook、Excel（可选）、AI 辅助工具
  requirements: |
    （一）数据来源须为 Kaggle 或政府开放平台等公开合法渠道，并在报告中注明出处。
    （二）清洗操作须记录完整决策日志，说明每步清洗依据。
    （三）最终输出须符合 Tidy Data 三原则，并附数据描述报告。
  methods: |
    1. 从 Kaggle / 政府开放平台下载真实数据集（CSV / JSON）。
    2. 使用 Python（Pandas）或 AI 辅助识别缺失值、异常值，完成数据清洗。
    3. 将数据重构为 Tidy Data 格式（每行一个观测，每列一个变量）。
    4. 撰写数据描述报告：数据来源、字段说明、清洗决策记录。
  conclusions: |
    记录清洗前后数据的行列数变化及主要缺失/异常值的处理结果，说明 Tidy Data 转换逻辑，总结本次数据处理流程的关键经验。
  questions: |
    （一）Tidy Data 的三大原则是什么？违反各原则的数据形态分别称为什么？
    （二）在 AI 辅助清洗场景下，如何验证 AI 给出的清洗结果是否符合原始数据语义？
- id: 2
  name: 静态图表设计
  type: 设计性
  hours: 4
  group_size: 1
  requirement: 必做
  summary: 运用视觉编码理论（Munzner Marks & Channels）为真实数据选择合理图表类型，完成具有视觉隐喻意图的静态可视化作品。
  objectives: |
    （一）运用视觉编码理论（Munzner Marks & Channels）为真实数据选择合理图表类型。
    （二）掌握使用 AI 辅助生成图表并通过 Figma 进行矢量精修的工作流。
    （三）能够撰写设计说明，阐述视觉通道映射逻辑与视觉隐喻意图。
  equipment: |
    1. 硬件：个人计算机（学校机房或自备）
    2. 软件：Windows 10+；ECharts / RAWGraphs / D3.js（AI 辅助生成）、Adobe Figma
  requirements: |
    （一）需基于实验一的 Tidy Data 数据集进行图表设计，并说明数据类型与分析任务。
    （二）使用 AI 辅助生成至少 3 种不同类型的图表（可选：柱状/折线/散点/树图/热力图）。
    （三）须使用 Figma 或 CSS 对图表进行配色、字体、布局精修，提交精修前后对比。
  methods: |
    1. 基于实验一数据集，确定数据类型与分析任务（描述/比较/关系/分布）。
    2. 为每个任务选择合适的图表类型，说明视觉通道映射逻辑。
    3. 使用 AI 辅助生成至少 3 种图表（柱状/折线/散点/树图/热力图，任选）。
    4. 使用 Figma 或 CSS 对图表进行配色、字体、布局精修。
    5. 撰写设计说明：通道选择依据与视觉隐喻意图。
  conclusions: |
    总结所选图表类型与视觉通道的对应关系，分析精修前后视觉效果的提升要点，反思视觉编码选择的合理性。
  questions: |
    （一）当数据集同时包含分类型和数值型变量时，如何系统地选择最合适的视觉通道？
    （二）数据墨水比（Data-Ink Ratio）原则对图表精修有何指导意义？请结合实验案例说明。
- id: 3
  name: 交互可视化开发
  type: 综合性
  hours: 6
  group_size: 1
  requirement: 必做
  summary: 运用 Vibe Coding 工作流，基于 Web 技术实现具有响应式交互功能的可视化组件，完成从数据绑定到动效的完整前端开发。
  objectives: |
    （一）运用 Vibe Coding 工作流，基于 Web 技术实现具有响应式交互功能的可视化组件。
    （二）掌握分步提示词接力策略，驱动 AI 生成 ECharts 或 D3.js 组件并进行调试。
    （三）实现数据的动态加载与绑定（异步 fetch / CSV 解析），并添加前端过渡动效。
  equipment: |
    1. 硬件：个人计算机（学校机房或自备）
    2. 软件：Windows 10+；ECharts / D3.js、HTML + CSS + JS、GSAP / ScrollTrigger（可选）、AI 辅助工具
  requirements: |
    （一）须实现至少 2 种交互功能（筛选/缩放/详情提示/滚动叙事任选）。
    （二）采用分步提示词接力策略驱动 AI 生成代码，并保留 Vibe 工作流对话记录截图。
    （三）最终作品须在本地可完整运行，并录制至少 1 分钟的演示视频展示交互功能。
