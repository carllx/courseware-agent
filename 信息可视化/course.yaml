    per_class: true   # ISSUE-002修复：表示单班学时，影视班与游戏班均为 40学时
  introduction:
    content: '本课程针对数字媒体艺术（DMA）专业学生，旨在探讨将抽象冷硬的数据转化为富有情感与叙事张力的视觉表达。课程以"信息可视化设计"和"视觉分析基础"为理论基石，引入"Vibe Coding（自然语言驱动编程）"前沿范式。通过学习，学生将掌握从视觉意象构思、自然语言抽象建模到生成式艺术与复杂交互图表呈现的全新工作流，极大拓展数据处理能力与交互艺术表达力。

      '
    design: '课程结合人文理论讲授与 Vibe 驱动实践，重构传统的"数据→编程→图表"工程路线为"视觉意象设想→自然语言定义→AI引擎生成→交互修改"的艺术打磨流程。前期深耕视觉叙事、符号隐喻与数据艺术理论；中期运用自然语言熟练调度
      D3.js 与 ECharts 等高低阶框架进行生成创作；后期通过整合社会文化议题的数据调研，完成具有人文关怀与艺术深度的综合交互叙事原型开发与部署。

      '
teacher:
  name: 林昕
  title: 无
