course:
  name: 信息可视化设计
  code: CNFU003847
  semester: 2025-2026-2
  nature: 专业选修课
  credits: 2.0
  department: 设计学院
  major: 数字媒体艺术
  prerequisites: 交互设计基础
  resources_url: |
    1.校内在线教学平台（学习通课件发布、作业提交与互动讨论）。
    2.软件支持：Adobe Figma、Figma、Visual Studio Code、Node.js、RAWGraphs、FFmpeg、AI 辅助工具及 Python 运行环境。
    3.教室与实验室条件：投影设备、多媒体教室、计算机实验室。
