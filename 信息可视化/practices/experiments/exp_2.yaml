exp_id: 2
name: 网页信息提取与数据化
type: 设计性
hours: 6
group_size: 1
requirement: 必做
summary: 运用爬虫工具或大语言模型（LLM）提取网页中的非结构化信息，并将其转化为结构化数据，为后续可视化打下基础。
method_theory: 教师演示与学生动手操作相结合
objectives: |
  （一）掌握利用爬虫脚本或大语言模型（LLM）从网页中提取信息的策略。
  （二）能够清洗与整理非结构化信息，输出规范的结构化数据集（如 CSV / JSON）。
  （三）理解"从信息到数据"的预处理流程对后续可视化分析的决定性作用。
equipment: |
  1. 硬件：个人计算机
  2. 软件：现代浏览器（推荐 Chrome 或 Edge）、大语言模型辅助工具（如 ChatGPT、Claude 或 VSCode Agent）
requirements: |
  （一）选定一个包含目标信息的网页（须合法合规且具有提取价值）。
  （二）演示利用爬虫代码或大模型提示词（Prompt）提取信息的过程，并保留记录。
  （三）最终产出一份结构化、清洗干净的表格数据。
methods: |
  1. 确定数据来源与分析规律：结合个人兴趣自主选定目标网页（严禁使用“豆瓣读书”等教学案例），并重点观察和归纳翻页时 URL 参数的路由变化规律。避开无限下拉瀑布流网页。
  2. 获取结构模板：将目标网页右键“另存为”完整的本地 HTML 文件。
  3. 方案执行：将 HTML 模板和 URL 翻页规律提交给大模型（Agent），要求其生成用于浏览器后台（Console）运行的 JavaScript 爬虫脚本。
  3. 数据清洗：处理缺失值、格式化字段格式，导出为 CSV 或 JSON 文件。
  4. 撰写流程记录与心得。
conclusions: |
  总结非结构化网页信息向结构化数据转化的核心难点及工具效率对比。
steps:
- id: S1
  name: 1. 侦查网页与下载结构图纸
  guide_text:
  - '结合个人兴趣，选定一个包含目标信息的跨领域网页（例如：Steam 游戏排行、IMDB 电影、淘宝/京东商品、汽车之家报价等）。**严禁使用指南中的“豆瓣读书”作为作业目标。**'
  - '**避坑声明**：请确保该网页有传统的“下一页”翻页按钮。如果遇到页面往下拉自动加载更多内容（瀑布流）的网站（如小红书、抖音），请立即放弃并更换目标，因为无法通过简单 URL 规律翻页。'
  - '**侦查翻页规律（极其重要）**：在网页上手动点击“下一页”，观察浏览器顶部网址（URL）的变化规律（比如：第一页是 `?start=0`，第二页变成了 `?start=25`，推测每页步长为 25）。这是稍后必须交给 AI 的关键情报。'
  - '**下载本地模板**：在浏览器页面右键选择“另存为...”，将当前网页保存为一个单独的 HTML 文件。这相当于网页的结构图纸。'
  report_prompt:
  - type: text
    prompt: 请描述你选择该领域（如游戏、电影等）数据的业务初衷，并列出你观察到的 URL 翻页参数规律。
  - type: image
    prompt: 请粘贴一张截图，证明你已成功将该网页“另存为”本地的 HTML 文件。
- id: S2
  name: 2. 投喂图纸，让 AI 生成脚本
  guide_text:
  - '**投喂图纸**：将刚才保存的 HTML 文件作为附件上传发送给大模型（或放入 VSCode 供 Agent 读取）。'
  - '**下达指令**：向大模型下达明确的抓取要求，比如要抓取前几页、什么字段，不需要去猜测 HTML 标签，只需描述特征即可。'
  - '**运行与调试**：将大模型生成的 JavaScript 代码粘贴至浏览器的 F12 Console（控制台）运行。如果遇到红色报错，直接将报错文字发回给大模型让其修复。'
  report_prompt:
  - type: text
    prompt: 请附上你发给大模型的最终指令（Prompt），以及它为你生成的 JavaScript 核心抓取代码。
  - type: image
    prompt: 请粘贴一张截图，展示你成功将 HTML 文件投喂给大模型并让它读取的界面过程。
  - type: image
    prompt: 请粘贴信息提取过程中的执行界面截图（如代码运行界面、大模型对话界面）。
- id: S3
  name: 3. 数据清洗与规范化输出
  guide_text:
  - 对提取出来的原始数据进行清洗（Data Cleaning）：处理缺失值、修正错误的格式、删除不相关的噪点数据。
  - 将清洗后的数据整理为规范的结构化表格数据（例如 CSV 或 JSON 格式），确保它是符合 Tidy Data 标准的结构。
  report_prompt:
  - type: text
    prompt: 在数据清洗过程中，你发现了哪些脏数据（Dirty Data）？你是如何解决的？
  - type: image
    prompt: 请粘贴最终清洗干净并输出规范化的结构化数据（CSV/Excel）的界面截图。
analysis_prompts:
- '[对比传统爬虫与利用大语言模型（LLM）提取非结构化信息，它们在应对网页结构变化或文本模式不规律时各有什么优缺点？]'
- '[本次实验经历让你对“从信息到数据”的转化过程有了什么新认识？这为下一步的可视化分析打下了怎样的基础？]'
grading_rubric:
- dimension: 数据源拓展与规律归纳
  points: 20
  standard: 未使用教学案例，自主选择了具有拓展性（游戏、影视等）的网页目标；准确观察并归纳出了 URL 翻页参数规律，且成功下载了本地 HTML 文件模板。
- dimension: AI 协作与控制台执行
  points: 40
  standard: 能够将 HTML 文件投喂给模型并让其成功读取，配合正确的 Prompt 获取并在浏览器控制台中运行了 JS 代码。
- dimension: 数据清洗质量
  points: 30
  standard: 能识别并解决脏数据问题，最终输出的数据结构化规范、质量高。
- dimension: 理论反思
  points: 10
  standard: 能深刻对比不同提取工具的效率差异，理解信息向数据转化的难点。
