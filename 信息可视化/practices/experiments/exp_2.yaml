# exp_2.yaml — 增量数据层（元数据从 course.yaml experiments[id=2] 读取）
# Schema: .agent/templates/experiment_doc_schema.md
# 合规: rule_document_boundaries.md §4 + §6.5
exp_id: 2

steps:
  - id: "S1"
    name: "回顾实验一产出与数据洞见提炼"
    guide_text:
      - "打开你在实验一中通过 RawGraphs 生成的图表文件（SVG/PNG），回顾你的通道映射决策。"
      - "重新阅读你在实验一中撰写的设计说明，特别关注数据洞察发现部分。"
      - "思考以下问题：这些图表是否有效传达了你发现的数据规律？哪些视觉元素削弱了信息的清晰度？"
      - "在草稿纸或笔记中列出 2-3 条核心数据洞见，以及对应的视觉优化方向。"
    report_prompt:
      - type: text
        prompt: "请列出你从实验一的图表分析中提炼的 2-3 条核心数据洞见"
      - type: image
        prompt: "请粘贴你在实验一中导出的原始图表（作为优化前的基线）"
      - type: text
        prompt: "请简要说明原始图表在视觉表达上存在哪些不足之处"

  - id: "S2"
    name: "制定视觉优化策略"
    guide_text:
      - "根据你提炼的数据洞见，明确视觉优化的核心目标。可从以下维度入手："
      - "  - **层级强化**：是否需要通过字号、色彩对比度或布局重构突出关键信息？"
      - "  - **墨水比优化**：是否存在冗余的装饰元素（多余的网格线、背景色块、3D 效果）需要删减？"
      - "  - **信息聚焦**：是否需要通过标注、引导线或视觉锚点引导读者注意力？"
      - "  - **审美提升**：色彩方案、排版韵律、留白节奏是否可以优化？"
      - "选择你最擅长或最想尝试的工具（Photoshop / Illustrator / Figma / 手绘均可）。"
    report_prompt:
      - type: text
        prompt: "请说明你的视觉优化策略：你选择从哪个维度切入？为什么？"
      - type: text
        prompt: "请说明你选择使用的工具及其原因"

  - id: "S3"
    name: "执行视觉再加工"
    guide_text:
      - "将实验一的图表素材（SVG/PNG）导入你选择的工具中。"
      - "如果使用 **Figma / Illustrator**：导入 SVG 后可直接编辑矢量元素（路径、颜色、字体）。"
      - "如果使用 **Photoshop**：建议导入 PNG 后在新图层上进行视觉叠加设计。"
      - "如果选择 **手绘**：可在打印出的图表上进行标注、重绘或混合媒介创作，完成后拍照/扫描。"
      - "**核心要求**：你的视觉改造必须基于数据洞见驱动，而非纯粹的装饰美化。每一处视觉变动都应能解释其传达了什么数据信息。"
    report_prompt:
      - type: image
        prompt: "请粘贴视觉再加工过程中的关键步骤截图（至少 2 张，展示工具操作过程）"
      - type: text
        prompt: "请描述你在再加工过程中做出的最重要的 2-3 个视觉决策"

  - id: "S4"
    name: "前后对比与设计说明"
    guide_text:
      - "将优化前的原始图表与优化后的设计稿并排展示，形成清晰的对比。"
      - "撰写设计说明（≥400字），须包含以下三个部分："
      - "  1. **数据洞见提炼**：你从数据中发现了什么？这些发现如何影响了你的设计决策？"
      - "  2. **视觉优化策略**：你采取了哪些具体的视觉手段？每个手段对应解决什么问题？"
      - "  3. **前后对比分析**：优化前后在信息传达效率和审美品质上有何具体变化？"
    report_prompt:
      - type: image
        prompt: "请粘贴'优化前 vs 优化后'的完整对比展示图"
      - type: text
        prompt: "请撰写设计说明（≥400字），包含数据洞见提炼、视觉优化策略、前后对比分析三个部分"

analysis_prompts:
  - "[请总结你在本次视觉优化中最有效的一个设计决策，并解释它如何提升了数据的可读性]"
  - "[请对比零代码工具（RawGraphs）与你使用的再加工工具，在视觉表达自由度和数据准确性保障上各有什么优劣？]"
  - "[请反思：如果重新做一次，你会在实验一的 RawGraphs 映射阶段做出哪些不同的选择，以便为后续的视觉优化打下更好的基础？]"

grading_rubric:
  - dimension: "数据洞见提炼质量"
    points: 25
    standard: "能从实验一的图表中提炼出有深度的数据洞见，洞见与视觉优化决策之间有明确的因果关系。"
  - dimension: "视觉优化策略与执行"
    points: 35
    standard: "优化策略目标明确，执行到位，视觉改造基于数据驱动而非纯装饰，工具使用熟练。"
  - dimension: "前后对比说服力"
    points: 25
    standard: "对比展示清晰，设计说明详尽，能准确阐述优化前后在信息传达和审美品质上的变化。"
  - dimension: "设计说明文档规范性"
    points: 15
    standard: "设计说明≥400字，结构完整（洞见/策略/对比三部分），图文穿插规范。"
