exp_id: 2
name: 网页信息提取与数据化
type: 设计性
hours: 6
group_size: 1
requirement: 必做
summary: 运用爬虫工具或大语言模型（LLM）提取网页中的非结构化信息，并将其转化为结构化数据，为后续可视化打下基础。
method_theory: 教师演示与学生动手操作相结合
objectives: |
  （一）掌握利用爬虫脚本或大语言模型（LLM）从网页中提取信息的策略。
  （二）能够清洗与整理非结构化信息，输出规范的结构化数据集（如 CSV / JSON）。
  （三）理解"从信息到数据"的预处理流程对后续可视化分析的决定性作用。
equipment: |
  1. 硬件：个人计算机
  2. 软件：浏览器、Python 爬虫环境或大语言模型辅助工具（ChatGPT/Claude 等）
requirements: |
  （一）选定一个包含目标信息的网页（须合法合规且具有提取价值）。
  （二）演示利用爬虫代码或大模型提示词（Prompt）提取信息的过程，并保留记录。
  （三）最终产出一份结构化、清洗干净的表格数据。
methods: |
  1. 确定数据来源：分析目标网页的 DOM 结构或文本模式。
  2. 方案执行：编写轻量级爬虫脚本，或利用大模型进行模式识别与数据提取。
  3. 数据清洗：处理缺失值、格式化字段格式，导出为 CSV 或 JSON 文件。
  4. 撰写流程记录与心得。
conclusions: |
  总结非结构化网页信息向结构化数据转化的核心难点及工具效率对比。
steps:
- id: S1
  name: 1. 确定数据源与提取目标
  guide_text:
  - 选定一个包含目标信息的网页（例如新闻报道、商品列表、维基百科条目等）。
  - 确保目标网页的内容具有合法合规的可访问性，且具备提取价值的非结构化信息。
  - 明确你想要提取哪些字段（如：标题、时间、作者、分类、正文内容等）。
  report_prompt:
  - type: text
    prompt: 请简要描述你选定的目标网页及其 URL，并列出你计划提取的核心字段。
  - type: image
    prompt: 请粘贴目标网页的界面截图，并圈出你想要提取的信息区域。
- id: S2
  name: 2. 信息提取方案执行
  guide_text:
  - '**选择以下两种方式之一进行数据提取：**'
  - '**方式 A（爬虫脚本）**：利用 Python（如 BeautifulSoup/Scrapy）或现成爬虫工具（如 Web Scraper）编写抓取规则，并运行提取。'
  - '**方式 B（大语言模型 LLM）**：将网页文本复制给 ChatGPT / Claude 等大模型，并编写 Prompt 要求模型从中识别结构化信息并输出表格（如 Markdown 表格或 CSV）。'
  report_prompt:
  - type: text
    prompt: 你选择了哪种提取方式？请附上你编写的核心爬虫代码或大模型提示词（Prompt）。
  - type: image
    prompt: 请粘贴信息提取过程中的执行界面截图（如代码运行界面、大模型对话界面）。
- id: S3
  name: 3. 数据清洗与规范化输出
  guide_text:
  - 对提取出来的原始数据进行清洗（Data Cleaning）：处理缺失值、修正错误的格式、删除不相关的噪点数据。
  - 将清洗后的数据整理为规范的结构化表格数据（例如 CSV 或 JSON 格式），确保它是符合 Tidy Data 标准的结构。
  report_prompt:
  - type: text
    prompt: 在数据清洗过程中，你发现了哪些脏数据（Dirty Data）？你是如何解决的？
  - type: image
    prompt: 请粘贴最终清洗干净并输出规范化的结构化数据（CSV/Excel）的界面截图。
analysis_prompts:
- '[对比传统爬虫与利用大语言模型（LLM）提取非结构化信息，它们在应对网页结构变化或文本模式不规律时各有什么优缺点？]'
- '[本次实验经历让你对“从信息到数据”的转化过程有了什么新认识？这为下一步的可视化分析打下了怎样的基础？]'
grading_rubric:
- dimension: 数据源与目标定义
  points: 20
  standard: 目标网页选择合理，提取字段定义清晰明确。
- dimension: 提取方案执行与过程
  points: 40
  standard: 成功应用爬虫工具或大语言模型进行信息提取，代码/Prompt设计合理且过程完整截图。
- dimension: 数据清洗质量
  points: 30
  standard: 能识别并解决脏数据问题，最终输出的数据结构化规范、质量高。
- dimension: 理论反思
  points: 10
  standard: 能深刻对比不同提取工具的效率差异，理解信息向数据转化的难点。
questions: |
  （一）对比传统爬虫与大模型提取，它们在应对复杂网页结构时各有什么优缺点？
  （二）在数据清洗过程中，你遇到了哪些影响数据质量的问题？是如何解决的？
