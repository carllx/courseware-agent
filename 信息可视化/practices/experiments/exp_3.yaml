exp_id: 3
name: 多维信息可视化系统综合设计与实现
type: 综合性
hours: 10
group_size: 1
requirement: 必做
summary: 从数据获取、处理（数据到数据转换）到可视化的综合全流程实战，作为期末大实验，采用 A 卷（生活相关）和 B 卷（商业/专业相关）进行考察，工具不限，允许手绘。
method_theory: 教师演示与学生动手操作相结合
objectives: |
  （一）能够独立完成从原始数据处理（数据到数据转换）到最终视觉呈现的全流程。
  （二）针对不同卷面主题（A卷：生活类，B卷：商业专业类），展现准确的情感表达与数据洞察。
  （三）灵活运用不限工具（包含代码、设计软件或手绘），突破工具限制完成可视化创作。
equipment: |
  1. 硬件：个人计算机或手绘工具
  2. 软件/工具：不限（可使用 D3.js、RAWGraphs、Figma、PS、AI、或马克笔、水彩等传统手绘工具）
requirements: |
  （一）2025-2026-2学期将按照系统分配抽取 A 卷或 B 卷进行考核。
  （二）A卷考核要求：以生活相关的数据为主题，将生活中接触的数据转换成可视化。
  （三）B卷考核要求：模拟商业、专业相关的数据可视化过程。
  （四）工具要求：绝对开放，不限任何工具手段，鼓励采用手绘或综合媒材。
methods: |
  1. 明确卷面主题（生活类 vs 商业类），进行目标数据搜集或模拟。
  2. 执行"数据到数据转换"：完成数据的聚合、过滤、重计算或结构映射。
  3. 制定视觉隐喻与通道映射策略。
  4. 使用自选工具（数字或手绘）完成最终可视化产出。
  5. 提交作品并撰写综合报告。
conclusions: |
  反思全链路数据转换流程中的关键决策，以及所选工具（包含手绘等媒材）对最终表达效果的影响。
steps:
- id: S1
  name: 1. 题目分析与数据预处理（数据到数据转换）
  guide_text:
  - 请根据期末考核随机抽取的试卷类型（A卷：生活类数据；B卷：商业/专业类数据）明确你的设计主题。
  - 进行核心阶段：“数据到数据”的综合转换。运用代码（Python/JS）或数据处理软件对原始数据进行清洗、聚合、过滤、重映射等转换，提取适合目标隐喻的衍生指标。
  - 记录你的数据转换公式或重构逻辑。
  report_prompt:
  - type: text
    prompt: 你抽取的考卷是A卷还是B卷？请描述你的设计主题以及进行了哪些“数据到数据”的核心转换操作（如聚合、生成新变量等）。
  - type: image
    prompt: 请粘贴转换前与转换后的数据对比截图，或核心数据处理过程截图。
- id: S2
  name: 2. 视觉隐喻与通道映射策略
  guide_text:
  - 基于转换后的数据集，确定核心视觉隐喻表达（Visual Metaphor）。
  - 设计数据维度到视觉通道的映射规则（Marks & Channels）。例如，哪些字段映射到颜色、尺寸或坐标轴？为什么这样的映射有助于表达考卷主题的情感与洞察？
  report_prompt:
  - type: text
    prompt: 请列出你的通道映射表，并解释该策略如何有效地表达了生活气息（A卷）或商业洞察（B卷）。
- id: S3
  name: 3. 综合可视化实现与打磨
  guide_text:
  - 本环节工具绝对开放：你可以使用 D3.js、RAWGraphs、Figma 等数字工具，也可以使用马克笔、水彩、纸张等物理手绘媒介完成最终创作。
  - 完成从骨架构建到最终视觉呈现的全过程打磨，确保“数据墨水比”合理、信息层级分明且具备艺术表现力。
  report_prompt:
  - type: image
    prompt: 请提供至少两张创作过程中的过程记录截图或照片（如手绘草图、半成品等）。
  - type: image
    prompt: 【最终成果】请提供最终完成的综合数据可视化作品高清大图/截图。
analysis_prompts:
- '[回顾本次期末综合考核，你认为前期的“数据到数据转换”工作为最终的视觉效果贡献了多大价值？]'
- '[你选择的创作工具（数字软件、编程语言或手绘材质）为你赋予了哪些难以替代的表现力或情感张力？]'
grading_rubric:
- dimension: 数据转换与重构逻辑
  points: 40
  standard: 数据到数据转换过程清晰合理，衍生变量或聚合操作有据可依，准确响应 A/B 卷主题。
- dimension: 视觉映射与隐喻设计
  points: 30
  standard: 视觉通道映射准确（无越界或冲突），视觉隐喻巧妙且贴合主题情感。
- dimension: 最终表现力与媒介运用
  points: 30
  standard: 工具运用熟练（无论是手绘还是数字工具），排版设计美观，具有出色的视觉叙事张力和审美水平。
questions: |
  （一）你的"数据到数据转换"步骤是如何支撑最终的视觉映射的？
  （二）你选择的创作工具（数字软件或手绘）为你赋予了哪些独特的表现力？
