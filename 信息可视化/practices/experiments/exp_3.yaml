exp_id: 3
name: 多维信息可视化系统综合设计与实现
type: 综合性
hours: 10
group_size: 1
requirement: 必做
summary: 从数据获取、处理（数据到数据转换）到可视化的综合全流程实战，作为期末大实验，采用 A 卷（面向生活）和 B 卷（面向消费平台）进行考察，明确提供完全手绘与数据图表制作双轨表现思路。
method_theory: 教师演示与学生动手操作相结合
objectives: |
  （一）能够独立完成从原始数据处理（数据到数据转换）到最终视觉呈现的全流程。
  （二）针对不同卷面主题（A卷：面向生活，B卷：面向消费平台），展现准确的情感表达与深度的价值洞察。
  （三）灵活运用不限工具，掌握手绘隐喻表达或数据计算驱动的图表制作能力。
equipment: |
  1. 硬件：个人计算机或手绘工具
  2. 软件/工具：不限（可使用 D3.js、RAWGraphs、Figma、PS、AI、或马克笔、水彩等传统手绘工具）
requirements: |
  （一）2025-2026-2学期将按照系统分配抽取 A 卷或 B 卷进行考核。
  （二）A卷考核主题：面向生活的数据多维信息可视化系统。聚焦个人或公众生活相关的具体应用场景。
  （三）B卷考核主题：面向消费平台的数据多维信息可视化系统。聚焦数字经济与消费场景。
  （四）表现方式与思路：工具不限，一般采用以下两种思路之一：
        (a) 非传统物理媒介 / 手绘数据艺术：以手工质感或物质化隐喻为核心，用综合物理媒介“翻译”出富有生命力与温度的数据作品。警惕单纯的感性插画！一切视觉隐喻的背后必须有骨架支撑，必须与底层的数据严丝合缝地对应。你的创作是“数据长出了血肉”，而不是随心所欲的涂鸦。
        (b) 数字计算与生成艺术：搜集真实数据集，像雕塑家一样对数据进行深度的“揉捏与提炼”。你要刻意调用那些能瞬间触发人类视觉本能的特质（如刺眼的色彩、夸张的尺寸差异等）。用光影或色彩劈开层次，把无用噪音狠狠压暗，把核心情感焦点强行推到观众眼前。
  （五）制作过程核心步骤指引：
        第一步：数据收集。包括网络爬虫、现有的开源数据，或者自己使用思维导图的方式制定可视化的数据，并进行数据分类整理。
        第二步：可视化。可视化的过程工具不限，可以使用以下方式：(a) Vibe Coding 方式；(b) 手绘方式；(c) 使用 Illustrator 或 Figma 等制图软件。
        第三步：深度加工。在制作的过程中，有可能会发现新的洞见，或者进一步根据视觉引导对图表的样式进行加工。比如，将抽象的图表提炼成具象，使得数据图表更有温度，更容易被人接受吸收。
methods: |
  1. 明确卷面主题（生活类 vs 商业类），进行目标数据搜集或模拟。
  2. 执行"数据到数据转换"：完成数据的聚合、过滤、重计算或结构映射。
  3. 制定视觉隐喻与通道映射策略。
  4. 使用自选工具（数字或手绘）完成最终可视化产出。
  5. 提交作品并撰写综合报告。
conclusions: |
  反思全链路数据转换流程中的关键决策，以及所选工具（包含手绘等媒材）对最终表达效果的影响。
steps:
- id: S1
  name: 1. 题目分析与思路抉择（数据获取与预处理）
  guide_text:
  - 请根据期末考核随机抽取的试卷类型（A卷或B卷）明确你的设计主题，并确定选用“完全手绘”还是“使用数据”的思路。
  - "**任务抽象与问题定义**：写下一句核心的「领域问题（Domain Question）」，你要通过数据揭示什么？"
  - 对于使用数据思路：进行核心阶段“数据到数据”的综合转换。运用代码或数据处理软件对原始数据进行清洗、聚合、重映射。记录你的数据转换逻辑与**降噪决策**（剔除了哪些噪音，保留了哪些信号）。
  - 对于完全手绘思路：设计个人数据记录卡片，规划连续的跟踪搜集策略，梳理数据结构与过滤规则。
  report_prompt:
  - type: text
    prompt: 你的设计主题和核心领域问题是什么？选择了哪种实现思路？请描述你的前期数据准备或核心转换操作，并重点说明你的**信息降噪决策**（剔除了哪些无关维度，聚合了哪些冗余信息）。
  - type: image
    prompt: 请粘贴转换前与转换后的数据对比截图，或核心数据处理/降噪过程截图。
- id: S2
  name: 2. 视觉隐喻与通道映射策略
  guide_text:
  - 基于转换后的数据集，确定核心视觉隐喻表达（Visual Metaphor）。
  - 设计数据维度到视觉通道的映射规则（Marks & Channels）。进行通道的科学性检验：核对定类、定序、定量数据是否匹配了最高效的视觉通道（如定量数据勿滥用形状）。
  - "**注意力落点设计**：思考如何利用高饱和度颜色、亮度反差等“前注意属性”制造“跳出效应（Pop-out）”，在0.2秒内瞬间锁定你试图揭示的核心数据。"
  report_prompt:
  - type: image
    prompt: 请提供能够完全解码该作品的**「图例词典（Legend）」**截图。
  - type: text
    prompt: 请解释你的通道映射策略的科学性，以及你如何利用高对比度等前注意属性制造了视觉“跳出效应”，锁定了核心焦点？
- id: S3
  name: 3. 综合可视化实现与打磨
  guide_text:
  - "**版面规划与叙事流向设计**：在正式制作前，请先绘制版式网格（Grid）与视线流向（Flow）草图。利用格式塔原则（接近性、相似性、闭合性等）规划阅读区块，通过引导线或色彩建立连贯的视觉路径。"
  - 确保“数据墨水比”合理，强行建立图底分离（Figure-Ground），剥离视觉噪音。
  - 运用你选择的最终媒介（数字工具或物理手绘）完成全过程打磨。
  report_prompt:
  - type: image
    prompt: 【叙事流向规划】请上传你的版面结构草图，并用箭头标注出受众预期的视线移动轨迹（Eye-tracking Flow）。
  - type: text
    prompt: 简述你如何利用格式塔原理将几组图表串联为一个完整的故事？
  - type: image
    prompt: |
      【最终成果】请提供最终完成的综合整合信息设计作品高清大图/截图。
      - 如果制作的是静态图表：请直接贴入 JPEG 格式的高清截图。
      - 如果制作的是动态图表：请贴入视频的关键帧截图（最终动态作品本身需严格使用 H.264 编码，压缩成 MP4 格式，作为第二道题目独立上传）。
analysis_prompts:
- '[回顾本次期末综合考核，你认为前期的“数据到数据转换”工作为最终的视觉效果贡献了多大价值？]'
- '[你选择的创作工具（数字软件、编程语言或手绘材质）为你赋予了哪些难以替代的表现力或情感张力？]'
grading_rubric:
- dimension: 任务抽象与数据重构逻辑
  points: 40
  standard: 具备明确的问题导向，数据到数据转换与信息降噪决策清晰合理，衍生变量或聚合操作有效剔除噪音，准确响应主题。
- dimension: 视觉映射与隐喻设计
  points: 30
  standard: 底层图元拆解科学，视觉通道映射准确（遵循通道有效性原则），有效触发『前注意加工（跳出效应）』抢占观众注意力。视觉隐喻巧妙且无插画化倾向。
- dimension: 最终表现力与媒介运用
  points: 30
  standard: 版式具有高度整合性，视线流向（Eye-tracking Flow）与图底分离设计合理，叙事铺垫充分，能有效引发受众共情。
