# exp_2.yaml — 增量数据层（元数据从 course.yaml experiments[id=2] 读取）
# Schema: .agent/templates/experiment_doc_schema.md
# 合规: rule_document_boundaries.md §4 + §6.5
exp_id: 1

steps:
  - id: "S1"
    name: "1. Load your data"
    guide_text:
      - "打开浏览器，访问 RawGraphs 2.0 在线平台：https://app.rawgraphs.io/"
      - "**数据来源（三选一）**："
      - "  1. 可以选择使用老师提供的数据（如校园采样数据集 `student_data_expanded.csv`）。"
      - "  2. 自己准备并导入一份感兴趣的 CSV/Excel 数据集。"
      - "  3. 使用 RawGraphs 平台里面提供的已存在的数据模板（点击 'Try our samples!'）。"
      - "在 'DATA PARSING OPTIONS' 中检查数据类型解析：确保分类型字段解析为 `Aa String`，数值型字段解析为 `# Number`。"
    report_prompt:
      - type: text
        prompt: "请简要描述导入的数据集（行数、列数、核心字段含义）"
      - type: image
        prompt: "请粘贴数据成功加载以及 DATA PARSING OPTIONS 确认无误的界面截图"

  - id: "S2"
    name: "2. Choose a chart"
    guide_text:
      - "在界面中向下滚动到 '2. Choose a chart' 面板。"
      - "在本次先导体验中，请从以下三种经典图表中**选择其中一个**完成实践即可："
      - "  - **选项一：Alluvial Diagram（流向图）** —— 发现分类间的流动与分支"
      - "  - **选项二：Violin Plot（小提琴图）** —— 看透群体的分布身材"
      - "  - **选项三：Beeswarm Plot（蜂群图）** —— 对个体的终极尊重"
    report_prompt:
      - type: text
        prompt: "这三种图表分别属于哪种类型的可视化（如：层级、分布、比较等）？请简要说明"
      - type: image
        prompt: "请粘贴你选择图表类型时的界面截图（任选其一即可）"

  - id: "S3"
    name: "3. Mapping"
    guide_text:
      - "进入 '3. Mapping' 面板，将左侧的 Dimensions（数据维度）拖拽到右侧的 Chart Variables（图表变量）中："
      - "根据你选择的图表，参考以下映射思路（如果使用自带数据请灵活调整对应字段）："
      - "**[配置 A：流向图]**"
      - "  - Steps: 按顺序拖入 2-3 个分类字段"
      - "  - Size: 留空（自动按比例计算）"
      - "**[配置 B：小提琴图]**"
      - "  - X Axis: 留空"
      - "  - Size: 拖入数值型字段"
      - "  - Groups / Color: 拖入分类型字段"
      - "**[配置 C：蜂群图]**"
      - "  - X Axis: 拖入数值型字段"
      - "  - Color: 拖入分类型字段"
      - "  - Label: 拖入个体标识字段"
      - "  - Groups: 拖入分类跑道"
    report_prompt:
      - type: image
        prompt: "请粘贴你所选图表的 Mapping 面板变量映射配置截图及最终生成的图表截图"
      - type: text
        prompt: "【数据洞察】请描述你在该图表中观察到的有趣现象或群体规律"

  - id: "S4"
    name: "4. Customize"
    guide_text:
      - "在 '4. Customize' 面板中对图表进行视觉微调（如更改 Color Scale、调整宽高比例、开启 Show Labels）。"
      - "观察不同 Customize 参数对图表视觉表达（信息层级、对比度）的影响。"
      - "完成所有微调后，点击左下角的 Export，将最终图表导出为 SVG 或 PNG 格式。"
    report_prompt:
      - type: text
        prompt: "请描述你在 Customize 面板中做出的最重要的一项视觉调整，及其对信息传达的帮助"
      - type: image
        prompt: "请粘贴调整完毕后，准备导出的完整界面截图"

  - id: "S5"
    name: "5. Analysis"
    guide_text:
      - "结合刚才生成的图表，进行深度的交叉分析。"
      - "反思该图表类型在揭示数据隐藏规律（如分类流动、群体分布、个体差异）时的侧重点。"
    report_prompt:
      - type: text
        prompt: "【综合洞察】请综合分析：该图表中不同的视觉通道（如颜色、大小、位置）在揭示数据真相时，是如何相互配合的？"

analysis_prompts:
  - "[请回顾你在所选图表中的 Mapping 过程。该图表最核心的 1-2 个 Chart Variables 是什么？]"
  - "[对比你使用的图表与传统的柱状图/饼图，它们在表达数据特性（如分布形状、个体标记、流动关系）上有什么本质区别？]"
  - "[请结合本实践，谈谈为何掌握 Dimensions 到 Chart Variables 的映射关系能让你从图表模板的搬运工转变为数据世界的造物主？]"

grading_rubric:
  - dimension: "数据加载与类型解析"
    points: 20
    standard: "正确加载数据并在 DATA PARSING OPTIONS 中确认各字段类型无误。"
  - dimension: "图表选择与 Mapping 准确性"
    points: 40
    standard: "所选图表的 Dimensions 到 Chart Variables 的映射完全正确，截图清晰完整。"
  - dimension: "数据洞察深度"
    points: 30
    standard: "能深刻理解所选图表揭示的数据规律，如分布形态、分流情况或个体特征。"
  - dimension: "Customize 与理论反思"
    points: 10
    standard: "进行合理的视觉 Customize，对底层通道语法的反思深刻。"
