assessment_methods:
  normal_score_ratio: 50
  final_score_ratio: 50
  attendance_ratio: 10
  normal_items:
  - name: 章节测试一
    ratio: 20
    desc: 对应实验1「零代码图表映射与分析」。考核要求：通过 RAWGraphs 零代码平台完成多维数据的通道映射与图表生成。
  - name: 章节测试二
    ratio: 20
    desc: 对应实验2「网页信息提取与数据化」。考核要求：利用爬虫工具或大语言模型（LLM）提取网页非结构化信息，输出规范的结构化数据集。
  final_item:
    assessment_type: 实际操作
    name: 期末综合项目考查
    ratio: 100
    desc: 对应实验3「多维信息可视化系统综合设计与实现」。采用 A卷（生活数据）和 B卷（商业数据）分卷考核，涵盖数据到数据转换流程及可视化综合表现，工具不限（支持手绘）。
exams:
  final_exam:
  - name: 期末综合项目考查
    type: practice_ab
    total_score: 100
    duration: 120
    practice_paper:
      core_tech_points:
      - 灵活运用数据处理软件、可视化工具（RAWGraphs、D3.js 等）或手绘媒材完成数据转化与视觉映射
      - 掌握数据清洗重构逻辑，具备准确的情感表达与数据洞察能力
      submission_format: 完整的数据清洗处理说明文档及最终可视化分析呈现报告
      ab_versions:
        A:
          practice_theme: |
            基于“微观叙事与生命切片”的生活类数据艺术系统。
            聚焦个人或公众生活的具体切面（如情绪的起伏节律、公共健康的呼吸、出行轨迹的缠绕、睡眠生理的痕迹等）。
            本卷以「微观叙事」与「人文关怀」为核心，倡导用当代艺术的眼光重新审视日常。在这里，数据不仅仅是冰冷客观的数字流水账，更是反思人类生存状态的绝佳媒材。通过捕获日常生活中那些琐碎的数字，你需要无情地剥离它们平庸的表象，将原始记录“结晶”为具备叙事张力的情感线索。最终，你要让一副冷冰冰的数据骨架披上人文关怀的外衣，唤醒公众对个体体验与生命本质的深刻共情。
            工具不作限制，同学们可根据自身特长选择以下两种表达思路之一：
            (a) **非传统物理媒介 / 手绘数据艺术**：以手工质感或物质化隐喻为核心，用综合物理媒介“翻译”出富有生命力与温度的数据作品。警惕单纯的感性插画！一切视觉隐喻的背后必须有骨架支撑——你画下的每一个点、每一根线、每一次颜色的晕染，都必须与底层的数据严丝合缝地对应。你的创作是“数据长出了血肉”，而不是随心所欲的涂鸦。
            (b) **数字计算与生成艺术**：搜集真实数据集，像雕塑家一样对数据进行深度的“揉捏与提炼”。运用数字工具或生成算法时，你要刻意调用那些能瞬间触发人类视觉本能的特质（如刺眼的色彩、夸张的尺寸差异等）。你要用光影或色彩劈开层次，把背景的无用噪音狠狠压暗，把核心情感焦点强行推到观众眼前，制造出一种跃出画面的视觉冲击，让他们在第一眼就被你编织的情绪所捕获。
          practice_requirements: |
            （1）灵活运用数字工具或综合手绘媒材完成数据处理与编码映射，掌握数据清洗重构逻辑，具备准确的情感表达与数据洞察能力；
            （2）单人的形式制作；
            （3）制作过程原创，不得抄袭或者使用网上现成模板/模型；
            （4）必须同时提交：作者原创的视觉隐喻草图、严谨的「数据维度-视觉通道」映射关系说明（即解码图例词典），以及完整数据集及其来源说明。

            **制作过程核心步骤指引：**
            第一步：数据收集。包括网络爬虫、现有的开源数据，或者自己使用思维导图的方式制定可视化的数据，并进行数据分类整理。
            第二步：可视化。可视化的过程工具不限，可以使用以下方式：(a) Vibe Coding 方式；(b) 手绘方式；(c) 使用 Illustrator 或 Figma 等制图软件。
            第三步：深度加工。在制作的过程中，有可能会发现新的洞见，或者进一步根据视觉引导对图表的样式进行加工。比如，将抽象的图表提炼成具象，使得数据图表更有温度，更容易被人接受吸收。
          practice_deliverables: |
            文件以“学号+姓名+信息可视化”的方式命名，研究报告提供：完整的数据清洗与降噪处理说明文档，及最终整合信息设计作品（允许制作静态或动态的图表）。提交格式要求如下：
            (a) 静态图表：上传 JPEG 格式的图片截图。
            (b) 动态图表：以录制视频的形式递交。视频必须严格使用 H.264 编码，压缩成 MP4 格式再上传。

            2026年6月30日前。

            作业需在超星学习通通道上传，分别以“实验报告”以及“最终截图或视频”的形式，作为两道题目上传。逾期未提交且未提前申请缓考将视为学生旷考/缺考，请知悉。

            （1）2026年6月30日前，逾期未提交未提前缓考申请的，将视为自主放弃本次考核资格，并按旷考、缺考记录。
            （2）旷考、缺考或违纪作弊、抄袭（作品中所使用的主素材必须是作者原创，个别素材使用公共素材的，必须注明出处，否则视为作弊、抄袭），该门课程按照总成绩不合格处理，不允许参加重考。
            （3）重考、缓考使用的是期末正考未启用过的试题，重缓考学生不得提交过往提交过的作品（含个人或他人/队员作品），否则将作抄袭、作弊处理，成绩为0。
          practice_deadline: 2026年6月30日
          example_images:
          - assets/A卷/01_疫情生活切片_物理拼贴.webp
          - assets/A卷/02_寿命增长_手绘数据骨架.webp
          - assets/A卷/03_寿命增长_数字有机形态.webp
        B:
          practice_theme: |
            基于“数字剥削与系统透视”的消费平台数据艺术系统。
            聚焦当代数字经济、算法权力与消费场景（如电商造节狂欢下的冲动、外卖骑手被算法规划的轨迹、流量的分发逻辑、游戏内的氪金循环等）。
            本卷以「宏观批判与理性诊断」为主旨，要求以当代艺术的批判性眼光透视庞杂的商业逻辑。在被算法与流量裹挟的时代，你需要穿透海量消费行为的表象，从看似合理的系统中“榨取”出隐藏的漏洞与底层运行法则。揭露平台经济背后的真实商业动机、用户心理规训或社会资源的掠夺。希望你以视觉化的力量进行艺术发声，用数据不仅为理性的商业决策赋能，更要给现代数字消费主义一记发人深省的社会学拷问。
            工具不作限制，同学们可根据自身特长选择以下两种表达思路之一：
            (a) **非传统物理媒介 / 手绘数据艺术**：用充满生命力的传统物理媒介，去对抗冷酷无情的数字霸权系统。严禁退化为一张没有数据支撑的空洞海报！你的作品即使再充满批判性，也必须将批判的逻辑狠狠地钉死在客观数据的映射规则上。用手工的温度去触碰理性的系统，实现数据客观与感性批判的绝妙统一。
            (b) **数字计算与生成艺术**：搜集真实的商业数据集，进行硬核的重构。运用数字工具制图时，你必须在画面中建立起一套极具侵略性与秩序感的视觉层级。利用极致的反差对比或刺眼的警告色等视觉本能，无情地剥离背景噪音的干扰。你要做到的是：迫使观众在接触画面的第一秒，视线就被强制“绑架”，瞬间锁定在你所揭示的系统漏洞或商业真相之上。
          practice_requirements: |
            （1）灵活运用数字工具或综合手绘媒材完成数据处理与编码映射，掌握数据清洗重构逻辑，具备准确的情感表达与数据洞察能力；
            （2）单人的形式制作；
            （3）制作过程原创，不得抄袭或者使用网上现成模板/模型；
            （4）必须同时提交：作者原创的视觉隐喻草图、严谨的「数据维度-视觉通道」映射关系说明（即解码图例词典），以及完整数据集及其来源说明。

            **制作过程核心步骤指引：**
            第一步：数据收集。包括网络爬虫、现有的开源数据，或者自己使用思维导图的方式制定可视化的数据，并进行数据分类整理。
            第二步：可视化。可视化的过程工具不限，可以使用以下方式：(a) Vibe Coding 方式；(b) 手绘方式；(c) 使用 Illustrator 或 Figma 等制图软件。
            第三步：深度加工。在制作的过程中，有可能会发现新的洞见，或者进一步根据视觉引导对图表的样式进行加工。比如，将抽象的图表提炼成具象，使得数据图表更有温度，更容易被人接受吸收。
          practice_deliverables: |
            文件以“学号+姓名+信息可视化”的方式命名，研究报告提供：完整的数据清洗与降噪处理说明文档，及最终整合信息设计作品（允许制作静态或动态的图表）。提交格式要求如下：
            (a) 静态图表：上传 JPEG 格式的图片截图。
            (b) 动态图表：以录制视频的形式递交。视频必须严格使用 H.264 编码，压缩成 MP4 格式再上传。

            2026年6月30日前。

            作业需在超星学习通通道上传，分别以“实验报告”以及“最终截图或视频”的形式，作为两道题目上传。逾期未提交且未提前申请缓考将视为学生旷考/缺考，请知悉。

