assessment_methods:
  normal_score_ratio: 50
  final_score_ratio: 50
  attendance_ratio: 10
  normal_items:
  - name: 章节测试1
    ratio: 13
    desc: 对应实验1「零代码图表映射与分析」。考核要求：通过 RawGraphs 零代码平台完成多维数据的通道映射与图表生成，体现 Marks & Channels 有效性法则及视觉编码原理的运用，撰写通道映射逻辑与数据洞察分析。
  - name: 章节测试2
    ratio: 13
    desc: 对应实验2「洞见再加工与视觉优化设计」。考核要求：基于实验一的图表产出，运用自选工具（PS/AI/Figma/手绘）进行深度视觉再加工，展现数据洞见驱动的设计决策能力与审美品质，提交优化前后对比展示与设计说明。
  - name: 章节测试3
    ratio: 14
    desc: 对应实验3「交互可视化开发」。考核要求：运用自然语言概念驱动 D3.js 实现具有响应式反馈的可视化交互组件，体现 Vibe Coding 设计概念驱动的创作能力。
  final_item:
    name: 期末综合项目考查
    ratio: 100
    desc: 对应实验4「综合项目实战」。考核要求：围绕社会/文化议题完成交互数据艺术作品，涵盖数据处理与编码设计（30%）、交互叙事与技术实现（40%）、项目答辩与人文价值（30%）三个维度。详见 practices/project_brief.md。
exams:
  final_exam:
  - name: 期末综合项目考查
    total_score: 100
    duration: 120
    sections:
    - section_name: 数据处理与编码设计
      total_score: 30
      questions:
      - content: 对应实验4「综合项目实战」。考核要求：数据获取来源合法且具有社会价值，清洗流程规范并产出符合 Tidy Data 标准的结构化数据集；视觉编码遵循 Marks/Channels 有效性法则，色彩与形状通道的选择具有明确的数据语义支撑而非纯装饰。
        type: 综合性
        score: 30
    - section_name: 交互叙事与技术实现
      total_score: 40
      questions:
      - content: 对应实验4「综合项目实战」。考核要求：交互叙事架构完整，滚动/点击等交互行为与数据故事的节奏演进逻辑匹配；D3.js 框架运用得当，代码可运行且无严重渲染异常；作品已成功部署至公开可访问的数字平台，加载性能与响应式适配达到基本可用标准。
        type: 综合性
        score: 40
    - section_name: 项目答辩与人文价值
      total_score: 30
      questions:
      - content: 对应实验4「综合项目实战」。考核要求：课堂 Presentation 逻辑清晰、表达流畅，能在限定时间内完整阐述从选题动因、数据洞察到设计决策的全链路思考；作品所选社会/文化议题具有现实关照与人文深度，数据呈现严谨不误导，体现信息可视化的社会责任意识。
        type: 综合性
        score: 30
