assessment_methods:
  normal_score_ratio: 50
  final_score_ratio: 50
  attendance_ratio: 10
  normal_items:
  - name: 章节测试一
    ratio: 20
    desc: 对应实验1「零代码图表映射与分析」。考核要求：通过 RAWGraphs 零代码平台完成多维数据的通道映射与图表生成。
  - name: 章节测试二
    ratio: 20
    desc: 对应实验2「网页信息提取与数据化」。考核要求：利用爬虫工具或大语言模型（LLM）提取网页非结构化信息，输出规范的结构化数据集。
  final_item:
    name: 期末综合项目考查
    ratio: 100
    desc: 对应实验3「多维信息可视化系统综合设计与实现」。采用 A卷（生活数据）和 B卷（商业数据）分卷考核，涵盖数据到数据转换流程及可视化综合表现，工具不限（支持手绘）。
exams:
  final_exam:
  - name: 期末综合项目考查
    total_score: 100
    duration: 120
    sections:
    - section_name: 数据到数据的转换能力
      total_score: 40
      questions:
      - content: 对应实验3。考核要求：针对指定卷面主题（A卷：生活类，B卷：商业专业类），能够独立完成原始数据的搜集、清洗、重构和计算（数据到数据的转换），为后续可视化建立稳固的数据基座。
        type: 综合性
        score: 40
    - section_name: 视觉映射与综合表现力
      total_score: 60
      questions:
      - content: 对应实验3。考核要求：灵活运用不限的工具（可采用代码、设计软件或传统手绘方式），完成具有情感表达与数据洞察的最终可视化呈现，映射逻辑清晰、视觉表现力强。
        type: 综合性
        score: 60
