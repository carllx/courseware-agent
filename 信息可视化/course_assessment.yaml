          example_images:
          - assets/B卷/01_员工工时监控_微观规训.webp
          - assets/B卷/04_国际游客统计_系统流动.webp
          - assets/B卷/06_英超预测矩阵_冷酷算法.webp
    sections:
    - section_name: 数据抽象与编码映射
      total_score: 25
      questions:
      - type: 综合性
        score: 25
        content: '1. 数据来源真实且清洗规范，成功进行了“数据到数据”的重构转换。

          2. 视觉通道映射准确，严格遵循通道有效性原则，避免过度设计。

          3. 【A卷示例】侧重微观生活数据颗粒度；【B卷示例】侧重宏观消费数据的系统性呈现。'
    - section_name: 视觉隐喻与认知引导
      total_score: 25
      questions:
      - type: 综合性
        score: 25
        content: '1. 巧妙运用格式塔原理进行信息编排与图底分离，建立清晰视觉层级。

          2. 设计高反差属性（前注意加工）锁定核心注意力。

          3. 【A卷示例】隐喻具人文关怀与温度；【B卷示例】隐喻具客观理性与侵略性。'
    - section_name: 叙事结构与版式流向
      total_score: 25
      questions:
      - type: 综合性
        score: 25
        content: '1. 版面具起承转合的完整叙事结构，形成闭环的故事脉络。

          2. 视线流向合理，与数据解读逻辑高度一致。

          3. 文本标签与图表视觉深度融合（Signaling）。'
    - section_name: 技术实现与媒介表现
      total_score: 25
      questions:
      - type: 综合性
        score: 25
        content: '1. 灵活运用各种手段（手绘、插画、海报、或交互类图表），技术表现成熟，作品完成度极高。

          2. 【A卷示例】无论是手绘还是数字工具，媒介表现应契合微观生活叙事的情感温度。

          3. 【B卷示例】无论是手绘还是数字工具，媒介表现应满足宏观商业系统的客观性与信息密度要求。'
