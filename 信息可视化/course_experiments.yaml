experiments:
- id: 1
  name: 零代码图表映射与分析
  type: 设计性
  hours: 4
  group_size: 1
  requirement: 必做
  summary: 通过 RawGraphs 零代码可视化平台体验多维数据的通道映射，运用视觉编码理论（Munzner Marks & Channels）选择合理图表类型，完成具有视觉隐喻意图的静态可视化作品。
  objectives: '（一）掌握 RawGraphs 零代码可视化平台的完整工作流（数据加载→图表选择→通道映射→视觉定制→导出）。

    （二）运用视觉编码理论（Munzner Marks & Channels）为多维数据选择合理图表类型，理解不同图表类型揭示数据模式的差异。

    （三）能够撰写设计说明，阐述视觉通道映射逻辑、数据洞察发现与零代码工具的局限性反思。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备），需联网访问 RawGraphs 在线平台

    2. 软件：浏览器（Chrome/Edge）；RawGraphs 2.0（https://app.rawgraphs.io/）

    3. 数据：教师提供的校园采样数据集（student_data_expanded.csv）或 RawGraphs 内置示例数据集

    '
  requirements: '（一）须使用教师提供的校园采样数据集或 RawGraphs 平台内置示例数据集，并在报告中注明数据来源与字段说明。

    （二）须在 RawGraphs 中完成至少 3 种不同类型的图表映射（流向图 Alluvial、小提琴图 Violin、蜂群图 Beeswarm），并截图记录完整的映射配置。

    （三）须撰写设计说明（≥300字），包含通道映射逻辑、数据洞察发现与工具局限性反思。

    '
  methods: '1. 在 RawGraphs 平台加载数据（粘贴 CSV 或使用内置示例），检查数据类型解析是否正确（分类型 vs 数值型）。

    2. 从流向图（Alluvial Diagram）、小提琴图（Violin Plot）、蜂群图（Beeswarm Plot）等图表类型中配置维度到图表变量的通道映射。

    3. 在 RawGraphs 的 Customize 面板中调整颜色、尺寸、标签等视觉参数。

    4. 撰写设计说明：通道选择依据、数据洞察发现与零代码工具局限性反思。

    '
  conclusions: '总结 RawGraphs 零代码映射流程中的关键操作节点，对比不同图表类型揭示同一数据集不同维度的效果差异，反思零代码工具在排版与美化方面的局限性。

    '
  questions: '（一）在 RawGraphs 中，当数据集同时包含分类型和数值型变量时，如何系统地将它们映射到合适的图表变量（Steps/Size/Color/Groups 等）？

    （二）在缺少 Figma 矢量精修的情况下，你认为 RawGraphs 导出的图表在"数据墨水比"上是否存在不足？请结合实验案例说明。

    （三）RawGraphs 等零代码工具在视觉定制方面存在哪些局限？这些局限如何通过 Figma 矢量精修或代码框架（如 D3.js）弥补？

    '
- id: 2
  name: 洞见再加工与视觉优化设计
  type: 设计性
  hours: 4
  group_size: 1
  requirement: 必做
  summary: 基于实验一（RAWGraphs）的图表产出与数据洞察，运用不限工具（Photoshop / Illustrator / Figma / 手绘等）进行视觉二次优化设计，强调从数据分析总结中提炼洞见，并以视觉手段升华信息图表的表达力与审美品质。
  objectives: '（一）能够基于实验一的图表分析结果，提炼关键数据洞见并据此制定视觉优化策略。

    （二）运用数据墨水比、视觉层级、排版重构等原则，对零代码工具产出进行深层视觉改造。

    （三）不拘泥于特定工具，展现个人设计审美与信息传达能力，产出高保真设计稿。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备）；手绘工具（可选）；扫描仪或手机拍照（手绘方案适用）

    2. 软件：Adobe Photoshop / Illustrator / Figma（任选一种或多种）

    3. 素材：实验一导出的图表文件（SVG/PNG）

    '
  requirements: '（一）须以实验一中至少 1 种图表的导出成果（SVG/PNG）为基础素材进行再加工。

    （二）须撰写设计说明（≥400字），包含：数据洞见提炼、视觉优化策略、前后对比分析。

    （三）须提交"优化前 vs 优化后"的完整对比展示（至少 1 组）。

    '
  methods: '1. 回顾实验一的图表产出，总结数据分析发现与视觉表达不足之处。

    2. 制定视觉优化策略：明确优化目标（层级强化/墨水比优化/信息聚焦/审美提升）。

    3. 使用自选工具（PS/AI/Figma/手绘）进行深度视觉再加工。

    4. 撰写设计说明与前后对比分析报告。

    '
  conclusions: '总结从"零代码工具直接产出"到"设计师视觉再加工"的品质提升路径，反思数据洞见如何驱动视觉决策，以及不同工具在精修场景下的效率与表现力差异。

    '
  questions: '（一）在视觉优化过程中，你是如何将数据洞见转化为具体的视觉设计决策的？请举例说明。

    （二）对比你使用的再加工工具（PS/AI/Figma/手绘）与 RAWGraphs 零代码工具，在"视觉表达自由度"和"数据准确性保障"两个维度上各有什么优劣？

    '
- id: 3
  name: 交互可视化开发
  type: 综合性
  hours: 6
  group_size: 1
  requirement: 必做
  summary: 运用 Vibe Coding 工作流，基于 Web 技术实现具有响应式交互功能的可视化组件，完成从数据绑定到动效的完整前端开发。
  objectives: '（一）运用 Vibe Coding 工作流，基于 Web 技术实现具有响应式交互功能的可视化组件。

    （二）掌握分步提示词接力策略，驱动 AI 生成 D3.js 交互可视化组件并进行调试。

    （三）实现数据的动态加载与绑定（异步 fetch / CSV 解析），并添加前端过渡动效。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备）

    2. 软件：Windows 10+；D3.js、HTML + CSS + JS、GSAP / ScrollTrigger（可选）、AI 辅助工具

    '
  requirements: '（一）须实现至少 2 种交互功能（筛选/缩放/详情提示/滚动叙事任选）。

    （二）采用分步提示词接力策略驱动 AI 生成代码，并保留 Vibe 工作流对话记录截图。

    （三）最终作品须在本地可完整运行，并录制至少 1 分钟的演示视频展示交互功能。

    '
  methods: '1. 确定交互目标：筛选/缩放/详情提示/滚动叙事（Scrollytelling），至少实现 2 种。

    2. 采用分步提示词接力策略驱动 AI 生成 D3.js 交互可视化组件。

    3. 实现数据的动态加载与绑定（异步 fetch / CSV 解析）。

    4. 添加前端动效（过渡动画/hover 高亮/联动过滤）。

    5. 本地运行并录制演示视频。

    '
  conclusions: '总结 Vibe Coding 工作流中提示词迭代的关键策略，记录主要排错节点与解决方案，反思 AI 辅助前端开发与手动编码的优缺点对比。

    '
- id: 4
  name: 综合项目实战
  type: 综合性
  hours: 6
  group_size: 1
  requirement: 必做
  summary: 围绕真实社会/文化议题，独立完成具有人文关怀与艺术深度的交互数据叙事作品，实现从议题选择、数据调研到作品部署的全链路创作。
  objectives: '（一）围绕真实社会/文化议题，独立完成具有人文关怀与艺术深度的交互数据叙事作品并部署至公网。

    （二）综合运用嵌套模型验证方法与 Vibe Coding 全技术栈，完成从议题选择到交互原型的全流程规划。

    （三）能在 Peer Critique 中以建设性姿态表达专业反馈，并基于评审意见完成最终修订。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备）

    2. 软件：D3.js / GSAP、HTML + CSS + JS、GitHub Pages / Vercel（部署）、AI 辅助工具

    '
  requirements: '（一）选题须围绕真实社会/文化/生态议题，数据来源合法且具有人文价值。

    （二）须通过 Munzner 嵌套模型四层验证，提交项目一页纸逻辑推演文档。

    （三）作品须成功部署至 GitHub Pages 或 Vercel 等公开平台，提交在线访问链接。

    （四）须参与 Peer Critique 互评环节，并提交 Best Final Killer Prompt 分析报告。

    '
  methods: '1. 完成综合项目的自然语言逻辑推演，包含议题选择、嵌套模型验证、数据源清洗策略、Prompt 工程架构。

    2. 进行议题数据调研，完成数据获取与 Tidy Data 清洗。

    3. 基于 Scrollytelling 架构，完成全链路可视化生成与艺术封装。

    4. 完成最终项目的 Vercel / GitHub Pages 部署上线。

    5. 参加 Peer Critique 并进行 Final Presentation 答辩。

    '
  conclusions: '从选题动因、数据洞察到设计决策的全链路总结；记录 Best Final Killer Prompt 的构建逻辑；反思交互数据叙事的人文价值与社会责任担当。

    '
