# W08_practice.yaml — 大师鉴赏与终极冲刺
week: 8
title: "大师鉴赏与终极冲刺"
experiment_link: [4]
total_minutes: 90

theory_prerequisites:
  - "B01/B02/B03 大师与大国重器案例鉴赏"
  - "Hao Yawei 第6章：全链路生成与艺术封装"

phases:
  - id: P1
    name: "鉴赏反刍：大师作品逆向解构与审美拉升"
    minutes: 45
    type: workshop
    description: "从抽象/编码维度反推经典作品架构，提升期末项目的审美水平"
    tools: ["B01/B02/B03 大师与大国重器案例资料", "白板/协作文档"]
    steps:
      - "结合大师作品与大国重器案例，进行最终的审美拉升与设计反思"
      - "填写《大师级视觉重构对标单》，识别与大师作品的审美差距"
      - "运用 B03 案例研究方法论梳理最终的项目设计报告框架"
    theory_link: 
      - concept_id: "masterworks_appreciation"
        description: "大师与大国重器案例赏析"
    deliverables:
      - "《大师级视觉重构对标单》及项目报告框架"

  - id: P2
    name: "终极冲刺：排错、封装与全链路部署"
    minutes: 45
    type: lab
    description: "排除技术障碍，完成数据艺术项目的封装与上线"
    tools: ["Vercel/GitHub Pages", "VS Code", "Vibe Coding 工具"]
    steps:
      - "最后的数据清洗与底层 Bug 排查（应对原路报红抗压训练）"
      - "参照大师作品进行视觉与交互代码精修，赋予作品叙事连贯性"
      - "执行 Vercel / GitHub Pages 的正式公网部署实战"
    theory_link: 
      - concept_id: "full_stack_deployment"
        description: "全链路生成与正式上线部署"
    deliverables:
      - "已成功部署的项目线上链接"

homework:
  title: "完善期末结课报告"
  description: "基于本周的部署成果与 B03 案例研究方法论，撰写最终的结课报告"
  deliverables:
    - "期末结课报告及 Best Killer Prompt 总结"
