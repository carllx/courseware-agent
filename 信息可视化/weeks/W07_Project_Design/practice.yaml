# W07_practice.yaml — 数据情绪提取与项目启航
week: 7
title: "数据情绪提取与项目启航"
experiment_link: [4]
total_minutes: 90

theory_prerequisites:
  - "Hao Yawei 第5章：思维导图与信息地图"
  - "Munzner 嵌套模型四层验证"

phases:
  - id: P1
    name: "案例推演：基于学生真实对话的开题模拟"
    minutes: 45
    type: workshop
    description: "分析 B04 学生真实开题记录，提炼数据情绪与可视化映射策略"
    tools: ["B04_教学指导对话与学生课题集", "白板/协作文档"]
    steps:
      - "分组领取指定的同侪学生开题案例（如崔雯茜的《铁肺》、林良广的宿舍生命周期）"
      - "填写《开题逻辑解剖表》（提炼数据来源、情绪锚点与目标图表类型）"
      - "运用嵌套模型讨论该开题设计可能存在的级联崩塌风险"
      - "总结并转化用于自己期末项目的设计模式"
    theory_link: 
      - concept_id: "hao_info_map"
        description: "第5章：信息地图与数据情绪应用"
    deliverables:
      - "《开题逻辑解剖表》"

  - id: P2
    name: "项目立项与交叉防御 Critique"
    minutes: 45
    type: critique
    description: "展示初步选题并进行基于嵌套模型的互相 Critique"
    tools: ["白板", "协作文档"]
    steps:
      - "各组快速 Pitch 期末选题（聚焦人文关怀与宏大议题）"
      - "针对选题，其他组扮演『红军』发起嵌套模型四层防御挑战"
      - "评估数据获取难度与可视化渲染风险"
      - "确立最终选题与下周的开发时间线"
    theory_link: 
      - concept_id: "munzner_nested_model"
        description: "M04/M05 嵌套模型与互评"
    deliverables:
      - "期末项目立项确认书"

homework:
  title: "完善期末项目数据源储备"
  description: "根据 Critique 意见，收集清洗首批核心数据，为下周冲刺做准备"
  deliverables:
    - "首批清理好的 Tidy CSV 数据集"
