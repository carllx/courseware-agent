# W07_practice.yaml — 大师逆向工程与项目启航
week: 7
title: "大师逆向工程与项目启航"
experiment_link: [4]
total_minutes: 90

theory_prerequisites:
  - "Munzner 嵌套模型四层验证"
  - "Hao Yawei 第4、6章案例解构框架"

phases:
  - id: P1
    name: "鉴赏反刍：大师作品逆向解构"
    minutes: 45
    type: workshop
    description: "从抽象/编码维度反推经典作品的架构设计"
    tools: ["教材案例资料", "白板/协作文档"]
    steps:
      - "分组领取指定的经典信息可视化作品案例"
      - "填写《逆向工程解剖表》（识别 Data Abstraction 与 Visual Encoding）"
      - "运用嵌套模型讨论该作品为何没有发生级联崩塌"
      - "总结可复用于期末项目的设计模式"
    theory_link: 
      - concept_id: "hao_masterworks"
        description: "M02/M03 大师作品解构"
    deliverables:
      - "《逆向工程解剖表》"

  - id: P2
    name: "项目立项与交叉防御 Critique"
    minutes: 45
    type: critique
    description: "展示初步选题并进行基于嵌套模型的互相 Critique"
    tools: ["白板", "协作文档"]
    steps:
      - "各组快速 Pitch 期末选题（聚焦人文关怀与宏大议题）"
      - "针对选题，其他组扮演『红军』发起嵌套模型四层防御挑战"
      - "评估数据获取难度与可视化渲染风险"
      - "确立最终选题与下周的开发时间线"
    theory_link: 
      - concept_id: "munzner_nested_model"
        description: "M04/M05 嵌套模型与互评"
    deliverables:
      - "期末项目立项确认书"

homework:
  title: "完善期末项目数据源储备"
  description: "根据 Critique 意见，收集清洗首批核心数据，为下周冲刺做准备"
  deliverables:
    - "首批清理好的 Tidy CSV 数据集"
