  scene_excerpt: 一张具有赛博解剖学风格的人类眼球到大脑神经通路解析图。一条红色的高速高亮轨迹代表光信号由视网膜（Retina）向初级视觉皮层（V1）传输的路径，而在它尚未到达处理理性认知的前额叶（Prefrontal Cortex）之前，就被一道写着
