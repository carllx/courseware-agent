# W02_practice.yaml — 通道审计与 Figma 外科手术
week: 2
title: "通道审计与 Figma 外科手术"
experiment_link: "实验1"
total_minutes: 90  # hours_practice=2 → 2×45=90

theory_prerequisites:
  - "Marks & Channels 有效性排序法则"
  - "数据墨水比 (Data-Ink Ratio) 原则"
  - "Munzner 通道量表"

phases:
  - id: P1
    name: "任务场景锚定与受众画像"
    minutes: 15
    type: workshop
    description: "下发场景任务卡 + 预制错误 SVG 标本，明确分析任务和受众"
    tools: ["学习通"]
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "课堂实战打卡与交互记录"
    materials:
      - type: dataset
        title: "本周占位验证数据集"
        file: "assets/practice/placeholder_data.csv"
        format: csv
        schema:
          keys: ["id"]
          values: ["value"]
          types:
            id: categorical
            value: quantitative

  - id: P2
    name: "Black Museum 通道审计"
    minutes: 30
    type: workshop
    description: "SVG 解构 → 通道审计表填写 → 映射错误诊断"
    tools: ["Figma"]
    steps:
      - "下载 Black_Museum_Case_X.svg"
      - "Figma Release Mask 解构为基础几何原子"
      - "对照 Munzner 通道量表填写审计表"
      - "标注致命映射错误"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "通道审计表"

  - id: P3
    name: "SVG 外科手术三阶段精修"
    minutes: 45
    type: practice
    description: "解构 → 通道重建 → 冗余决策对比实验"
    tools: ["Figma"]
    steps:
      - "Phase A: Release Mask 暴力解构，剥离所有节点"
      - "Phase B: 按正确 Task 选高效通道，重新拼合数据点"
      - "Phase C: 冗余决策对比——极简版 vs 受众适配版"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "三阶段对比图（原始→骨架→精修）"
      - "300 字通道决策与冗余权衡报告"
    theory_link: "Marks/Channels 有效性 + Data-Ink Ratio"

homework:
  title: "通道审计独立实战"
  description: "从真实世界狩猎劣质数据图，三阶段外科手术精修"
  experiment_data_link: "实验1 Tidy 数据集"
  weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
    - "原始劣质图截图"
    - "Figma 通道修正重建图"
    - "最终美学精修图"
    - "300 字通道决策审计书"
