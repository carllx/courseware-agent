# W06_practice.yaml — Scrollytelling 交互叙事实战
week: 6
title: "GSAP Scrollytelling 交互叙事实战"
experiment_link: "实验3"
total_minutes: 135  # hours_practice=3 → 3×45=135

theory_prerequisites:
  - "Munzner 交互分类体系 (Select/Navigate/Arrange/Change/Filter/Aggregate/Annotate)"
  - "Shneiderman 概览-缩放-过滤-按需细节 (Overview+Detail)"
  - "GSAP ScrollTrigger 滚动驱动动画机制"
  - "Scrollytelling 叙事长卷范式"

phases:
  - id: P1
    name: "交互灾难反面赏析"
    minutes: 20
    type: discussion
    description: "'被交互逼疯的瞬间'——鉴赏反面 UI 灾难案例"
    tools: ["学习通"]
    steps:
      - "展示过度交互/缺失交互的反面案例"
      - "小组讨论：识别违反 Shneiderman 原则的设计缺陷"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "课堂实战打卡与交互记录"
    materials:
      - type: dataset
        title: "本周占位验证数据集"
        file: "assets/practice/placeholder_data.csv"
        format: csv
        schema:
          keys: ["id"]
          values: ["value"]
          types:
            id: categorical
            value: quantitative

  - id: P2
    name: "分镜狂魔集训"
    minutes: 25
    type: workshop
    description: "手绘 Scrollytelling 分镜剧本——构思数据故事的滚动触发节奏"
    tools: ["纸笔", "Figma"]
    steps:
      - "选定自选社会议题"
      - "手绘至少 4 个触发步骤的分镜草图"
      - "标注每步的数据变换、图表类型与交互类型"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "4+ 步分镜草图"
    theory_link: "Scrollytelling 叙事节奏设计"

  - id: P3
    name: "GSAP + D3.js 高燃落地实战"
    minutes: 80
    type: practice
    description: "运用 AI 建立边界分明的双引擎协作——Scrollytelling 长卷开发"
    tools: ["Claude/DeepSeek", "VS Code/Cursor", "浏览器"]
    steps:
      - "使用 AI 搭建 GSAP ScrollTrigger 基础触发器骨架（不涉及任何视图绘制）"
      - "在 ScrollTrigger 触发点回调内，调用 D3.js 渲染函数和 .transition() 动画机制"
      - "至少实现 4 个维度的滚动响应：数据过滤渲染、位置空间重布、SVG 颜色通道过渡、标注与叙事渐入"
      - "通过隔离控制（GSAP管时机，D3管画面），极速调试排错直至体验顺畅"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "Scrollytelling 单页面长卷 HTML"
    theory_link: "GSAP ScrollTrigger + Munzner 交互分类"

  - id: P4
    name: "互评复盘"
    minutes: 10
    type: critique
    description: "同桌互审 Scrollytelling 作品的叙事节奏与交互合理性"
    tools: []
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "课堂实战打卡与交互记录"

homework:
  title: "Scrollytelling 叙事长卷交付"
  description: "基于自选社会议题数据，利用 AI 生成 GSAP ScrollTrigger 驱动 D3.js 的交互叙事单页面。"
  weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
    - "完整 Scrollytelling HTML 源文件（严格包含至少 4 幕由数据支撑的滚动触发动画）"
    - "基于 Shneiderman 概览缩放框架的动效分镜拆解文档"
