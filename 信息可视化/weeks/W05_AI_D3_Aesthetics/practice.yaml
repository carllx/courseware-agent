# W05_practice.yaml — 词云美学、情感共鸣与视觉隐喻
week: 5
title: "词云的理论张力：从分析批判到审美探索的 D3.js Vibe Coding"
experiment_link: [4, 5]
total_minutes: 135

theory_prerequisites:
  - "分析型批判：Tamara Munzner 的通道有效性与面积感知失真"
  - "审美与探索型辩护：Social Signaller (Hearst) 与 Information Flâneur (Dörk & Hinrichs)"
  - "参与式媒介与情感共鸣 (Viégas & Wattenberg)"
  - "D3.js 与第三方布局引擎 (d3-cloud) 的异步渲染"

phases:
  - id: P1
    name: "实践四：词云引擎的算法与防雷"
    minutes: 60
    type: practice
    description: "引入 d3-cloud 引擎，通过 Bug-driven Prompting 克服异步布局渲染的崩溃，并强制应用面积映射法则。"
    tools: ["Claude/DeepSeek", "VS Code/Cursor", "浏览器"]
    steps:
      - "载入强情感色彩的数据集（例如《考研焦虑互助区的高频词汇》或《热门争议事件弹幕池》）。"
      - "意图驱动调参：向 Agent 发送指令，要求使用 d3-cloud 布局，并通过阿基米德螺旋实现紧凑排版。"
      - "部署视觉防雷脚手架：由于面积映射是二维增长，绝对禁止使用 d3.scaleLinear，强制要求 AI 使用 d3.scaleSqrt 来映射字号，防止最大词语形成极端的视觉霸权。"
      - "色彩审美对焦：命令 AI 弃用随机色，改用感知均匀且安全的分类色板（如 d3.schemeCategory10），在深色背景中实现清晰易读的字词渲染。"
    weight: "25%"
    scoring_rubric:
      full_marks: 100
      criteria: |
        - 维度一(50分)：成功拉起含有强情感色彩的词云图，未发生重叠碰撞。
        - 维度二(50分)：提交的代码或 Prompt 必须明确体现“使用 d3.scaleSqrt 处理二维字号映射”的意图。
    deliverables:
      - "D3 Word Cloud HTML 源文件"
      - "排雷过程（Bug-driven Prompting）的对话截图"
    theory_link:
      - concept_id: "area_mapping_distortion"
        description: "面积映射与 d3.scaleSqrt"
    materials:
      - type: dataset
      - title: "强情感语料：年度网络热门弹幕聚合"
      - file: "assets/practice/emotion_words.csv"
      - format: csv

  - id: P2
    name: "实践五：分析师时刻 —— 词云的理论沙盘对撞 (The Aha Moment)"
    minutes: 75
    type: workshop
    description: "在完成沙盘构建后，学生通过切换『理论视角』，深刻体验词云在不同学术框架下的成败。"
    tools: ["浏览器", "Word/Markdown"]
    steps:
      - "Munzner 的凝视（分析模式）：尝试从词云中准确找出身材差不多大的第 5 高频词和第 6 高频词，体验面积感知的误差与空间通道浪费的无力感。"
      - "Flâneur 的漫游（审美模式）：退后半步，不要阅读具体文字，感受整个图形传达的 'Social Signaller' 氛围（如焦虑、狂热或欢愉）。"
      - "反直觉语义对撞：提问自己 '这幅根本无法用于精准业务分析的图，为何能引起如此大的情感共鸣？'"
      - "提炼 Aha Moment：撰写可视化分析报告，对比分析型与探索型框架的边界。"
    weight: "35%"
    scoring_rubric:
      full_marks: 100
      criteria: |
        - 维度一(40分)：报告能准确复述 Tamara Munzner 对词云的通道批判（位置通道浪费、面积失真）。
        - 维度二(60分)：能够从 Social Signaller 或情感共鸣的角度，为词云的应用场景提供坚实的理论辩护，完成 Aha Moment 跨越。
    deliverables:
      - "不少于 500 字的理论对撞分析报告 (Word/PDF)"
      - "反映情感共鸣的沙盘截图"
    theory_link:
      - concept_id: "social_signaller_vs_analytical"
        description: "社交信号器 vs 分析型框架"

homework:
  title: "从数字到情绪的媒介转换"
  description: "自拟一段属于你个人的情感语料（如年度日记、旅行游记或喜欢的歌词），重新运行词云引擎，通过刻意调整色板与旋转角度，让图形展现出截然不同的情感氛围。"
  weight: "20%"
  deliverables:
    - "完整运行的 D3 词云 HTML 文件"
    - "附带个人情感共鸣阐述的短文"
