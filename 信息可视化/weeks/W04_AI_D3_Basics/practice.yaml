# W04_practice.yaml — 双轨框架竞速与排错工作流
week: 4
title: "双轨框架竞速与 Vibe Coding 排错工作流"
experiment_link: "实验2"
total_minutes: 135  # hours_practice=3 → 3×45=135

theory_prerequisites:
  - "Munzner Ch7 表格空间排布四步语法 (Express/Separate/Order/Align)"
  - "ECharts 声明式 Option 架构 (Dataset/Grid/Series/VisualMap)"
  - "D3.js 指令式范式 (倒置坐标/Margin Convention/Scales/Data Join)"
  - "Vibe Coding 沙箱单文件渲染原理"

phases:
  - id: P1
    name: "空间排布逆向工程抢答"
    minutes: 40
    type: practice
    description: "快速闪现图表，学生喊出底层排布逻辑组合并在纸上画出数据长表形态"
    tools: ["纸笔", "学习通"]
    steps:
      - "讲师闪现 5 张图表（趋势线/堆叠柱/气泡散点/热力图等）"
      - "学生大声喊出底层排布逻辑（如 List Alignment + Length Encoding）"
      - "在纸上画出对应图表的数据长表形态"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "课堂实战打卡与交互记录"
    theory_link: "Munzner Ch7 空间排布"
    materials:
      - type: dataset
        title: "本周占位验证数据集"
        file: "assets/practice/placeholder_data.csv"
        format: csv
        schema:
          keys: ["id"]
          values: ["value"]
          types:
            id: categorical
            value: quantitative

  - id: P2
    name: "ECharts AI 竞速与 JSON 微操手术"
    minutes: 50
    type: workshop
    description: "AI 生成 ECharts 完整页面，学生亲手微调 Option 参数"
    tools: ["Claude/DeepSeek", "VS Code/Cursor", "浏览器"]
    steps:
      - "取出 W03 清洗好的 Tidy 数据（≥3000 行）"
      - "用模板 Prompt 生成含 Dataset/双Y轴/深色主题/dataZoom 的完整 HTML"
      - "掐断 AI，亲手在代码编辑器中微调参数（如 itemStyle 条件着色/tooltip formatter 货币格式）"
      - "同桌互评谁的微操改动最少、体验提升最大"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "ECharts 完整 HTML 页面"
    theory_link: "ECharts 声明式 Option 架构"

  - id: P3
    name: "D3 矢量深潜与 SVG 源提取"
    minutes: 45
    type: workshop
    description: "运用 AI Sandbox 生成极客风 D3 代码，纯通过参数微调提取静态资产"
    tools: ["Claude/DeepSeek", "浏览器 DevTools"]
    steps:
      - "使用 AI 快速生成非常规映射的 D3 单文件代码"
      - "在右侧实时沙箱（Artifacts）中预览图表，拒绝底层业务抓错"
      - "利用鼠标选中/控制台寻址，找出控制线条粗细、颜色、散点大小的十六进制/数值常量"
      - "通过浅层“微操手术”截获最终符合美学规范的静态图，使用 SVG Crowbar 等工具提取极清矢量图保存"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "D3 沙箱调参前后的极清矢量对比图 (SVG)"
    theory_link: "D3.js 指令式范式与矢量提取"

homework:
  title: "双轨引擎静态打样"
  description: "采用 W03 清洗出的 Tidy 数据集，分别运用 ECharts 与 D3 沙箱提取符合「实验二」要求的高清源数据资产。"
  weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
    - "作品 A（ECharts 沙箱导出高清图 PNG/SVG）：完美利用声明式特性实现商业极简视觉"
    - "作品 B（D3 沙箱导出极清底稿 SVG）：非常规映射探索大图底色"
