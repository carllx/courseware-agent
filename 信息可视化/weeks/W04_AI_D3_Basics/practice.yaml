# W04_practice.yaml — 双轨框架竞速与排错工作流
week: 4
title: "双轨框架竞速与 Vibe Coding 排错工作流"
experiment_link: "实验2"
total_minutes: 135  # hours_practice=3 → 3×45=135

theory_prerequisites:
  - "Munzner Ch7 表格空间排布四步语法 (Express/Separate/Order/Align)"
  - "D3.js 比例尺与空间映射 (Scales & Margin Convention)"
  - "D3.js 数据绑定四步范式 (Data Join)"
  - "Vibe Coding 沙箱单文件渲染原理"

phases:
  - id: P1
    name: "空间排布逆向工程抢答"
    minutes: 40
    type: practice
    description: "快速闪现图表，学生喊出底层排布逻辑组合并在纸上画出数据长表形态"
    tools: ["纸笔", "学习通"]
    steps:
      - "讲师闪现 5 张图表（趋势线/堆叠柱/气泡散点/热力图等）"
      - "学生大声喊出底层排布逻辑（如 List Alignment + Length Encoding）"
      - "在纸上画出对应图表的数据长表形态"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "课堂实战打卡与交互记录"
    theory_link: "Munzner Ch7 空间排布"
    materials:
      - type: dataset
        title: "本周占位验证数据集"
        file: "assets/practice/placeholder_data.csv"
        format: csv
        schema:
          keys: ["id"]
          values: ["value"]
          types:
            id: categorical
            value: quantitative

  - id: P2
    name: "D3.js 基础出图与 Vibe Coding"
    minutes: 50
    type: workshop
    description: "通过自然语言描述数据与视觉特征的映射关系，让 AI 从空白开始拉起基础 D3 图表骨架"
    tools: ["Claude/DeepSeek", "VS Code/Cursor", "浏览器"]
    steps:
      - "取出 W03 洗好的 Tidy 数据，要求 AI 挂载最新版 D3 国内 CDN 镜像"
      - "撰写精准的 D3 视觉映射 Prompt（指定数据字段、Marks 形状、Channels 属性），在浏览器呈现初版图表"
      - "实施 Bug-driven Prompting：识别首次生成常见的坐标截断、轴倒置问题，用大白话向 AI 汇报症状，并测试 AI 是否能够修复"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "初版成功渲染的 D3.js 图表页面 (HTML)"
    theory_link: "D3.js 比例尺与空间映射"

  - id: P3
    name: "D3.js 概念精修与矢量资产提取"
    minutes: 45
    type: workshop
    description: "运用 Scale、Viewport 等 D3 核心概念进行指令调优，并从中提取高品质矢量资源"
    tools: ["Claude/DeepSeek", "浏览器 DevTools"]
    steps:
      - "抛弃模糊语意，运用 D3 概念名词（如 Domain/Range/SVG viewBox）撰写高级指令，实施二次精准出图"
      - "在浏览器实时渲染结果中，进行针对性的配色与网格线调优"
      - "摒弃对底层业务逻辑的抓错；当视觉效果达标后，审查 DOM 树结构"
      - "运用 SVG Crowbar 等工具，或者直接复制 SVG 源码，将图表提取为极清矢量图保存，供后续二次艺术重构使用"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "概念精修出图后的极清矢量源文件 (SVG)"
    theory_link: "D3.js 指令式范式与矢量提取"

homework:
  title: "D3.js 概念驱动三阶创作"
  description: "采用 W03 清洗出的 Tidy 数据集，利用自然语言驱动 AI 历经基础出图与概念精修，最终提取高质量 SVG 并完成二次艺术呈现。"
  weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
    - "作品 A（D3.js 原始极清导出图 SVG）：验证数据映射正确且具有视觉基础"
    - "作品 B（经过二次排版的最终作品 PNG）：在原提取资产之上叠加设计感排版、字体与注解"
    - "设计决策说明：300字论述创作过程中应用了哪些格式塔、视觉通道与 D3 概念进行 Vibe 调优"
