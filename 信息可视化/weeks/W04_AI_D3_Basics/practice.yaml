# W04_practice.yaml — 理论驱动与变量干预
week: 4
title: "理论驱动与变量干预：零基础 D3.js Vibe Coding (上)"
experiment_link: "实验3"
total_minutes: 135

theory_prerequisites:
  - "JSON 与 CSV 数据格式解析"
  - "SVG 尖括号与基础属性 (rect, circle, cx, cy, fill)"
  - "Munzner 视觉通道映射理论 (Marks & Channels)"
  - "变量控制思想在数字技术中的应用"

phases:
  - id: P1
    name: "实践一：新数据格式扫盲与 Agent 初探"
    minutes: 45
    type: practice
    description: "认识 JSON/CSV 结构，通过喂给 Agent 第一版自然语言生成基础图表，建立成就感。"
    tools: ["Claude/DeepSeek", "VS Code/Cursor", "浏览器"]
    steps:
      - "知识停顿：拆解 JSON 和 CSV 的长相，破除数字媒体专业学生对数据格式的陌生感。"
      - "载入一个经典的带反转属性的统一数据集（如《二战轰炸机幸存者偏差数据》）。"
      - "理论填词游戏：放弃大白话，使用【理论填空题 Prompt (Mad Libs)】，从菜单中挑选 Munzner 通道词汇（如 Color Hue, Point）指挥 AI。"
      - "部署防护墙：在指令中强制要求 Agent 在代码首行生成带有防作死刻度注释的 `const CONFIG` 配置区。"
    weight: "15%"
    scoring_rubric:
      full_marks: 100
      criteria: |
        - 维度一(50分)：成功加载给定的 JSON/CSV 数据集并使 Agent 跑通初版。
        - 维度二(50分)：能够准确指出初版生成图中存在的缺陷。
    deliverables:
      - "Agent 初次渲染成功的图表截图"
    theory_link: "JSON 与 CSV 数据格式解析"
    materials:
      - type: dataset
        title: "经典洞察数据集：轰炸机幸存者偏差数据"
        file: "assets/practice/bomber_data.csv"
        format: csv

  - id: P2
    name: "实践二：打开黑盒 —— SVG 属性微调与变量干预"
    minutes: 45
    type: workshop
    description: "引入变量思想，教学生不再只用 Prompt 沟通，而是直接定位和修改 SVG 的尖括号基础属性，实现人机协同高效干预。"
    tools: ["VS Code/Cursor", "浏览器 DevTools"]
    steps:
      - "理论植入：讲解代码世界的防白屏底线（绝不碰 `{}` 和逗号），以及什么是 `CONFIG` 变量。"
      - "AI 驯化防身术：检查 VS Code 首行是否有 `CONFIG`。如果没有，大声指责 AI 并要求重新生成。"
      - "安全区干预：在 `CONFIG` 隔离墙内，依据防作死安全刻度注释，安全修改数值与颜色并保存刷新。"
      - "反思：体会通过配置隔离区杜绝白屏恐惧，享受毫秒级热重载反馈的 Vibe Coding 体验。"
    weight: "20%"
    scoring_rubric:
      full_marks: 100
      criteria: |
        - 维度一(100分)：提交一张截图，明确展示在编辑器中修改了某个 SVG 属性，以及修改前后浏览器中图形的变化对比。
    deliverables:
      - "手动修改 SVG 属性前后的对比截图"
    theory_link: "SVG 尖括号与基础属性"

  - id: P3
    name: "实践三：理论驱动指令 —— 视觉重构"
    minutes: 45
    type: workshop
    description: "将第一版的废话 Prompt 丢弃，运用 Munzner 的理论词汇重构指令，精确控制 Agent。"
    tools: ["Claude/DeepSeek"]
    steps:
      - "回顾理论：Munzner 的通道映射与交互式探索的需求。"
      - "元设计 (Meta-Design)：升维 Prompt。不再满足于静态图形，而是用理论词汇约束 AI 生成 UI（如：'请为 Size 通道生成一个受边界保护的网页滑块'）。"
      - "避免截断：通过一问一答的 Pipeline 切分长指令，防止 AI 触发 Token 截断导致的白屏残缺。"
    weight: "25%"
    scoring_rubric:
      full_marks: 100
      criteria: |
        - 维度一(100分)：提交最终版 Prompt。该 Prompt 必须清晰包含至少两种以上的理论映射名词（Mark, Channel, Position 等）。
    deliverables:
      - "理论驱动的高质量 Prompt"
      - "最终高品质图表产出"
    theory_link: "Munzner 视觉通道映射理论"

homework:
  title: "理论与效率的统一：SVG 混合精修实战"
  description: "基于本周的知识，选取一个额外提供的小数据集，运用理论驱动指令指挥 AI 出图，并在最后通过手动干预 SVG 尖括号变量完成 3 处微调。"
  weight: "20%"
  deliverables:
    - "完整 HTML 源码与图表截图"
    - "3 处手动干预的 SVG 变量属性说明"
