# W03_practice.yaml — 真实大表重组极刑突围
week: 3
title: "真实大表重组极刑突围"
experiment_link: [1, 2]
total_minutes: 90  # hours_practice=2 → 2×45=90

theory_prerequisites:
  - "Munzner What/Why 数据抽象框架"
  - "五种基本数据类型 (Item/Attribute/Link/Position/Grid)"
  - "属性变量阶级壁垒 (Categorical/Ordinal/Quantitative)"
  - "Tidy Data 三原则 (Wickham)"
  - "AI 结构化 Prompt 三要素 (Context/Shape/Constraints)"

phases:
  - id: P1
    name: "废墟重组大作战"
    minutes: 75
    type: workshop
    description: "利用 LLM 三层结构化 Prompt 清洗真实灾难级宽表"
    tools: ["Claude/DeepSeek", "RAWGraphs"]
    steps:
      - "从课程仓库拉取 disaster_china_stat.xlsx"
      - "使用三层 Prompt 模板（Context/Shape/Constraints）命令大模型清洗重组"
      - "迭代修正：记录模型首次出错时的修正 Prompt（如括号城市名拆分问题）"
      - "提取干净 Tidy CSV，拖入 RAWGraphs 验证可视化效果"
    deliverables:
      - "干净的 Tidy CSV 长表"
      - "与 AI 的迭代对话截图（含修正轮次）"
    theory_link:
      - concept_id: tidy_data
        description: "应用 Tidy Data 三原则清洗表"
      - concept_id: data_abstraction
        description: "理解 What/Why 数据抽象建模"
    materials:
      - type: dataset
        title: "本周占位验证数据集"
        file: "assets/practice/placeholder_data.csv"
        format: csv
        schema:
          keys: ["id"]
          values: ["value"]
          types:
            id: categorical
            value: quantitative

  - id: P2
    name: "经典作品逆向工程抢答"
    minutes: 15
    type: discussion
    description: "逆向分析经典可视化作品的底层数据结构"
    tools: ["学习通"]
    steps:
      - "展示向帆团队《解构藏文》或米纳德'拿破仑东征'截图"
      - "小组 5 分钟内逆向画出底层数据表形态"
      - "标注每列的 Munzner 属性分类"
      - "最快最准组获胜"
    deliverables:
      - "课堂实战打卡与交互记录"
    theory_link:
      - concept_id: munzner_data_taxonomy
        description: "基于 Munzner 分类体系逆向分析"

homework:
  title: "野生数据集 Tidy 化清洗"
  description: "从公开数据源获取一份原始宽表数据，利用 LLM Prompt 清洗为 Tidy CSV，并撰写约 500 字的数据抽象分析"
  deliverables:
    - "原始宽表截图"
    - "Tidy CSV 长表文件"
    - "500 字数据抽象分析（Item/Attribute/Derive 策略）"
