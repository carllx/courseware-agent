# 适用人培版本:   2023版人培（数字媒体艺术四年制本科）
# 人培中课程名:   交互产品综合创作
# 人培学分/学时:  3学分 / 60学时 (理0+实60)
# 实际开课设置:   3学分 / 60学时 (理0+实60), 以实际排课为准
# 人培支撑矩阵:
#   2025版: 2.3全流程创作能力(H), 3.2独立创意思考(M), 7.2执行能力(H)
