    硅谷的案例中，最经典的莫过于云存储巨头 Dropbox。在 2007-2008 年间，开发一套能穿透各操作系统的同步引擎技术难度极高。“云同步”对普通用户来说也是个难以理解的概念。

    投资人问他：“你怎么证明这东西有人要？”

    创始人 Drew Houston 没有选择闭门写代码。他选择了一个极端的 MVP 方式：用两段不同风格的'
