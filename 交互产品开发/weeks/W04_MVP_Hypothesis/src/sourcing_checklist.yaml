  description: '[DID YOU KNOW] **指标山峰**（也就是 Metrics Mountain）**与动词法则**

    为了推导商业结果，Lean UX 提倡使用“指标山'
  scene_excerpt: '[DID YOU KNOW] **指标山峰**（也就是 Metrics Mountain）**与动词法则**

    为了推导商业结果，Lean UX 提倡使用“指标山峰”模型来追踪用户克服阻力的整个过程。在制定这层结果时有一条铁律：**所有的领先指标都必须以动词开头**（例如：用户“减少”呼叫中心求援、“增加”文件上传次数），因为我们追踪的是真实的动作，而不是系统的静态特征。'
