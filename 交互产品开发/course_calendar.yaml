    - 理解并规避“设计的Dribbble化”与小样本“伪量化”陷阱。
    - 运用“英雄之旅”模型和工业级“八章节法”构建逻辑严密、以实证驱动的UX作品集。
    steps:
    - stage: 导入
      summary: 回顾测试经历中的挫败感，剖析新手的抗拒心理。通过两份典型简历的对比，引出对“The Dribbblisation of Design”的反思，强调在作品集中展示失误与迭代过程的商业价值。
      minutes: 15
    - stage: 讲授
      summary: 
        讲解亲和图实战的四条铁律及可用性问题四级严重度量表，结合适老化App案例演练定性排障过程。深度拆解满分UX作品集的“英雄之旅”叙事结构和“八章节法”，打破流水账式的排版误区。
      minutes: 60
    - stage: 实践
      summary: 实践项目4收尾工作坊，教师巡场指导学生梳理测试反馈数据，完善重构逻辑并制作期末展板。
      minutes: 100
    - stage: 小结
      summary: 回顾全课十四周的蜕变之旅，总结交互设计师的终极社会身份，布置期末作品集展板提交任务。
      minutes: 5
