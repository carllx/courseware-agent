calendar:
- week: 1
  chapter: 1
  chapter_title: 交互体系概论基础
  readings:
  - 《交互设计：超越人机交互》第1、2章
  - 《交互设计精髓》Ch1-2
  topic: 交互体系概论基础
  content: '本周模块涵盖交互体系概论基础。模块1通过分析数字系统失败导致的“认知摩擦”及其四宗罪，揭示产品体验坍塌的组织级根因；模块2界定交互设计的历史演变与概念、物理、界面、交互四大垂直维度，并厘清七大可用性底线与感性体验目标的关系；模块3深度解析工程实施模型、表现模型与用户心理模型之间的错位、背叛与平衡策略；模块4讲授可见性、反馈、约束、一致性及示能等防止摩擦的五大设计原则，并剖析暗黑模式与无障碍设计的内涵；模块5引入精益设计（Lean
    UX）与MVP理念，指导学生通过定性访谈进行痛点诊断，并以极低成本进行敏捷验证。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 理解交互设计与用户体验的区别与联系，掌握核心可用性原则
  focus: 建立以用户心理模型为中心的设计哲学，打破以机器逻辑或视觉表象主导的固有认知。核心在于掌握工程、表现、心理三大心智模型，并应用可用性七大红线及防摩擦五大原则。
  difficulty: 
    准确识别和区分三大认知模型，理解如何通过巧妙的“表现模型”有效弥合底层冰冷代码与人类直觉预期之间的鸿沟；在实操中能够准确使用预防式约束和多模态反馈来消除数字体验的认知摩擦。
  ideology: 
    反思盲目的数字化带来的系统性排斥，倡导通过“过渡性设计”保留物理退路以关怀老年人及弱势群体；严厉批判榨取用户的“暗黑模式”套路；确立“无障碍设计是对全人类情境致残的终极包容”的观念，重塑科技向善的数字伦理与人文安全温度。
  teaching_method: 项目导引、案例分析、产品逆向体验拆解小组实战
  supported_objectives:
  - 知识1
  task: 
    实践项目1前期任务与UX吐槽门诊。学生需选取具有典型劣质体验的数字产品，利用七大可用性红线及交互五原则进行可用性逆向分析与盲批，输出包含痛点陈述在内的交互门诊病历单，为敏捷设计验证奠定基础。
  lessons:
  - topic: 数字产品之殇 —— 我们为什么会抓狂？
    objectives:
    - 理解数字系统行为恶劣（四宗罪）带来的体验坍塌
    - 剖析导致数字化排斥的四大组织级根因
    - 认识认知摩擦的破坏性及物理可预测性的崩塌
    steps:
    - stage: 讲授
      summary: 剖析机器系统的四宗罪及产品失败的四大组织根因
      minutes: 20
    - stage: 讲授
      summary: 解析认知摩擦概念、Therac-25血案以及数字鸿沟问题
      minutes: 10
    - stage: 价值观探讨
      summary: 探讨保留物理退路的过渡性设计及功能克制的包容性伦理
      minutes: 5
  - topic: 定义与边界：我们到底在交互什么 & 可用性 vs 体验
    objectives:
    - 理解交互设计从机器语言到体验架构的历史演变
    - 掌握产品设计的四大垂直维度：概念、物理、界面、交互
    - 区分并量化七大可用性目标与体验目标的边界
    steps:
    - stage: 讲授
      summary: 回顾交互设计的历史事件及四大维度的结构解剖
      minutes: 25
    - stage: 实践
      summary: 非洲市场低带宽与极低识字率下的四维设计突破点探讨
      minutes: 5
    - stage: 讲授
      summary: 七大可用性红线解析及致命冲突的权衡，正负面体验的标尺
      minutes: 8
    - stage: 实践
      summary: 布置校园数字摩擦自查课后任务
      minutes: 2
  - topic: 破解认知失调 —— 重要的三大模型
    objectives:
    - 理解工程实施、表现与用户心理三大模型的结构差异
    - 掌握用表现模型掩盖残酷底层真相的设计策略
    - 认识到表现模型背叛机制带来的可用性与安全灾难
    steps:
    - stage: 讲授
      summary: 拆解三大核心模型与常人心理预期的认知鸿沟
      minutes: 20
    - stage: 讲授
      summary: 讲解如何平衡系统真相与心智幻觉以提供安全感（如GPS平滑、Spotify算法黑箱）
      minutes: 5
    - stage: 案例分析
      summary: 深度剖析Therac-25、波音737 MAX以及AWS宕机事件中的模型背叛灾难
      minutes: 8
    - stage: 实践
      summary: 布置模型失控大搜查课后任务及前瞻目标导向设计
      minutes: 2
  - topic: 防止摩擦的五把武器：设计原则
    objectives:
    - 掌握消除摩擦的五大原则（可见性、反馈、约束、一致性、示能）
    - 区分防御性设计中的预防式与事后式约束机制
    - 识别商业中榨取人性的欺诈套路（Dark Patterns）
    - 理解无障碍设计的全情境包容价值
    steps:
    - stage: 讲授
      summary: 解析系统状态的可见性、多模态感官反馈及幻象示能（Fitts定律）
      minutes: 10
    - stage: 实践
      summary: 进行音效盲听挑战，评估听觉示能如何传递物理和系统状态
      minutes: 5
    - stage: 讲授
      summary: 讲解物理预防式防呆约束与操作心智的机械一致性
      minutes: 5
    - stage: 价值观探讨
      summary: 解析暗黑模式的骗局，并深刻反思无障碍设计对抗情境致残的人文意义
      minutes: 5
  - topic: '第一战场 —— 实践项目1: 敏捷洞察与 MVP'
    objectives:
    - 掌握精益设计（Lean UX）的核心思想及真相曲线
    - 能够使用业务痛点陈述模板清晰表达问题
    - 避开幸存者偏差圈套，开展深度定性问题访谈
    - 将低成本验证思维应用于真实产品可用性的逆向评估
    steps:
    - stage: 讲授
      summary: 引入精益设计（Think-Make-Check），利用模板撰写衡量陈述与病因诊断
      minutes: 15
    - stage: 讲授
      summary: 解析MVP本质，结合Dropbox案例强调通过白板流转进行低成本实证验证
      minutes: 10
    - stage: 小结
      summary: 课程五大法则宏观收尾、明确数字人文底线并预告下周内容
      minutes: 5
    - stage: 实践
      summary: 开启UX吐槽门诊：当堂逆向盲批劣质App的交互灾难
      minutes: 15
- week: 2
  chapter: 2
  chapter_title: 人类认知与心智摩擦
  readings:
  - 《交互设计：超越人机交互》第4章
  - 《交互设计精髓》Ch3
  topic: 人类认知与心智摩擦
  content: '本周课程系统探讨了人机交互中『心智摩擦』的认知心理学根源。内容涵盖人类认知的核心限制（注意力的极其狭窄、感知的格式塔原理、脆弱的工作记忆瓶颈）、Norman
    的意图与反馈断裂（执行鸿沟与评估鸿沟）、Cooper 的三种系统模型博弈（实现模型、表现模型与心理模型）、界面隐喻的演进与数字原生反叛，以及基于『识别胜于回忆』、渐进式披露与外部认知机制的认知负荷管理策略。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 深入理解人类认知局限与短时记忆负荷，掌握心智模型与界面隐喻的映射规律
  focus: 人类认知科学与交互心智模型，深入解构执行与评估鸿沟、三种心智模型博弈、界面隐喻的局限以及工作记忆容量法则。
  difficulty: 准确区分并应用抽象的心理学与交互理论模型（如区分可供性与信号标识、理解表现模型与心理模型的错位），避免理论教条化（如误用 Miller
    的 7±2 法则），并将这些底层原理转化为解决复杂系统认知过载的实际重构策略。
  ideology: 包容性设计（Inclusive Design）与数字平权：强调适老化改造与无障碍设计并非设计的可选项，而是数字公民社会的法律义务与人本底线，引导学生关注视听或认知衰退群体的数字生存状况。
  teaching_method: 项目导引、白板推演、热力图认知分析实践
  supported_objectives:
  - 知识1
  - 知识2
  task: 
    课堂实践：『认知摩擦大搜查』——分组寻找并用四大认知理论诊断身边的反人类界面病灶；课后作业：选取严重认知过载的界面，绘制『认知热力盲区图』，并运用心智模型原理提出至少3条降维重构建议。
  lessons:
  - topic: 心智摩擦导入与人类认知架构
    objectives:
    - 理解体验目标与心智摩擦的概念差异
    - 认知注意力机制的盲视陷阱与任务切换代价
    - 掌握格式塔感知规律与工作记忆（7±2）的容量瓶颈
    steps:
    - stage: 复习
      summary: 回顾可用性五维与体验目标，利用日常抓狂场景进行五大原则的快问快答脑内微演习。
      minutes: 10
    - stage: 导入
      summary: 通过验证码等失败案例引出功能完备与良好体验的对立，切入快慢思考与心智摩擦的核心课题。
      minutes: 15
    - stage: 讲授
      summary: 深入剖析第一、二道滤网：选择性注意与非注意盲视、横幅盲视，以及大脑通过格式塔规律主动构建感知的机制。
      minutes: 12
    - stage: 讲授
      summary: 揭示第三道滤网：脆弱的工作记忆容量，讲解 Chunking 组块化、席克定律与 NASA-TLX 认知负荷，强调搭建认知缓冲垫。
      minutes: 13
  - topic: 意图反馈的断裂与三种系统模型
    objectives:
    - 识别并填平 Norman 的执行鸿沟与评估鸿沟
    - 准确区分可供性、信号标识与前置约束的区别
    - 辨析实现模型、心理模型与表现模型，掌握目标导向设计的转化
    steps:
    - stage: 讲授
      summary: 解析执行鸿沟，讲解如何利用可供性、信号标识（Signifiers）与约束（Constraints）填平操作前的物理陷阱，举例诺曼门与携程组件。
      minutes: 12
    - stage: 讲授
      summary: 解析评估鸿沟，探讨反馈设计的即时性、清晰性与可解释性；分析宽恕式设计与系统状态可见性。
      minutes: 13
    - stage: 讲授
      summary: 拆解 Cooper 三种模型大战，对比工程师冰冷的实现模型逻辑与人类朴素直觉的心理模型（不求真理只求管用）之间的天然错位。
      minutes: 12
    - stage: 讲授
      summary: 探讨表现模型如何向心理模型跃迁从而掩盖底层复杂性，讨论过度迎合的隐瞒风险以及空间计算环境下的心理模型真空。
      minutes: 13
  - topic: 界面隐喻、外部认知与实战诊断
    objectives:
    - 辨析界面隐喻的三种失效形式及其对创新的禁锢
    - 应用『识别胜于回忆』、渐进式披露与外部认知控制系统负荷
    - 熟练运用四大原理定性分析真实世界的产品病灶
    steps:
    - stage: 讲授
      summary: 解析界面隐喻的双刃剑效应，探讨隐喻的物理逻辑破裂、遗迹化老化，以及路径依赖对数字原生想象力的封锁与卡片隐喻的算法篡改。
      minutes: 20
    - stage: 讲授
      summary: 澄清 Miller 定律的死记硬背误区，讲解应用渐进式披露、识别法则以及外部认知/分布式认知（外部化、计算卸载）外包大脑机能的方法。
      minutes: 15
    - stage: 实践
      summary: 『认知摩擦大搜查』：学生分组寻找典型糟糕界面，运用鸿沟、模型冲突等四把理论手术刀进行病灶解构，并上台做一句话处方提案。
      minutes: 35
    - stage: 小结
      summary: 复盘心智摩擦四大核心病因，注入包容性设计的底线思政点，布置『认知热力盲区图』课后改造任务，预告后期的用研课题。
      minutes: 10
- week: 3
  chapter: 3
  chapter_title: 产品洞察与痛点切入
  readings:
  - 《精益 UX》Ch1-4
  topic: 产品洞察与痛点切入
  content: '本周课程聚焦于产品洞察与痛点切入。通过回顾认知摩擦，揭示产品-市场错配的三种死法。深入剖析用户的“言行鸿沟”（Say-Do Gap），打破焦点小组的验证式提问陷阱。引入敏捷创业的定性调研方法（如人类学田野调查、5-Why深访），并结合JTBD（Jobs-to-be-Done）框架，将需求精准剥离为功能、社会与情感三个维度。最终，教授如何将洞察转化为结构化的Problem
    Statement与先导指标，并启动首个田野微调研实践项目。'
  exp_id: 1
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 掌握精益用户体验研究中的定性调研方法
    ability: 能敏锐挖掘用户痛点与业务机会
  focus: 
    掌握反直觉的定性调研方法（参与式观察与5-Whys深度访谈），并运用JTBD框架将表面需求剥离为功能、社会和情感三维动机，最终转化为精准的问题陈述（Problem
    Statement）。
  difficulty: 克服“验证式诱导提问”的直觉陷阱，学会在高压访谈中通过连续追问和场景还原，穿透用户因社会期望而产生的“言行鸿沟”，捕捉最底层的心理动机和物理摩擦。
  ideology: 
    培养对真实用户生存情境的敬畏与同理心（如深夜车库的生存级恐惧、医疗系统的绝对掌控感），拒绝脱离实际、闭门造车的“完美数据报告”，强调数字产品设计必须回归第一现场，切实解决人性深处的脆弱与焦虑。
  teaching_method: 项目导引、访谈技巧示范、微调研方案设计实录
  supported_objectives:
  - 知识1
  task: 
    Exp.01「荒野与猎物」：组建包含商业(Hustler)、体验(Hipster)与技术(Hacker)特长的敏捷小队，使用AI陪练终端完成访谈模拟及Proto-Persona数据卡提取，随后在线下开展真实场景的定性田野调研。
  lessons:
  - topic: W03 产品洞察与痛点切入
    objectives:
    - 掌握精益UX定性调研方法，打破验证式提问的直觉陷阱
    - 运用JTBD框架深度剥离用户的功能、社会与情感三维痛点
    - 从混沌现象中提炼精准的业务级Problem Statement并识别先导指标
    steps:
    - stage: 复习
      summary: 从认知摩擦到商业洞察。回顾三大认知滤网与执行/评估鸿沟，结合Juicero等案例剖析战术精致与战略失败的区别，总结产品-市场错配的三种死法。
      minutes: 10
    - stage: 导入
      summary: 认知摩擦的终极变种与言行不一。通过索尼收音机与沃尔玛过道案例，揭露Say-Do Gap（言行鸿沟），指出行为经济学中人类非理性的真相。
      minutes: 10
    - stage: 讲授一
      summary: 反直觉定性调研与问题发掘。分析焦点小组缺陷，引入人类学田野调查与参与式观察，详细讲解深访五步法，特别是通过5-Whys剥洋葱法挖掘深层恐惧。
      minutes: 35
    - stage: 讲授二
      summary: JTBD框架与需求的维度剥离。以麦当劳奶昔案例引入JTBD，解析功能、社会、情感维度的深层动机，并探讨情境（Context）如何影响跨界竞争。
      minutes: 35
    - stage: 讲授三
      summary: 敏捷痛点发掘与Problem Statement。学习用工程句式转化同理心，设计能够提前预判商业生死的微观“先导指标”，摒弃宏观滞后指标的误导。
      minutes: 10
    - stage: 实践与小结
      summary: 微调研沙局与Exp.01启动。进行AI陪练访谈以提取标准画像卡，确立实战小组角色分工，明确田野调研三大核心训诫，正式启动首次课外实践项目。
      minutes: 80
- week: 4
  chapter: 4
  chapter_title: 假设驱动与MVP构建
  readings:
  - 《精益 UX》Ch10-12
  topic: 假设驱动与MVP构建
  content: '本周课程介绍假设驱动设计与 MVP（最小可行性产品）构建。摒弃重型且昂贵的传统用户画像，转而使用轻量级的 Proto-Persona 锁定用户的行为核心特征。将传统的确定性功能清单重构为基于''产出与结果
    (Output vs Outcome)''视角的四段式假设声明，并运用风险×价值矩阵（HPC）确定最高优先级的测试目标。明确 MVP 的核心是作为''学习工具''而非产品半成品，并教授根据真相曲线选择纸质原型、着陆页、假按钮或绿野仙踪等不同保真度的低成本手段来进行敏捷验证。通过全流程工作坊完成实践项目1的收官。'
  exp_id: 2
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 应用假设驱动的敏捷设计思维
    ability: 能界定极简场景并输出最小可行性产品(MVP)需求清单
  focus: 利用 Proto-Persona、四段式假设声明与 HPC 矩阵完成从模糊洞察到可验证假设的转化，并掌握 MVP 的四大低成本验证手段。
  difficulty: 跳出传统'按需画图'的交付陷阱，正确区分业务产出(Output)与结果(Outcome)；克服确认偏误及人口统计学陷阱，建立利用极简 MVP
    验证假说的能力，克制盲目进入高保真开发的冲动。
  ideology: 接纳试错的成长型心态（Growth Mindset）：将 MVP 验证中遭遇的数据反馈视为一种发现真相和系统优化的基石，而非对团队能力的否定，勇于拥抱不完美并打破团队主观的确认偏误。
  teaching_method: 项目导引、案例复盘、MVP 清单讨论与决策
  supported_objectives:
  - 知识1
  task: 完成实践项目1收官：重审调研痛点并输出业务问题陈述，提交打磨后的四大模块 Proto-Persona 卡片、通过 HPC 矩阵锁定的3条核心假设，并利用
    MoSCoW 法则界定 MVP 的真假实验功能红线清单。
  lessons:
  - topic: 假设驱动与 MVP 验证理论
    objectives:
    - 掌握 Proto-Persona 四大模块的构建及验尸墙验证
    - 学会编写具备量化结果的四段式假设声明
    - 能够使用 HPC 风险价值矩阵排定假设优先级
    - 理解 MVP 学习本质及四种极简验证光谱工具
    steps:
    - stage: 导入
      summary: 复习 JTBD 洞察，揭示功能臃肿的困境与缺乏验证带来的灾难性后果
      minutes: 25
    - stage: 讲授
      summary: 摒弃重型画像，讲解 Proto-Persona 的快速推演及打破人口学陷阱的三道验证关卡
      minutes: 20
    - stage: 讲授
      summary: 从传统的交付功能重构为假设声明，分析 Output 与 Outcome 谬误，组装四段式假设骨架
      minutes: 20
    - stage: 讲授
      summary: 引入风险×价值矩阵（HPC），设定四象限裁决原则以规避软性盲区
      minutes: 10
    - stage: 讲授
      summary: 解析 MVP 的学习工具本质，阐述真相曲线法则，展示纸质原型、着陆页、假按钮及绿野仙踪等光谱实战
      minutes: 25
  - topic: 实践项目1：调研汇报与可行性清单工作坊
    objectives:
    - 从田野调研原始素材中提炼有效的量化业务问题陈述
    - 通过组内角逐锁定高风险高价值优先级的实验假设
    - 完成 MVP 验证工具的设计并划分 MoSCoW 功能生死边界
    steps:
    - stage: 实践
      summary: 法医预检与痛点重算：盘点小组前期调研素材并重新推演量化业务陈述
      minutes: 20
    - stage: 实践
      summary: Proto-Persona 深化：聚焦核心行为特征，各组相互指出彼此的人口学陷阱
      minutes: 20
    - stage: 实践
      summary: 假设提炼：组内推演3条强力假设，并置入 HPC 矩阵角逐锁定第一象限目标
      minutes: 25
    - stage: 实践
      summary: 构思 MVP 与课堂小结：规划极简实验方式，应用 MoSCoW 法则界定生死红线，树立成长型心态
