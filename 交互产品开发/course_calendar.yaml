- week: 5
  chapter: 5
  chapter_title: 目标导向路径与架构
  readings:
  - 《交互设计精髓》Ch4-5
  topic: 目标导向路径与架构
  content: '本周课程聚焦于交互系统底层的目标导向路径与状态机架构设计。主要内容包括：1.探讨心流状态与交互透明性的关系，讲解如何消除认知摩擦；2.分析交互编排策略，通过顺从心智模型和少即是多的原则，使界面达到隐形与沉浸；3.区分目标导向任务与附加税任务，提供针对拟物税、模态税、导航税等痛点的消灭方案；4.介绍构建交互框架六步法，利用状态机将抽象心流具象化为严密的页面流转；5.启动实践项目2，进行从需求到架构的全局状态流转图实战推演。'
  exp_id: 3
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 理解心流状态的触发条件，掌握前端页面状态机的流式拆解手法与逻辑编排能力
  focus: 理解产品架构中状态的本质，掌握交互编排与消除系统附加税（Excise Tasks）的核心策略，并熟练使用状态机和连线草图构建坚固的全局页面流转架构。
  difficulty: 
    实现从“视觉美工（像素填充）”到“交互架构师（状态流转与逻辑校验）”的心智跨越。最大挑战在于能否在复杂的业务逻辑下，抽象出核心状态节点，并确保任何网络异常或边缘死角场景下，状态机均能严密闭环运作。
  ideology: 
    技术以人为本的科技伦理与克制的工匠精神。强调界面不应成为横亘在用户欲望与系统目标之间的障碍，批判将机器底层运作逻辑傲慢地强加于用户的设计。通过极限剥离阻滞心流的“附加税”，展现对人类认知带宽及注意力资源的深刻敬畏，培养具有同理心和底层责任感的数字工匠。
  teaching_method: 项目导引、系统蓝图拆解、状态机白板绘图实操
  supported_objectives:
  - 知识1
  - 知识2
  task: 
    实践项目2（架构启动阶段）：暂缓高保真原型设计，采用白板工作流，基于设计简报（Brief）提取绝对核心状态节点，绘制出逻辑严密、彻底修剪了附加税的全局状态流转图（State
    Flow Diagram），并进行团队交叉角色评估和盲测走查。
  lessons:
  - topic: 心流与交互透明性
    objectives:
    - 理解心流 (Flow) 状态模型
    - 认识交互透明性对体验的重要性
    - 识别并消除认知摩擦
    steps:
    - stage: 导入
      summary: 通过画家的心流体验引入交互透明性理念，强调工作记忆极其有限。
      minutes: 5
    - stage: 讲授
      summary: 讲解心流模型的技能挑战平衡，以及系统产生的认知摩擦现象。
      minutes: 10
    - stage: 实践
      summary: 通过情境诊断测验（Quiz）考察对心流触发条件的判断。
      minutes: 5
    - stage: 案例
      summary: 解析亚马逊“一键下单”经典案例，论证消除认知摩擦的巨大商业价值。
      minutes: 5
  - topic: 交互编排策略
    objectives:
    - 掌握交互编排的核心原则
    - 学习如何降低视觉噪音，实现沉浸体验
    - 区分常态概率与边缘可能性
    steps:
    - stage: 导入
      summary: 以交响乐指挥为隐喻，提出交互编排需和谐控制而非增加系统噪音的概念。
      minutes: 5
    - stage: 讲授
      summary: 拆解遵循心智模型、少即是多、直接指挥、无模式反馈和情境化信息等多项系统编排策略。
      minutes: 15
    - stage: 互动
      summary: 通过灵魂发问探讨对话框与弹窗的强阻断性体验缺陷。
      minutes: 5
  - topic: 目标导向与附加税
    objectives:
    - 区分目标导向任务与附加税任务
    - 识别拟物税、模态税与导航税
    - 运用路标和映射法则消除附加税
    steps:
    - stage: 讲授
      summary: 解析目标导向任务与附加税的本质差异，列举常见的过度拟物化与模态框重灾区现象。
      minutes: 10
    - stage: 讲授
      summary: 提出通过提供持久路标、全局概览和物理/逻辑映射法则彻底消除系统附加税的干预策略。
      minutes: 5
    - stage: 实践
      summary: 通过具体案例进行逻辑映射法则应用的纠错测验。
      minutes: 5
  - topic: 从心流到页面流_状态机拆解
    objectives:
    - 掌握构建交互框架的六步工程纪律
    - 运用状态机映射绘制任务页面流转
    - 利用场景矩阵进行状态防线验证
    steps:
    - stage: 讲授
      summary: 介绍交互框架定义的核心流程及在矩形阶段中利用低保真状态机连线草图绘制任务流的方法。
      minutes: 10
    - stage: 讲授
      summary: 讲解如何通过关键路径场景的故事板演进对状态流进行视觉化与真实性检验。
      minutes: 5
    - stage: 实践
      summary: 利用状态验证防线测验辨析必须使用的低频场景与极端异常边缘用例的不同处理原则。
      minutes: 5
  - topic: 实践项目2 启动——从混沌到秩序的流转架构构建
    objectives:
    - 跨越具象原型阶段直接进行业务抽象，绘制白板状态流转图
    - 提炼系统的真实业务核心状态节点
    - 审计系统附加税并进行团队角色交叉评审
    steps:
    - stage: 导入
      summary: 展示真实企业全局状态流转白板图示例及架构要素规范。
      minutes: 5
    - stage: 准备
      summary: 撰写一页设计任务简报 (Brief)，明确本次产品的核心目标范围边界和约束条件。
      minutes: 5
    - stage: 规划与编排
      summary: 全员协同提取绝对核心状态节点，使用带触发条件的连线编织状态机网络，排查死胡同。
      minutes: 25
    - stage: 审计
      summary: 基于交互原则找出白板图中的潜在体验裂痕（如阻断式弹窗、深层菜单等）并尝试就地重构修剪。
      minutes: 10
    - stage: 评审走查
      summary: 分组互换图纸，扮演业务守门员与开发人员角色，针对漏网边缘路径与状态断层进行严密防线拷问与迭代反馈。
      minutes: 35
  - topic: 课程总结与下次预告
    objectives:
    - 总结交互架构四大基石理念
    - 完成思维模型从页面视图级到全局状态系统级的跨越
    - 预见下周的前端 CSS 技术落地要求
    steps:
    - stage: 总结
      summary: 复盘透视心流、掌控状态编排、剥离底层附加税和基于状态机抽象的数字架构师四大核心要求。
      minutes: 8
    - stage: 预告
      summary: 预告下周由设计蓝图跨入前端浏览器物理边界的核心挑战：构建间距系统与 CSS 盒子模型原理。
      minutes: 2
- week: 6
  chapter: 6
  chapter_title: 容器工程化基础映射
  readings:
  - 《数字媒体交互设计》项目2
  topic: 容器工程化基础映射
  content: '本周课程聚焦于从平面“画布思维”向现代前端“容器思维”的范式转换。模块系统性解剖了DOM嵌套结构与CSS盒模型（Content/Padding/Border/Margin），并引入Fixed、Hug、Fill三大尺寸本能。进一步讲解了Flexbox阵列与Figma
    Auto Layout的双向映射逻辑，实战诊断了文字溢出、图片截断等响应式排版灾难问题。最后，确立了基于8点网格的间距刻度体系以及Design Token（设计令牌）的三层语义抽象架构，为现代交互产品开发的工程化与智能化代码生成奠定基础。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 理解设计工具与前端开发的映射机理
    ability: 掌握从 AutoLayout 容器思维到响应式组件框架的构建
  focus: CSS盒模型的四层边界解析，Auto Layout与Flexbox的弹性阵列统筹机制（Fixed/Hug/Fill物理缩放双向映射），以及8点间距刻度体系与Design
    Token语义化层级架构。
  difficulty: 
    彻底摒弃依赖绝对坐标定位的“平面死坐标思维”，建立起“控制权让渡”的宏观容器思维，即在不可预知的动态数据流与海量物理设备尺寸下，如何利用嵌套包裹(Nesting)与弹性缩放(Hug/Fill)法则进行空间自适应排版。
  ideology: 
    工程规范与克制哲学：向学生灌输“系统的纪律，才是通向最终设计自由的保障”这一核心理念。放弃对微观每一像素绝对位置的死板执念，建立尊重硬件物理现实法则、具备同理心（如针对老龄化大字号覆盖时的防守机制）的数字大工业精神底盘。
  teaching_method: 项目导引、设计系统工程化演示、Figma 容器搭建测验
  supported_objectives:
  - 知识1
  - 能力2
  task: 完成《用户卡片》双重构建实践：首先使用纯绝对定位和固定尺寸还原卡片并进行极限长文本的“破坏性灾难测试”；随后运用由内向外的Auto Layout嵌套机制、合理的弹性材质配置（Hug/Fill/Fixed）以及8点间距刻度纪律，重构出可完美自适应响应的高弹卡片组件框架。
  lessons:
  - topic: 复习与导入：画布思维的崩塌与响应式觉醒
    objectives:
    - 理解从状态机抽象蓝图到真实物理设备屏幕渲染之间的逻辑断层
    - 认知“死坐标”在真实屏幕尺寸碎片化与动态数据增减面前的脆弱性
    - 掌握范式转换：把排版绝对控制权让渡给弹性容器约束机制
    steps:
    - stage: 复习
      summary: 回顾逻辑状态机阶段向界面落地时的阵痛，利用手机大字模式引发重叠瘫痪的案例开展破坏性测试预警。
      minutes: 10
    - stage: 导入
      summary: 通过设备分辨率错位和动态内容溢出恶果，导入弹性容器思想以及它对于数字信息流的收纳与界限保护意义。
      minutes: 10
  - topic: 讲授：万物皆盒、弹性宇宙与秩序的终局
    objectives:
    - 解剖DOM树与CSS盒模型的四大物理边界，能熟练运用Padding扩大触控区，利用Margin控制组件呼吸感
    - 精通Flexbox阵列控制与Figma Auto Layout双向映射，能正确分发Fixed(固定)、Hug(包裹)、Fill(流体)材质
    - 通过8点网格刻度网消灭排版中的“歧义间距”，彻底理解Design Token如何消除硬编码并实现全站敏捷的风格换肤
    steps:
    - stage: 讲授
      summary: 解析CSS四层盒模型解剖图，利用防“胖手指”误触案例讲解Padding/Margin。对比固定木箱(Fixed)与热缩膜(Hug)的尺寸本能。
      minutes: 20
    - stage: 讲授
      summary: 讲解Flexbox父子统筹权转移与三大伸缩材质，展示并诊断真实的典型卡片响应式崩坏现场，实操演示Auto Layout组件规范化嵌套步骤。
      minutes: 35
    - stage: 讲授
      summary: 揭示碎步间距带来的工业隐患，推演8点网格刻度及其亲密性原则；引入Token“三明治”架构，剖析全局映射机制。
      minutes: 25
  - topic: 实践：严苛组件框架搭建
    objectives:
    - '亲手通过破坏性测试感受纯绝对布局(position: absolute)在代码运行层的崩溃后果'
    - 实装基于DOM层级逻辑与网格系统刻度的现代高弹性卡片骨架
    steps:
    - stage: 实践
      summary: 执行用户卡片的双重构建实践：从Stage 1手动拖拽画布引发溢出灾难，到Stage 2开启自动布局、配置伸缩边界并应用网格规律进行全量弹性重构。
      minutes: 70
  - topic: 小结：容器工程化的心流纪律
    objectives:
    - 固化本周所学的集装箱货运系统宏观映射模型
    - 确立面向下阶段AI辅助生产流水线的组件前置交付高标准纪律
    steps:
    - stage: 小结
      summary: 梳理万物皆盒、弹性博弈、刻度纪律与语义控制的四重防线，重申数字工程世界的“纪律即自由”，布置下一阶段系统对接的铺垫预演。
      minutes: 10
- week: 7
  chapter: 7
  chapter_title: 视觉重构：层级与色彩
  readings:
  - 《Refactoring UI》Hierarchy is Everything
  - 《Refactoring UI》Working with Color
  topic: 视觉重构：层级与色彩
  content: '探讨视觉层级原理与排版基础，解析反向弱化、标签后置、语义让位等实战战术。介绍HSL色彩系统与9阶色板构建，深入色彩进阶与带情感温度的灰阶控制。讲解无障碍设计（WCAG/APCA）及应对极端操作的多通道冗余设计。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 掌握无需依赖图形装饰、仅靠空间留白和字重构建信息层级的方法
    ability: 熟练建立科学的色彩 Token 系统
  focus: 界面的视觉层级重构（字重、对比度、负空间组合），以及工业级HSL色彩系统（9阶色板构建、灰阶温度、冗余防错设计）的建立与应用。
  difficulty: 克服主观审美惯性，学会在高密度信息流中利用“反向弱化”凸显核心，以及应对亮度和色相在感知上的非线性错觉（手动补偿与色相旋转）。
  ideology: 
    通过三哩岛核泄漏事故等工程教训，强调多通道冗余设计在关键系统中的防错保命意义，倡导敬畏生命、注重包容与人文关怀（如遵循无障碍规范保障色弱群体）的数字开发工程伦理。
  teaching_method: 项目导引、重构对比赏析、视觉 Token 系统推演实践
  supported_objectives:
  - 知识1
  - 能力1
  - 能力2
  task: 为前期高保真线框图“填色”，建立符合无障碍对比度标准、带特定情感温度灰阶的专属9阶基础色彩Token库，并通过色彩补偿与层级分配法则重建界面骨架。
  lessons:
  - topic: 视觉层级与排版实战策略
    objectives:
    - 理解视觉层级作为界面权力分配的本质机制
    - 掌握字重、对比度、字号离散音阶与留白在排版中的架构规则
    - 熟练应用反向弱化、标签后置和语义让位等界面层级战术
    steps:
    - stage: 导入
      summary: 通过LingsCars网站感官过载案例，引出建立严谨视觉层级的必要性
      minutes: 10
    - stage: 讲授
      summary: 解析排版基础与视觉层级控制杠杆（字号跃迁、字重降级、负空间护城河）
      minutes: 15
    - stage: 讲授
      summary: 深入探讨界面实战战术：反向弱化竞争者、去除冗余标签、分离抽象语义与视觉呈现
      minutes: 15
    - stage: 小结
      summary: 阐述像素物理体积与色彩对比度的动态平衡（图标洗淡法则）
      minutes: 5
  - topic: HSL色彩系统、进阶调色与无障碍设计
    objectives:
    - 掌握基于HSL与孟塞尔感官模型的9阶色彩工业梯度板构建
    - 理解视觉亮度的衰减规律，运用手工色相旋转与饱和度极值补偿进行调色
    - 运用多模态冗余设计原则满足现代APCA对比度标准和视障无障碍校验
    steps:
    - stage: 导入
      summary: 通过辨析HEX底层机器编码局限，引入以人眼感知为核心的HSL与孟塞尔色彩模型
      minutes: 5
    - stage: 讲授
      summary: 解析构建全火力9阶色板的三大核心锚点（50/500/900）以及有情感温度的灰阶基石
      minutes: 20
    - stage: 讲授
      summary: 破解色彩感知错觉：亮度反噬补偿与色相旋转高阶技巧，解析暗黑模式灰阶坍塌挑战
      minutes: 15
    - stage: 讲授
      summary: 结合三哩岛事故与红绿灯盲区，深度解读WCAG/APCA对比度新规及多重感官通道冗余设计
      minutes: 15
  - topic: 重建骨架脉络实践与色彩纪律总结
    objectives:
    - 独立为项目原型调配专属的9阶色彩Token库及灰阶系统
    - 将反向弱化、色彩进阶法则成功落地于高保真界面的最终填色重构中
    - 理解设计令牌（Design Tokens）作为视觉资产数字固化的底层工程意义
    steps:
    - stage: 实践
      summary: 启动工作坊（Workshop）：为历史灰色线框骨架执行系统填色、构建Token树并严查对比度
      minutes: 70
    - stage: 小结
      summary: 统合视觉层级与色彩纪律的三位一体体系，预告Z轴阴影视差与深度防错机制（W08课题）
      minutes: 10
- week: 8
  chapter: 8
  chapter_title: 视觉重构：深度与防错
  readings:
  - 《Refactoring UI》Creating Depth
  - 《Refactoring UI》Finishing Touches
  topic: 视觉重构：深度与防错
  content: '本周课程重点讲解数字界面的视觉深度构造以及边缘状态与防错兜底体系的设计。从早期的拟物化、扁平化历史沿革切入，深入阐释利用“全局顶光源”和“多重阴影”建立Z轴海拔系统的法则。随后，课程打破传统的“理想路径偏见”，系统讲解如何在系统无数据（空箱）、加载延迟或弱网等边缘状态下，利用共情文案、骨架屏和明确的CTA构筑安全与转化网。最后，引入工业级的“防呆（Poka-Yoke）”理念，强调通过前置防错、认知摩擦与撤销机制（Undo）代替无效的警告弹窗，以系统化工程思维确保核心交互流程的绝对安全。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 掌握界面物理深度的构建手段
    ability: 重点理解并补全极端情境（空状态、报错等）的防错与宽容度设计
  focus: 1. 基于全局顶光源和双重阴影机制建立UI组件的Z轴物理高度体系；2. 突破理想路径偏见的边缘与异常状态空箱设计策略；3. 运用防错与防呆原理打造系统操作安全防护网。
  difficulty: 1. 在没有阴影支持的极致扁平环境中利用明度落差和物理遮挡建立层级关系；2. 扭转开发者对异常报错的冷漠态度，将空箱状态转化为有温度的情感沟通与行动引导契机；3.
    科学拿捏高危操作时的“认知摩擦力”，设计合理的业务破坏挽救与延时撤销通道。
  ideology: 
    培养学生“防错重于挽救”的顶层工程责任意识与人文悲悯情怀。通过剖析夏威夷导弹警报乌龙、花旗银行巨额汇款失误以及Therac-25医疗设备致死事故，深刻揭示所谓“用户失误”实为系统设计原罪的真相，倡导研发人员在看不见的代码深处构筑隐形的系统盔甲，体现对生命、用户资产与操作体验的极致敬畏。
  teaching_method: 项目导引、边缘错误案例分析、防错页面设计实操
  supported_objectives:
  - 知识1
  - 能力1
  - 能力2
  task: 完成“实践项目2”：配置至少包含三级高度的Design 
    Token全局阴影变量库；落地带有占位图、引导文案与CTA的5个边缘状态/空箱界面；并重构破坏性流程操作，运用带倒计时的撤销（Undo/Redo）机制替换原生生硬的确认弹窗。
  lessons:
  - topic: 视觉重构：深度与防错
    objectives:
    - 掌握构建二维界面中物理深度的光学定律及系统变量分级建立方法。
    - 理解并能应用空状态（Empty States）的三大安防转换原则，遏制新户流失。
    - 建立防呆与防错的交互工程底线思维，熟练应用撤销与认知摩擦机制避免灾难性操作。
    steps:
    - stage: 导入
      summary: 复习前期色彩布局，引入二维屏幕的认知局限，讲解全局顶光源法则，结合UI发展史阐释光影对交互层级的重要作用。
      minutes: 20
    - stage: 讲授
      summary: 解构Material Design量子纸张模型与系统海拔层级，讲解高级双阴影合成技术，并教授受限无光影环境下的降维层级建立法。
      minutes: 25
    - stage: 讲授
      summary: 剖析理想路径偏见危害，提出应对空箱状态的三根护心柱策略，结合经典案例探讨网络断连、骨架屏加载等边缘场景设计。
      minutes: 25
    - stage: 讲授
      summary: 通过重大灾难案例引入物理级防呆理念，讲解前置格式防错、有意认知摩擦力与宽容可逆机制（Undo系统）的防卫阵线构建。
      minutes: 20
    - stage: 实践
      summary: 工作坊环节：落地实践项目2。配置多层级阴影Token，完善含引导特性的空箱体系，并完成基于撤销策略的安全防错代码重构。
      minutes: 80
    - stage: 小结
      summary: 总结隐形防错兜底作为系统信任基石的巨大价值，通过航空防呆与医疗事故案例的对比，升华前端工程师与架构师的安全伦理责任。
      minutes: 10
- week: 9
  chapter: 9
  chapter_title: AI Agents 驱动数字产品开发
  readings:
  - 《数字媒体交互设计》项目4-5
  topic: AI Agents 驱动数字产品开发
  content: '本周课程引入 Vibe Coding 概念与人机协同新纪元，引导学生完成从“绘图员”到“指挥家”的身份跃迁。课程深度讲授面向 UI 生成的结构化
    Prompt 工程，提出 RCPVU 五层控制指令集（Role, Context, Platform, Visual, UI）与三级阶梯式逼近战法（Scaffold,
    Skin, Interaction）。同时，深度剖析了 AI 代码生成的六大约束边界（如自动化讽刺、上下文盲区、架构性技术债等），强调在 AI 时代人类必须死守安全与架构控制权。'
  exp_id: 3
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 理解 AI 生成代码的边界与约束，掌握界面级 Prompt 结构化工程
    ability: 能高效驱动 AI 工具生成高保真交互壳层
  focus: Vibe Coding 理念、RCPVU 结构化 Prompt 框架、三级迭代生成策略（骨架-皮肤-交互）、以及防范 AI 生成代码的六大约束边界。
  difficulty: 从传统的具象视觉绘制思维转变为高维的系统架构意图表达思维，克制一键生成的诱惑，掌握并严格执行多层级的代码生成与除错约束机制。
  ideology: 
    培养学生在高度自动化时代的“阵地意识”和“控制者思维”。在算力泛滥的环境下，不盲目依赖、不丧失技术底线审查能力。强调人类作为规则制定者、边界守夜人和系统防错兜底者的不可替代价值，培养严谨求实、对数字产品安全高度负责的工程伦理与技术敬畏心。
  teaching_method: 项目导引、AI 生成翻车案例排雷、结构化 Prompt 演练
  supported_objectives:
  - 知识1
  - 能力1
  - 素质2
  task: 执行“实验三：多角色 Agent 协同编码”，通过多角色分工撰写系统规划文档，并指挥 AI 生成无框架依赖的纯原生 HTML/CSS/JS 高保真前端界面壳层代码。
  lessons:
  - topic: AI 原型协作结构化：从画图师到指挥家
    objectives:
    - 理解 Vibe Coding 人机协同架构，认识到传统“画图-移交”工作流的终结
    - 掌握面向 UI 生成的结构化 Prompt 工程，学会将 Design Tokens 翻译为 AI 可读规则
    - 深入认知 AI 代码生成的六大约限边界（如上下文盲区、架构债），建立“控制”而非“依赖”的协作心态
    steps:
    - stage: 导入
      summary: 复习与导入：介绍 Vibe Coding，剖析传统交付灾难，明确从“绘图员”到“指挥家”的身份升维，讲解声明式 UI 范式。
      minutes: 20
    - stage: 讲授
      summary: 讲解精确沟通法：阐述隐性知识断崖和言语行为理论，推演 RCPVU 全局控制指令集，演练 Scaffold-Skin-Interaction
        三级生成流。
      minutes: 35
    - stage: 讲授
      summary: 揭露失控边界：解析 AI 辅助开发带来的代码流失率攀升，深度展开自动化的讽刺、上下文盲区、差不多对陷阱、架构债、幽灵幻觉与安全漏洞六大红线。
      minutes: 35
    - stage: 实践
      summary: 实验三：多角色 Agent 协同编码。拆解项目需求，生成架构设计与前后端规范文档，最终利用 AI IDE 自动生成纯原生 HTML/CSS/JS
        壳层代码。
      minutes: 80
    - stage: 小结
      summary: 实验总结：对比失败与成功生成案例，再次强化 RCPVU 和阶梯死守法，重申六大安全边界意识并预告后续微交互动效任务。
      minutes: 10
- week: 10
  chapter: 10
  chapter_title: 前沿动效组件融入
  readings:
  - 《交互设计精髓》Ch11
  topic: 前沿动效组件融入
  content: '本周课程聚焦于为前端原型注入生命力的前沿微交互动效设计。从打破冰冷的“静态幻觉”出发，深入剖析了微交互的四大要素解剖模型（触发器、规则、反馈、循环与模式）及
    AFA（动作-反馈-动画）心理抚慰法则。理论层面涵盖非线性物理缓动曲线调校、迪士尼挤压拉伸机制、多模态感官隐喻，以及数字新中式留白气韵美学。技术落地层面，教授如何抛弃感性沟通，使用包含物理量纲（阻尼、刚度和质量等）的结构化
    Prompt 驱动大模型生成 Framer Motion/GSAP 原生交互代码。最后，着重讲解了防雷和防御性设计，包括避免 Layout Thrashing
    重绘风暴的 GPU 图层隔离、利用状态机拦截组件卸载生命周期，以及利用 prefers-reduced-motion 保护前庭敏感弱势群体的平稳降级策略。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 认知微动效在提供反馈与情感化设计中的重要作用
    ability: 掌握通过 AI 辅助植入创意前端动效的协作流
  focus: AI 驱动的组件级原生动效生成流，以及涵盖性能优化（避免重排）与无障碍兜底（平稳降级）的物理微交互构建。
  difficulty: 如何利用精确的物理常识参数构建 Prompt 驱动大模型，解决动效接入过程中引发的 Layout Thrashing 性能掉帧瓶颈，并处理前端框架（如
    React）中生命周期卸载拦截与组件代码不兼容等工程故障。
  ideology: 1. 科技向善与人文关怀：秉持包容性设计道德底线，通过代码实现 `prefers-reduced-motion` 强制降级，保护晕动症等前庭敏感群体免受数字感官剥夺。2.
    东方审美自信：超越纯工具思维，将中华文化的“气韵生动”与“留白”美学注入底层时间缓动曲线系统，构建独具东方哲理的呼吸感数字交互。
  teaching_method: 项目导引、优秀动效组件赏析、AI 驱动特效接入实拍
  supported_objectives:
  - 能力1
  - 素质2
  task: 组件预研匹配，利用 AI 大模型协作完成实际项目中目标动效代码（如状态流转、磁吸阻尼）的无缝接入，实操排查解决依赖丢失或 React 节点冲突等报错，并记录技术修复过程。
  lessons:
  - topic: 复习与导入 — 静态界面 vs 动态生命的触觉差异
    objectives:
    - 打破高保真原型仅仅是壳层的“静态幻觉”
    - 理解空间隐喻在降低心智摩擦中的作用
    - 认知从传统动效交付工具到 AI 直接生成代码的世代红利
    steps:
    - stage: 导入
      summary: 从 Vibe Coding 原型的缺乏物理反馈切入，利用蜡像馆与 iOS7 的历史沿革揭示微动效对人类认知的空间隐喻意义。展示大模型直接撰写底层渲染组件代码如何跨越传统开发与设计的落地鸿沟。
      minutes: 20
  - topic: 讲授(上) — 微交互反馈的作用机制与前沿融合
    objectives:
    - 熟练拆解 Dan Saffer 微交互四神柱
    - 掌握并应用 AFA 法则机制舒缓用户等待焦虑
    - 理解缓动哲学（Easing）以及超越视觉的多模态反馈设计
    - 探索属于中国本土的新中式留白气韵美学动效
    steps:
    - stage: 讲授
      summary: 解构微交互的核心构成（触发、规则、反馈、循环与模式），讲解 AFA 法则的心理按摩机制和非线性缓动曲线的物理感官。通过东京 JR 鸟鸣导航及电梯安慰剂按钮探讨多模态设计，最后拓展至新中式重度缓落动效背后的审美逻辑。
      minutes: 35
  - topic: 讲授(下) — AI 驱动的代码组件级无缝接入流
    objectives:
    - 使用物理参数（刚度、阻尼、质量等）重构 Prompt
    - 对比 Lottie 动画与原生组件化活体代码（如 GSAP/Framer Motion）差异
    - 掌握硬件 GPU 隔离，彻底规避 Layout Thrashing
    - 实现组件生命周期拦截与强制无障碍降级保护
    steps:
    - stage: 讲授
      summary: 指导利用力学名词指导 AI 产出精准动效代码；讲解利用滚动截断防御主线程阻塞。深度剖析渲染管线与 Layout 重绘陷阱，教授开启图层加速隔离。引入
        AnimatePresence 退场状态机设计，并严厉要求植入减弱动态效果（Reduce Motion）的无障碍分支兜底逻辑。
      minutes: 35
  - topic: 实践 — 注入创意动效与 AI 协作实拍
    objectives:
    - 将复杂的动效需求拆解并用恰当的指令传递给大模型
    - 克服在存量 React 项目中引入第三方库与新状态机引擎带来的冲突
    steps:
    - stage: 实践
      summary: 学生自查项目需引入情感化动效的切入点，通过自然语言驱动 AI 组装并引入 Framer Motion 过渡代码。通过录屏记录应对环境库报错、状态异常回滚及修复落地的排雷实况。
      minutes: 80
  - topic: 小结 — 动效演示互评与排障技术兜底
    objectives:
    - 确立动效克制美学的伦理观
    - 掌握防御性设计（Defensive Design）与渐进增强兜底策略
    - 运用 DevTools 面板进行代码与性能实测互评
    steps:
    - stage: 小结
      summary: 
        梳理动效接入与知识回环地图，明确指出切忌滥用大模型算力导致“雷神之锤”浮夸特效的伦理问题。要求学员组间互评性能排雷指标与降级网络防御网有效性，引出下周全面迈向系统级逻辑排障的艰苦课程预告。
      minutes: 10
