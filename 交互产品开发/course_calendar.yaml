calendar:
- week: 1
  chapter: 1
  chapter_title: 交互体系概论基础
  readings:
  - 《交互设计：超越人机交互》第1、2章
  - 《交互设计精髓》Ch1-2
  topic: 交互体系概论基础
  content: '1.1 交互与UX的概念与实际运用；可用性与体验目标

    1.2 产品体验的逆向拆解实验'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 理解交互设计与用户体验的区别与联系，掌握核心可用性原则
  focus: 交互设计的本质定义与可用性目标评估标准
  difficulty: 如何在具体产品分析中准确区分交互的易用性与整体体验感
  ideology: 结合本土互联网产品的出海成功案例，增强数字化创新自信
  teaching_method: 项目导引、案例分析、产品逆向体验拆解小组实战
  supported_objectives:
  - 知识1
  task: 选取一款常用互联网产品，从可用性目标与体验目标两个维度进行逆向拆解分析，提交分析报告（约800字）。
  lessons:
  - topic: 交互体系概论基础
    objectives:
    - 理解交互设计与用户体验的区别与联系
    - 掌握核心可用性原则与体验目标评估标准
    steps:
    - stage: 导入
      summary: '课程情境导入:

        1. 以日常交互失败案例引入，展示可用性与体验的差距

        2. 明确本节课核心聚焦点：交互设计的本质定义与可用性目标评估标准

        3. 激发学生学习动机与探索兴趣。'
      minutes: 25
    - stage: 讲授
      summary: '核心方法与实操解析:

        1. 实训主线：交互设计概念与实际运用、可用性目标（ISO 9241）、体验目标框架、Norman 设计心理学原则实战

        2. 实践要点拆解：1.1 交互与UX的概念与实际运用；可用性与体验目标 1.2 产品体验的逆向拆解实验

        3. 重难点突破：针对“如何在具体产品分析中准确区分交互的易用性与整体体验感”，采用案例剖析策略。

        4. 支撑目标：理解交互设计与用户体验的区别与联系'
      ideology: 结合本土互联网产品出海案例，增强数字化创新自信
      minutes: 110
    - stage: 实践
      summary: '课堂实践与操作训练:

        1. 实践任务指导：产品逆向体验拆解小组实战——分组选取产品，按可用性/体验双维度解剖

        2. 核心任务目标：选取一款常用互联网产品，从可用性目标与体验目标两个维度进行逆向拆解分析，提交分析报告（约800字）。

        3. 教师巡回指导，及时发现并纠正学生实践中的认知偏差。'
      minutes: 35
    - stage: 小结
      summary: '知识凝练与教学反思:

        1. 归纳梳理：汇报各组拆解发现，总结可用性与体验的评估框架

        2. 强化记忆：系统性总结本节课核心知识点与技能框架。

        3. 布置课后延伸思考与预习任务。'
      minutes: 10
- week: 2
  chapter: 2
  chapter_title: 人类认知与心智摩擦
  readings:
  - 《交互设计：超越人机交互》第4章
  - 《交互设计精髓》Ch3
  topic: 人类认知与心智摩擦
  content: '2.1 认知框架与记忆负荷优化实践；心智模型与界面隐喻

    2.2 视觉热力与认知过载节点重构'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 深入理解人类认知局限与短时记忆负荷，掌握心智模型与界面隐喻的映射规律
  focus: 心智模型匹配度与降低认知过载的设计法则
  difficulty: 洞察隐形心智摩擦节点并将抽象认知心理学应用于具体的交互重构
  ideology: 探讨无障碍设计与包容性设计，培养技术以人为本的同理心
  teaching_method: 项目导引、白板推演、热力图认知分析实践
  supported_objectives:
  - 知识1
  - 知识2
  task: 选取一个存在认知过载的界面，绘制其认知热力图，标注摩擦节点并提出至少 3 条基于心智模型理论的重构建议。
  lessons:
  - topic: 人类认知与心智摩擦
    objectives:
    - 深入理解人类认知局限与短时记忆负荷
    - 掌握心智模型与界面隐喻的映射规律
    steps:
    - stage: 复习
      summary: '上次课知识回顾:

        1. 回顾 W01 可用性与体验目标框架

        2. 检查学生对前置知识的掌握情况，建立新旧知识的逻辑桥梁。'
      minutes: 10
    - stage: 导入
      summary: '课程情境导入:

        1. 以一组''看似好用却令人抓狂''的界面案例引入，揭示隐形认知摩擦的存在

        2. 明确本节课核心聚焦点：心智模型匹配度与降低认知过载的设计法则

        3. 激发学生学习动机与探索兴趣。'
      minutes: 15
    - stage: 讲授
      summary: '核心方法与实操解析:

        1. 实训主线：认知框架（注意力/感知/记忆）的界面映射、Miller 法则、心智模型匹配与隐喻设计、格式塔在界面中的应用

        2. 实践要点拆解：2.1 认知框架与记忆负荷优化实践；心智模型与界面隐喻 2.2 视觉热力与认知过载节点重构

        3. 重难点突破：针对“洞察隐形心智摩擦节点并将抽象认知心理学应用于具体的交互重构”，采用案例剖析策略。

        4. 支撑目标：深入理解人类认知局限与短时记忆负荷'
      ideology: 探讨无障碍与包容性设计，培养以人为本的同理心
      minutes: 110
    - stage: 实践
      summary: '课堂实践与操作训练:

        1. 实践任务指导：视觉热力图认知分析——标注过载节点并推演重构方案

        2. 核心任务目标：选取一个存在认知过载的界面，绘制其认知热力图，标注摩擦节点并提出至少 3 条基于心智模型理论的重构建议。

        3. 教师巡回指导，及时发现并纠正学生实践中的认知偏差。'
      minutes: 35
    - stage: 小结
      summary: '知识凝练与教学反思:

        1. 归纳梳理：总结认知负荷控制的设计法则

        2. 强化记忆：系统性总结本节课核心知识点与技能框架。

        3. 布置课后延伸思考与预习任务。'
      minutes: 10
- week: 3
  chapter: 3
  chapter_title: 产品洞察与痛点切入
  readings:
  - 《精益 UX》Ch1-4
  topic: 产品洞察与痛点切入
  content: '3.1 定性调研原则；敏捷业务痛点发掘

    3.2 启动 实验1(Exp1)，JTBD 深度访谈 AI 陪练'
  exp_id: 1
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 掌握精益用户体验研究中的定性调研方法
    ability: 能敏锐挖掘用户痛点与业务机会
  focus: 聚焦真正痛点而非表面现象的定性调研原则与 JTBD 方法
  difficulty: 跳出现有解决方案的框架，通过深度访谈准确捕获用户待办目标(JTBD)
  ideology: 强调同理心在数字时代的重要性，以解决社会真实问题为设计出发点
  teaching_method: 项目导引、访谈技巧示范、微调研方案设计实录
  supported_objectives:
  - 知识1
  task: 以小组为单位完成 5 人次 JTBD 微访谈，输出痛点洞察报告，包含访谈记录摘要、痛点归纳与机会点排序。
  lessons:
  - topic: 产品洞察与痛点切入
    objectives:
    - 掌握精益 UX 定性调研方法
    - 能敏锐挖掘用户痛点与业务机会
    steps:
    - stage: 复习
      summary: '上次课知识回顾:

        1. 回顾 W02 认知摩擦，引出用调研发现真实痛点的必要性

        2. 检查学生对前置知识的掌握情况，建立新旧知识的逻辑桥梁。'
      minutes: 10
    - stage: 导入
      summary: '课程情境导入:

        1. 展示一款''设计师觉得完美但用户频繁弃用''的产品，引出真实痛点挖掘的重要性

        2. 明确本节课核心聚焦点：聚焦真正痛点而非表面现象的定性调研原则与 JTBD 方法

        3. 激发学生学习动机与探索兴趣。'
      minutes: 10
    - stage: 讲授
      summary: '核心方法与实操解析:

        1. 实训主线：Lean UX 定性调研原则实操、JTBD 方法论、深度访谈技巧（5 Why / 开放式提问）、痛点分级

        2. 实践要点拆解：3.1 定性调研原则；敏捷业务痛点发掘 3.2 启动 实验1(Exp1)，JTBD 深度访谈 AI 陪练

        3. 重难点突破：针对“跳出现有解决方案的框架，通过深度访谈准确捕获用户待办目标(JTBD)”，采用案例剖析策略。

        4. 支撑目标：掌握精益 UX 定性调研方法'
      ideology: 强调同理心在数字时代的重要性，以社会真实问题为设计出发点
      minutes: 70
    - stage: 实践
      summary: '课堂实践与操作训练:

        1. 实践任务指导：启动 实验1(Exp1)——与 AI 陪练进行 JTBD 深度访谈

        2. 核心任务目标：以小组为单位完成 5 人次 JTBD 微访谈，输出痛点洞察报告，包含访谈记录摘要、痛点归纳与机会点排序。

        3. 教师巡回指导，及时发现并纠正学生实践中的认知偏差。'
      minutes: 80
    - stage: 小结
      summary: '知识凝练与教学反思:

        1. 归纳梳理：点评各组调研方案，布置课后完成 5 人次访谈

        2. 强化记忆：系统性总结本节课核心知识点与技能框架。

        3. 布置课后延伸思考与预习任务。'
      minutes: 10
- week: 4
  chapter: 4
  chapter_title: 假设驱动与MVP构建
  readings:
  - 《精益 UX》Ch10-12
  topic: 假设驱动与MVP构建
  content: '4.1 抛弃重型 Persona，假设驱动与极简场景的界定

    4.2 启动并完成 实验2(Exp2)，制作 Proto-Persona 用户画像'
  exp_id: 2
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 应用假设驱动的敏捷设计思维
    ability: 能界定极简场景并输出最小可行性产品(MVP)需求清单
  focus: 从痛点洞察到假设声明与 MVP 核心功能边界的收敛
  difficulty: 在发散的需求中果断做减法，精确定义仅验证核心假设的 MVP 范围
  ideology: 培养实事求是的科学试错精神，防范盲目大干快上的工程浪费风险
  teaching_method: 项目导引、案例复盘、MVP 清单讨论与决策
  supported_objectives:
  - 知识1
  task: 基于 W03 调研成果，撰写假设声明（Proto-Persona + Value Proposition），输出 MVP 功能优先级清单（MoSCoW 法）。
  lessons:
  - topic: 假设驱动与MVP构建
    objectives:
    - 应用假设驱动的敏捷设计思维
    - 能界定极简场景并输出 MVP 需求清单
    steps:
    - stage: 复习
      summary: '上次课知识回顾:

        1. JTBD 访谈方法，提炼共性痛点

        2. 检查学生对前置知识的掌握情况，建立新旧知识的逻辑桥梁。'
      minutes: 15
    - stage: 导入
      summary: '课程情境导入:

        1. 对比''功能臃肿的失败产品 vs 极简 MVP 的成功案例''，引出做减法的智慧

        2. 明确本节课核心聚焦点：从痛点洞察到假设声明与 MVP 核心功能边界的收敛

        3. 激发学生学习动机与探索兴趣。'
      minutes: 10
    - stage: 讲授
      summary: '核心方法与实操解析:

        1. 实训主线：假设驱动设计实践、Proto-Persona vs 重型 Persona、MVP 边界收敛方法（MoSCoW）

        2. 实践要点拆解：4.1 抛弃重型 Persona，假设驱动与极简场景的界定 4.2 启动并完成 实验2(Exp2)，制作 Proto-Persona 用户画像

        3. 重难点突破：针对“在发散的需求中果断做减法，精确定义仅验证核心假设的 MVP 范围”，采用案例剖析策略。

        4. 支撑目标：应用假设驱动的敏捷设计思维'
      ideology: 培养实事求是的科学试错精神，防范工程浪费
      minutes: 65
    - stage: 实践
      summary: '课堂实践与操作训练:

        1. 实践任务指导：启动并完成 实验2(Exp2)——制作 Proto-Persona 用户画像，输出 MVP 清单

        2. 核心任务目标：基于 W03 调研成果，撰写假设声明（Proto-Persona + Value Proposition），输出 MVP 功能优先级清单（MoSCoW 法）。

        3. 教师巡回指导，及时发现并纠正学生实践中的认知偏差。'
      minutes: 80
    - stage: 小结
      summary: '知识凝练与教学反思:

        1. 归纳梳理：各组 MVP 清单互评，强调做减法的纪律

        2. 强化记忆：系统性总结本节课核心知识点与技能框架。

        3. 布置课后延伸思考与预习任务。'
      minutes: 10
- week: 5
  chapter: 5
  chapter_title: 目标导向路径与架构
  readings:
  - 《交互设计精髓》Ch4-5
  topic: 目标导向路径与架构
  content: '5.1 心流机制；前端页面状态流式拆解与编排

    5.2 启动 实验3(Exp3)，起草应用状态流转白板图'
  exp_id: 3
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 理解心流状态的触发条件，掌握前端页面状态机的流式拆解手法与逻辑编排能力
  focus: 目标导向的流式架构图设计与界面状态机的完整闭环设计
  difficulty: 抛弃静态页面思维，全面梳理考虑各种临界和中间状态的动态跳转逻辑
  ideology: 在架构规划中坚持系统观念与全局视野，培养严谨的逻辑推理能力
  teaching_method: 项目导引、系统蓝图拆解、状态机白板绘图实操
  supported_objectives:
  - 知识1
  - 知识2
  task: 将 MVP 清单转化为完整的页面状态流转架构图（含正常流 + 至少 3 个异常分支），以白板图或 FigJam 形式提交。
  lessons:
  - topic: 目标导向路径与架构
    objectives:
    - 理解心流状态的触发条件
    - 掌握前端页面状态机的流式拆解与编排
    steps:
    - stage: 复习
      summary: '上次课知识回顾:

        1. 回顾 W04 MVP 清单，引出需要逻辑架构支撑功能落地

        2. 检查学生对前置知识的掌握情况，建立新旧知识的逻辑桥梁。'
      minutes: 10
    - stage: 导入
      summary: '课程情境导入:

        1. 演示一个看似完整但用户频繁迷路的应用流程，暴露缺乏状态机规划的混乱

        2. 明确本节课核心聚焦点：目标导向的流式架构图设计与界面状态机的完整闭环设计

        3. 激发学生学习动机与探索兴趣。'
      minutes: 10
    - stage: 讲授
      summary: '核心方法与实操解析:

        1. 实训主线：心流机制与沉浸设计实战、目标导向设计方法论实操、状态机拆解（正常流/异常流/空状态）

        2. 实践要点拆解：5.1 心流机制；前端页面状态流式拆解与编排 5.2 启动 实验3(Exp3)，起草应用状态流转白板图

        3. 重难点突破：针对“抛弃静态页面思维，全面梳理考虑各种临界和中间状态的动态跳转逻辑”，采用案例剖析策略。

        4. 支撑目标：理解心流状态的触发条件'
      ideology: 培养系统观念与全局视野，强调严谨逻辑推理
      minutes: 70
    - stage: 实践
      summary: '课堂实践与操作训练:

        1. 实践任务指导：启动 实验3(Exp3)——白板绘制应用状态流转架构图，互查异常分支完备性

        2. 核心任务目标：将 MVP 清单转化为完整的页面状态流转架构图（含正常流 + 至少 3 个异常分支），以白板图或 FigJam 形式提交。

        3. 教师巡回指导，及时发现并纠正学生实践中的认知偏差。'
      minutes: 80
    - stage: 小结
      summary: '知识凝练与教学反思:

        1. 归纳梳理：点评典型架构图，预告视觉系统构建

        2. 强化记忆：系统性总结本节课核心知识点与技能框架。

        3. 布置课后延伸思考与预习任务。'
      minutes: 10
- week: 6
  chapter: 6
  chapter_title: 容器工程化基础映射
  readings:
  - 《数字媒体交互设计》项目2
  topic: 容器工程化基础映射
  content: '6.1 DOM视觉映射机理；Figma AutoLayout 向 CSS Flex 的底层转化基础

    6.2 在 Figma 搭建严苛响应式组件框架'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 理解设计工具与前端开发的映射机理
    ability: 掌握从 AutoLayout 容器思维到响应式组件框架的构建
  focus: DOM 结构思维与 Figma AutoLayout/CSS Flex 的原子映射规律
  difficulty: 摆脱自由画板的绘图习惯，建立严苛的盒模型容器嵌套工程化意识
  ideology: 认识工程标准化的降本增效价值，培养遵守规则、精进技艺的工匠精神
  teaching_method: 项目导引、设计系统工程化演示、Figma 容器搭建测验
  supported_objectives:
