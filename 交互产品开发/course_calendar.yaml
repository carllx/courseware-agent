  chapter: 11
  chapter_title: 逻辑排障与兜底策略
  readings:
  - 《交互设计精髓》Ch15
  topic: 逻辑排障与兜底策略
  content: '本周课程围绕AI生成代码失控时的逻辑排障与演示兜底策略展开。首先通过“Read-Explain-Fix”三步法教授学生如何利用LLM辅助阅读前端控制台报错，识别五大常见前端错误。其次解构原型的混合保真度光谱，探讨水平原型与垂直原型的策略取舍，理解抛弃式原型的本质与“绿野仙踪法”。最后针对产品演示（Demo）可能发生的“状态断裂”灾难，建立AI自修、Figma热补丁与口头叙事相补充的“三级降级兜底策略”，并将其应用于“实践项目3”的收尾验收准备中。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    ability: 具备基本的代码辅助阅读自检能力
    knowledge: 掌握大模型陷入死循环时的兜底降级方案与混合保真测试准备工作
  focus: 掌握前端常见错误的AI辅助排障三步法（Read-Explain-Fix），以及基于混合保真度光谱的原型取舍策略与答辩演示的三级降级兜底策略。
  difficulty: 突破面对报错时的“技术规避本能”，在AI调试中把控“解释权”，避免无底线的“吉娃娃效应”瞎改代码；以及在资源受限下对原型保真度的精准取舍与兜底防线的构建。
  ideology: 
    培养对代码与系统工程底线的敬畏心（通过AWS宕机与Therac-25医疗事故案例），认识到技术的脆弱性与风险管理的重要性；树立面对技术灾难（如演示失败）时具备临危不乱的专业素养，以及“不掩饰错误、积极兜底补救”的工程伦理与大局观责任感。
  teaching_method: 项目导引、重度 Bug 抢救实演、混合保真兜底演练
  supported_objectives:
  - 知识1
  - 素质2
  task: 
    实践项目3收尾实战准备：执行项目状态极端测试审计，运用排障三步法修复核心链路Bug，并为易出现“状态断裂”的高危环节建立Figma备用锚点与兜底防线；同时完成课后的典型前端报错实战排障练习。
  lessons:
  - topic: 代码不是黑箱：前端排障与AI辅助阅读
    objectives:
    - 掌握Read→Explain→Fix三步排障法
    - 识别前端报错的五大元凶
    - 理解事不过三的调试纪律，避免代码雪崩
    steps:
    - stage: 导入
      summary: 引出面对代码报错时的恐慌与设计师在AI时代的代码阅读要求
      minutes: 10
    - stage: 讲授
      summary: 讲解Read-Explain-Fix三步法及前端5大报错元凶（状态未同步、事件泄漏等）
      minutes: 25
    - stage: 实践
      summary: 小组分享排障经历与避坑“吉娃娃效应”的讨论
      minutes: 5
    - stage: 小结
      summary: 总结控制排障节奏与获取AI解释权的核心素养
      minutes: 5
  - topic: 原型的本质：混合保真度光谱与策略取舍
    objectives:
    - 解构原型保真度的五个维度
    - 区分水平原型与垂直原型的应用场景
    - 掌握抛弃式原型的本质与‘绿野仙踪测试法’
    steps:
    - stage: 导入
      summary: 抛出“零Bug是否是交互终极目的”的疑问，引出保真度光谱概念
      minutes: 5
    - stage: 讲授
      summary: 解析原型五维光谱、水平vs垂直策略、电梯安慰剂效应及抛弃式原型与技术债
      minutes: 30
    - stage: 实践
      summary: 进行混合保真度映射实战（Fidelity Mapping）与答辩预演推演
      minutes: 15
    - stage: 小结
      summary: 总结用抛弃式原型快速验证核心商业价值的极简设计哲学
      minutes: 5
  - topic: 绝地求生：演示风险管控与实践项目验收准备
    objectives:
    - 理解演示中‘状态断裂’的四种等级与危害
    - 建立答辩现场的三级降级兜底方案
    - 在实践项目中实装排障与热补丁策略
    steps:
    - stage: 导入
      summary: 描绘演示现场白屏的灾难场景，指出AI代码缺乏防御性编程的脆弱本质
      minutes: 5
    - stage: 讲授
      summary: 剖析状态断裂的四个致命等级，并通过Therac-25事故讲解三级兜底防线（AI自修、Figma热补丁、终极口头叙事）
      minutes: 30
    - stage: 实践
      summary: 实践项目3状态审计与极端抗压测试，为高危环节规划Figma备用连线
      minutes: 40
    - stage: 小结
      summary: 总结风险管理在产品开发中的重要性，强调答辩演示体验完整性的最高原则
      minutes: 5
- week: 12
  chapter: 12
  chapter_title: 启发式评估原理与应用
  readings:
  - 《交互设计：超越人机交互》第14、15章
  topic: 启发式评估原理与应用
  content: '本周内容以寻找界面中的“隐形地雷”为核心，阐述由于系统与用户心智模型错位而引发的可用性灾难，详细解构了可用性测试的三大阵营。重点剖析了Jakob
    Nielsen十大可用性启发式原则（Heuristics）背后的认知心理学底层逻辑，并探讨其在现代空间计算、暗黑模式及中国本土庞大下沉市场应用生态中的时代局限与演进。最后教授工业级标准化启发式评估流程，并启动跨组独立互评实战项目。'
  exp_id: 5
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 掌握以 Nielsen 十大原则为核心的启发式评估方法
    ability: 能客观、高效地发现产品中违反可用性常理的高优先级问题
  focus: 深刻理解Nielsen十大可用性启发式原则的内涵及判定标准，掌握包含简报、双重独立扫描与去重定级三阶段在内的标准化启发式评估（走查）流程。
  difficulty: 
    跨越“开发者视角”的主观盲区并克服“知识诅咒”；在具体的评估操作中，学会运用三大阶段与背靠背独立机制来避免“群体盲思”与“假阳性（误判）”，将抽象法则精准对应至复杂交互漏洞。
  ideology: 
    敬畏真实用户的心智模型，确立设计的生命安全底线与社会责任（如医疗/航空系统的交互灾难反思）；破除技术人员的傲慢以培养深度的用户同理心；警惕并抵制利用认知偏差作恶的“暗黑模式”，坚守科技向善的职业道德与价值观。
  teaching_method: 项目导引、对照打分示范、各组互换原型进行专家检验
  supported_objectives:
  - 知识1
  - 知识3
  - 能力3
  - 素质1
  task: 
    启动【实践项目4】：生生互评跨组走查日。通过组间配对和独立双重走查，使用Nielsen十大原则对他组的高保真原型开展背靠背启发式审计，合并产出《缺陷排雷清单》；进行面对面宣判与辩护后，生成基于他人反馈的《我方妥协与修改计划》。
  lessons:
  - topic: 我们为什么需要评估？
    objectives:
    - 认识可用性评估在避免产品灾难及生命危险中的核心地位
    - 理解形成性评估与总结性评估的核心区别
    - 掌握可用性评估的三大阵营与Jakob Nielsen廉价可用性工程优势
    steps:
    - stage: 导入
      summary: 展示真实世界反常识建筑设计，并通过波音737 MAX与Therac-25事件，阐明未受评估的界面缺陷可能导致的致命后果，点明“代码跑通不等于好用”。
      minutes: 5
    - stage: 讲授
      summary: 对比受控环境测试、自然环境观察与无参与者检查的区别与优劣，引出启发式评估（Heuristic Evaluation）概念，以及3-5人参与评估的最高投资回报率曲线。
      minutes: 20
    - stage: 实践
      summary: 找茬游戏 (Bad UI Bingo)：分组快速扫描真实App中的反人类交互设计，唤醒学生对糟糕体验的直观痛点感知。
      minutes: 5
  - topic: Nielsen 十大原则深度走查与时代演进
    objectives:
    - 准确理解并识记H1至H10十大可用性启发式原则的界定标准
    - 运用原则剖析界面背后的工作记忆、系统双轨等认知心理学底层逻辑
    - 辩证分析并理解可用性原则的时代局限、暗黑模式及中国式本土重构
    steps:
    - stage: 讲授
      summary: 深度讲解H1系统状态可见性、H2与真实世界匹配、H3用户控制与自由、H4一致性与标准及H6识别胜于回忆。拆解系统1/2双规模型及物理隐喻。
      minutes: 25
    - stage: 讲授
      summary: 讲解H5错误预防、H9诊断恢复、H7灵活性与效率、H8美学极简及H10帮助文档。分析原则诞生于古典时代的局限性、伦理困境及中国“高密度设计”特色的突变与重构。
      minutes: 25
    - stage: 实践
      summary: 危险边缘 Quiz：闪现10个案发现场动图，各小组计时抢答违背的具体原则序号，将理论原则转化为直观辨错能力。
      minutes: 10
  - topic: 走查实战：从挑刺到系统排雷
    objectives:
    - 掌握启发式评估标准化的三阶段实施流程
    - 避免伪专家带来的“假阳性”及从众心理偏差
    - 完成跨组产品的独立体验审查并提出具优先级的改进方案
    steps:
    - stage: 讲授
      summary: 详解简报建立、独立双重扫描走查、汇报去重与致命定级的三阶段严密操作规程。强调防止“假阳性”误差与单兵作战的局限性。
      minutes: 10
    - stage: 实践
      summary: 【实践项目4阶段一&二】组间协议握手；评审小组成员处于静默状态，完成两遍产品宏观心流及显微镜查验的背靠背评估，截图并使用原则编号打分标注。
      minutes: 45
    - stage: 总结
      summary: 【实践项目4阶段三&四】评估组内部汇总定级输出《排雷清单》；随后两组合体开展面对面宣判与辩护，澄清设计初衷与偏差，最后达成《修改计划》共识。
      minutes: 35
- week: 13
  chapter: 13
  chapter_title: 对话与可操作测试法
  readings:
  - 《精益 UX》Ch15
  topic: 对话与可操作测试法
  content: '本周从评估方法的理论基础出发，探讨了由专家走查向受控环境中用户测试的范式跃迁；深度讲解了出声思考法（CTA）的理论、核心价值及主持人的干预克制；介绍了用敏捷的降维测试阵型与『五人魔法模型』替代高成本实验室测试，并教授0-4级可用性严重度评级量表。最后通过跨组同侪实战体验了可用性测试的完整闭环。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    knowledge: 掌握无硬件眼动仪等条件限制下的低成本测试利器——出声思考法
    ability: 能够主持科学的用户操作与定性观察
  focus: 并发出声思考法（CTA）的原理与执行、主持人的干预克制法则（两难陷阱）、基于三人降维建制的五人规模游击测试，以及0至4级严重度评级量表。
  difficulty: 
    作为测试的主持人，极其难以克制自身本能的『技术施舍』与解释防御欲，要做到绝不引导、不反驳、容忍沉默是最大的挑战；而记录员需将带有情绪体验的主观表达冷酷地转译为客观的工业缺陷严重度定级。
  ideology: 
    培养『剥离自负与换位倾听』的职业操守与表达适应力（素质1）。设计师需破除『我的心智即用户心智』的技术傲慢，以敬畏之心直观面对用户的受挫感；通过沉默而专注的倾听，提升深刻的同理心并在实战中灵活切换中立引导与客观汇报的沟通策略。
  teaching_method: 项目导引、主持过程正反面情景重现、实地组编组下放测试
  supported_objectives:
  - 知识1
  - 素质1
  - 素质3
  task: 
    同侪出声思考实战验证（实践项目推进）：编写中立的测试任务卡，跨组交换高保真原型，以三人团队（测试者、影子观察员、冷酷记录员）阵型开展三轮并发出声测试，最终输出标有0-4严重级别的可用性问题列表。
  lessons:
  - topic: 模块 1：从专家检查到用户对话 — 评估方法论的两条路
    objectives:
    - 理解从专家启发式评估向受控真实用户测试演进的必然性
    - 掌握评估的三大核心范式及形成性/总结性评估的概念
    - 理解定量数据（What）与定性对话（Why）之间的互补价值与三角测量法
    steps:
    - stage: 导入
      summary: 用医生看X光片与病床前问诊的隐喻引入主题，比较专家走查的局限性与真实用户反馈的心智价值。
      minutes: 5
    - stage: 讲授
      summary: 讲授人机交互经典的三类测试范式分布，并解析形成性评估（改错）与总结性评估（打分）的生命周期位置。
      minutes: 10
    - stage: 互动
      summary: 进行老年人挂号小程序的认知盲区大摸底提问，揭示定性对话在挖掘深层心理卡点上的不可替代性。
      minutes: 5
    - stage: 案例
      summary: 讲解Google『41种蓝色』AB测试灾难与Airbnb心形图标重塑的成功对比，阐释三角测量法在业界的实操运用。
      minutes: 10
  - topic: 模块 2：有声思维法：让脑子里的声音被听见
    objectives:
    - 了解出声思考法（TAP）的历史源起与其探测潜意识心智模型的核心机制
    - 对比回溯出声（RTA）与并发出声（CTA），理解前者事后合理化弱点和后者新鲜度优势
    - 深刻剖析并学会规避可用性测试中主持人的四大操作雷区
    steps:
    - stage: 讲授
      summary: 介绍出声思考法的奠基历程，以及RTA测试面临的事后合理化记忆污染风险和CTA拥抱杂音的超强即时还原度。
      minutes: 15
    - stage: 案例
      summary: 复盘早期初代iPad可用性实战测试，演示即使仅利用几人规模的极简CTA测试，仍能洞察出致命的设备握持泥潭和界面盲区。
      minutes: 10
    - stage: 演练
      summary: 详细揭露主持人的四大干预本能（引导暗示、无法忍受沉默、自我防御与虚假施舍），用长达3分钟的沉默高压视频进行极限克制挑战。
      minutes: 15
  - topic: 模块 3：桌面版实验室与降维测试体系
    objectives:
    - 打破对昂贵高端实验室的迷信，理解火箭外科手术精神下的游击测试精要
    - 利用泊松分布的『五人魔法定律』组织快速敏捷的迭代测试
    - 熟练调配三人微型测试建制，并用严重度标尺为漏洞估级
    steps:
    - stage: 讲授
      summary: 批判高配置测试带来的拖延弊病，通过Nielsen的回归模型曲线阐释为何仅仅5名用户即可暴露85%的产品硬伤及其高ROI边际效用。
      minutes: 10
    - stage: 讲授
      summary: 部署战术级的三人降维编组，规定『测试者、影子主持人、冷血打点员』的站位规范、沟通禁忌与情绪呼吸隔离修养。
      minutes: 10
    - stage: 演练
      summary: 学习将用户的抱怨提取并量化为0至4级（幻象、瑕疵、中度阻碍、主干断裂、灾难报错）的工业通用严重度分数，并进行情境判断打分。
      minutes: 10
  - topic: 模块 4：跨组同侪出声思考测试
    objectives:
    - 应用小组已有高保真原型与刚学过的降维测试阵型
    - 在没有预设提示的干预下实施真实场景的原生态可用性测试循环
    - 熟练使用评估表格完成定性挫败向定量缺陷档案的转录
    steps:
    - stage: 实践
      summary: 先编写中立的测试任务并自我查漏；随后两组之间相互出借产品盲测，以三人小队结构严格轮流体验沉默旁观、冷酷记录与崩溃盲扫的全流程（历时80分钟，多轮替换）。
      minutes: 80
- week: 14
  chapter: 14
  chapter_title: 数据复盘与作品库凝练
  readings:
  - 《精益 UX》Ch16-17
  topic: 数据复盘与作品库凝练
  content: '质性数据归纳（亲和图）、可用性严重度分级评估工具、UX作品集闭环叙事结构（英雄之旅与八章节法）、批判“设计的Dribbble化”。'
  hours_theory: 0
  hours_practice: 4
  teaching_requirements:
    ability: 能够系统梳理并量化测试反馈
    knowledge: 掌握交互体验从发现到验证再到优化的闭环叙事结构并制作展示资产
  focus: 如何将可用性测试的负面定性数据转化为结构化的改进依据，并利用“英雄之旅”叙事框架打造具有商业逻辑说服力的专业UX作品集。
  difficulty: 克服“防御性归因”和“表面修复”的新手心理，勇于面对和展示失败的测试数据，并完成逻辑严密的体验重构（UX Pivot）。
  ideology: 
    树立专业伦理与用户同理心，拒绝脱离业务痛点、单纯追求视觉的“美丽的废物”；勇于拥抱失败，在不断推翻重构中捍卫产品体验底线，实现从“画图美工”到“产品灵魂战略家”的职业身份觉醒。
  teaching_method: 项目导引、作品集结构剖析、数据归纳实操、展板撰写辅导
  supported_objectives:
