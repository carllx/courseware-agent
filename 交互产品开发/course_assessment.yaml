assessment_methods:
  normal_score_ratio: 50
  final_score_ratio: 50
  attendance_ratio: 10
  normal_items:
  - name: 章节测试一
    ratio: 10
    desc: 对应实验 1「Jobs to be Done 的反弹陪练」。考核要求：完成基于 AI 反弹陪练的深度访谈，挖掘核心痛点，并提炼结构化的 JTBD 报告。
  - name: 章节测试二
    ratio: 15
    desc: 对应实验 2「画出 Proto Persona（用户画像）」。考核要求：运用设计工具将早期定性调研数据视觉化，产出严谨的四大标准模块用户画像卡，体现假设驱动方法论。
  - name: 章节测试三
    ratio: 15
    desc: 对应实验 3「AI Agents 驱动的个人作品集网站实现」。考核要求：产出包含完整前期过程文档（简报、PRD、前端规范、架构）及基于纯 HTML/CSS/JS 实现的 4 个核心网页初稿，体现 AI 协作与文档驱动的工程能力。
  final_item:
    name: 期末综合项目考查
    ratio: 100
    desc: 对应实验 4「基于精益用户体验的综合设计」。要求按照默认的 A 卷（个人作品集网站）完成独立开发。考核将侧重于前端页面完整度、代码规范及 UI 还原度。详见 practices/project_brief.md。
exams:
  final_exam:
  - name: 期末综合项目考查
    total_score: 100
    duration: 120
    sections:
    - section_name: 原型设计与架构规划
      total_score: 30
      questions:
      - content: 对应实验 4「基于精益用户体验的综合设计」。考核要求（A卷）：个人作品集网站的页面逻辑流向清晰，包含至少 4 个核心页面（如首页、简介、作品库、联系方式），且各页面间跳转导航设计合理，无死链。
        type: 综合性
        score: 30
    - section_name: 前端代码规范与完备度
      total_score: 40
      questions:
      - content: 对应实验 4「基于精益用户体验的综合设计」。考核要求（A卷）：全程使用 HTML、CSS 和 JavaScript 构建，文件结构组织清晰（如独立拆分 css、js 文件）；HTML 标签语义化正确；CSS 代码复用率高，体现一定的组件化和模块化思想，未滥用内联样式。
        type: 综合性
        score: 40
    - section_name: 视觉呈现与动效体验
      total_score: 30
      questions:
      - content: 对应实验 4「基于精益用户体验的综合设计」。考核要求（A卷）：视觉 HSL 色彩体系和谐，版式布局符合现代审美规范并具备一定的响应式适配能力；合理地注入了 JavaScript 或 CSS3 互动特效（如 Hover 状态反馈、页面转场过渡），提升整体操作 Vibe。
        type: 综合性
        score: 30
