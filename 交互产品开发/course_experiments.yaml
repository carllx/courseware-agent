experiments:
- id: 1
  name: JTBD 深度访谈 AI 陪练
  type: 验证性
  hours: 2
  group_size: 1
  requirement: 必做
  summary: 运用深度访谈五步法与 AI 陪练进行对战，识别用户痛点并输出结构化的 Proto-Persona 数据卡。
  objectives: '（一）掌握 JTBD（Jobs-to-be-Done）待办任务框架的三维度分析方法。

    （二）掌握 5-Whys 连环追问法，对表层回答进行深度追问。

    （三）掌握 Problem Statement 问题陈述公式。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备）

    2. 软件：AI 对话平台（DeepSeek / 豆包 / Kimi 等）

    '
  requirements: '（一）须获取完整对话日志截图（不少于 5 轮有效追问）。

    （二）须获取 AI 生成的四大标准模块 Proto-Persona 数据卡。

    （三）须完成学生实验报告，图文交替排版。

    '
  methods: '1. 注入系统提示词并选择盲盒角色。

    2. 进行情境沉浸提问与 5-Whys 连环追问。

    3. 获取结构化的 Proto-Persona 数据卡总结。

    '
  conclusions: '反思访谈深度，总结言行鸿沟等核心概念的实践体会，以及不同提问策略的效果对比。

    '
- id: 2
  name: Proto-Persona 用户画像制作
  type: 设计性
  hours: 2
  group_size: 1
  requirement: 必做
  summary: 基于实验 1 的访谈数据卡，在设计工具中制作包含四大标准模块的 Proto-Persona 视觉画像。
  objectives: '（一）掌握 Proto-Persona（原型用户画像）的四大标准模块格式。

    （二）理解人口统计学陷阱 (Demographic Trap) 的危害。

    （三）掌握将文字调研数据视觉化表达的基本能力。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备）

    2. 软件：Figma / Illustrator / 其他绘图软件

    '
  requirements: '（一）须输出包含四大模块的 A4 尺寸 Proto-Persona 画像卡成品。

    （二）须提供至少 3 张制作过程截图。

    （三）须完成学生实验报告，图文交替排版。

    '
  methods: '1. 整理实验 1 的结构化数据卡内容。

    2. 使用设计工具建立 A4 画布并划分四大区块。

    3. 填入背景档案、行为核心特征、JTBD 和痛点陈述，并排版导出。

    '
  conclusions: '反思数据转化可视化的难点，总结在规避人口学陷阱上的思考，理解 Proto-Persona 作为假设的定位。

    '
- id: 3
  name: 状态机映射与视觉体系 (States & System)
  type: 综合性
  hours: 6
  group_size: 1
  requirement: 必做
  summary: 完成系统级页面状态流转架构及前端实现的原子级设计 Token 体系建立，并补全极端情境边界的防错设计。
  objectives: '（一）能将粗略线框图转化为具有严苛响应式组件框架的骨架，建立盒模型容器工程化意识。

    （二）掌握基于 HSL 系统与光影深度规则的 Design Token 体系构建方法，实现视觉一致性。

    （三）能穷举极端状态与错误边界，为各类边缘情境设计优雅的防错与宽容度反馈。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备）

    2. 软件：Windows 10+；Figma（AutoLayout 组件系统 + Variables）

    '
  requirements: '（一）须产出覆盖正常流与至少 5 个边缘状态（空状态/加载中/报错/无网络/首次使用）的完整状态机。

    （二）须建立完整的 Design Token 体系（Typography × 4 级、Color × HSL 语义色、Spacing × 4 级）。

    （三）须建立视觉 Token Prompt 集，用于后续 AI 代码生成阶段的结构化指令构建。

    '
  methods: '1. 将粗略线框图转化为具有严苛响应式组件框架（卡片/列表/导航三级嵌套）的骨架。

    2. 基于 HSL 系统、光影深度规则等为骨架填入视觉系统标签（Design Tokens）。

    3. 梳理极端状态与错误边界，补全兜底反馈（空状态/加载/报错/首次使用）。

    '
  conclusions: '总结 Design Token 体系构建的关键决策（色彩语义分层、排版层级设定），分析状态机穷举边界过程中发现的设计盲点，说明视觉 Token Prompt 集对后续 AI 协作的指导作用。

    '
- id: 4
  name: AI 原型与创意动效生成 (AI Prototyping)
  type: 设计性
  hours: 10
  group_size: 1
  requirement: 必做
  summary: 利用前沿 AI 生成工具与代码助手跨越工程门槛，通过结构化 Prompt 驱动生成应用静态雏形并注入创意互动特效。
  objectives: '（一）将 Token 体系与状态流转图转化为结构化 System Prompt，驱动 AI 工具生成高保真前端壳层。

    （二）掌握通过 AI 代码助手植入跟随、粒子等创意动效的协作流，完成微交互融合。

    （三）具备基本的代码辅助阅读自检能力，能判断 AI 生成代码的断点并采用混合保真兜底方案。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备）

    2. 软件：Windows 10+；v0 / CodeGeeX（AI 生成）、VS Code、Figma（兜底用）

    '
  requirements: '（一）须将 Token 体系与状态流转图转化为结构化 Prompt，驱动 AI 生成应用初始视图壳层，提交 Prompt 原文与生成结果截图。

    （二）须为原型植入至少 2 个创意微动效（如跟手粒子/页面转场/hover 反馈），提交动效演示录屏。

    （三）须对所有核心状态完成串联，对无法解决的断点采用 Figma 混合保真兜底并提交排障日志。

    '
  methods: '1. 提炼视觉系统 Prompt，驱动 AI 生成工具输出前端页面静态壳层。

    2. 引入并使用代码助手实现跟随、粒子等基础创意动效。

    3. 回归设计工具或代码中，排障修复串联断裂的核心交互状态。

    '
  conclusions: '总结结构化 Prompt 构建方法与 AI 协作中的关键发现，记录主要排障节点与兜底策略，反思混合人机协同工作流的效率边界与局限性。

    '
- id: 5
  name: 启发式评估验证闭环 (Heuristic Evaluation)
  type: 综合性
  hours: 8
  group_size: 1
  requirement: 必做
  summary: 综合运用 Nielsen 十大可用性原则执行跨组启发式走查与 Think-Aloud 用户测试，完成从缺陷发现到迭代修正的完整体验验证闭环。
  objectives: '（一）能以评估专家身份对他组原型执行严格的启发式走查，输出含严重级评定的缺陷报告。

    （二）掌握 Think-Aloud 出声思考法的规范主持技巧，完成至少 3 人次的真实用户测试记录。

    （三）能系统梳理质性测试反馈，完成缺陷修正闭环，并以专业叙事呈现设计迭代全过程。

    '
  equipment: '1. 硬件：个人计算机（学校机房或自备）；可选：录屏/录音设备

    2. 软件：Windows 10+；交互原型（AI 生成 + Figma 混合保真）、笔记软件

    '
  requirements: '（一）须对另一组原型执行启发式走查，输出走查报告（含 Nielsen 原则编号、缺陷描述、严重级评定）。

    （二）须以主持人身份完成至少 3 人次 Think-Aloud 测试，提交测试录屏/录音与观察笔记。

    （三）须完成缺陷修正前后对比文档，并撰写作品集复盘叙事（含数据证据链），参与最终路演答辩。

    '
  methods: '1. 进行基于 Nielsen 十大原则的跨组同侪启发式评估走查。

    2. 用 Think-Aloud 出声思考法对测试者执行可用性测试记录。

    3. 挖掘体验死角并在原型中给出改进版对比设计。

    4. 系统梳理走查与测试反馈，完成缺陷修正前后对比文档与作品集复盘叙事。

    '
  conclusions: '总结启发式走查与 Think-Aloud 测试中发现的最高优先级可用性问题，说明迭代修正的设计逻辑，反思跨组评估带来的他者视角价值与不足。

    '
