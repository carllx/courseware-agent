  introduction:
    content: '本课程是数字媒体艺术专业的核心课程，定位为"AI 辅助的交互体验与系统设计"。课程有意识地剥离了传统重度后端的 SaaS 工程逻辑，转而聚焦于交互体验装置与单页面互动应用的开发。课程体系依托《Interaction
      Design》的认知科学框架，向下兼容《Lean UX》的模型验证与《About Face 4》的信息流构架，并引入 Vibe Coding 理念与实操，让学生借助前沿 AI 代码生成工具 (如 v0、CodeGeeX)，跨越前端工程门槛，独立完成从痛点洞察、高保真状态机构筑到体验式前端输出的闭环。

      '
    design: '课程采用强设定的"1主线+4实验"模式，贯穿15周教学。以"交互单页面体验应用"为项目驱动核心，摒弃假大空的文档撰写，注重"假设驱动"的敏捷落地方孔。教学过程通过"周实操导引 -> 周课内实战 -> 阶段性实验验收"的节奏，最终通过极简的
      AI 工具生成可交互的前沿动效静态雏形，并在教室内完成基于启发式走查与出声思考法的同侪可用性测试评估。

      '
