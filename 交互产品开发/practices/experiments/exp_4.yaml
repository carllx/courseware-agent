exp_id: 4
name: 基于精益用户体验的综合设计
type: 综合性
hours: 14
group_size: 1
requirement: 必做
summary: 基于精益用户体验的综合开发设计。利用 AI Agent 以自然语言驱动（Vibecoding）快速生成并迭代 4 个页面的个人作品集或店铺改造网页。
method_theory: 通过自然语言描述与 AI Agent 协作进行快速原型生成与迭代验证
objectives: |
  （一）掌握“自然语言即代码 (Vibecoding)”的创新开发模式，通过提示词工程驱动项目落地。
  （二）理解精益用户体验 (Lean UX) 的核心，即通过快速生成可用原型来验证设计假设。
  （三）培养跨界产品思维，能够站在用户体验和商业目标的角度指挥 AI 完成多页面产品交付。
equipment: |
  1. 硬件：个人计算机（学校机房或自备）
  2. 软件：VS Code / CodeGeeX / Cursor 等 AI 开发环境
requirements: |
  （一）基于业务需求，指挥 AI Agent 生成包含至少 4 个相互跳转页面的完整项目。
  （二）通过多轮对话迭代，优化页面的视觉排版、响应式适配与交互体验。
  （三）交付真实可运行的网页端产品（无需深究底层前端技术细节），重点在于交互逻辑闭环与审美在线。
methods: |
  1. 构思产品核心价值与页面跳转逻辑。
  2. 使用自然语言向执行型 AI Agent 描述功能需求与视觉风格。
  3. 在本地运行生成的网页原型，进行真实体验走查。
  4. 针对体验缺陷，通过追加纠偏指令指挥 AI 进行多轮迭代修改。
conclusions: |
  反思自然语言驱动开发模式（Vibecoding）带来的效率提升与协作难点，总结在指挥 AI 落地创意时的提示词策略。
steps:
- id: S1
  name: 1. 确立综合项目与产品构思
  guide_text:
  - 确定最终开发项目（个人作品集或店铺改造网页）。
  - 梳理产品的核心价值主张、目标用户以及所需的 4 个核心页面及跳转关系。
  report_prompt:
  - type: text
    prompt: 请列出你所选项目的4个页面名称及相互跳转逻辑。
- id: S2
  name: 2. 自然语言驱动原型生成 (Vibecoding)
  guide_text:
  - 在 VS Code (或 Cursor 等 AI 编辑器) 中，用详尽的自然语言向 Agent 描述你的整体业务需求和页面风格。
  - 指挥 AI 自动生成初始版本的完整网页架构，直接在本地浏览器预览效果。不要去纠结里面具体是用什么代码写的。
  report_prompt:
  - type: text
    prompt: 在初始生成阶段，你向 AI 下达的最关键的一段“核心功能指令”是什么？
  - type: image
    prompt: 请提供初始生成的原型网页在浏览器中的预览截图。
- id: S3
  name: 3. 迭代优化与体验打磨
  guide_text:
  - 像产品经理一样，根据浏览器的预览效果进行走查，找出视觉排版或交互逻辑上的缺陷。
  - 不需要手动改代码，而是通过追加自然语言指令，要求 AI 修复问题、适配手机端或注入微动效。
  report_prompt:
  - type: text
    prompt: 在多轮对话迭代中，你发现 AI 最难理解或最容易做错的要求是什么？你是如何修改提示词纠正它的？
  - type: image
    prompt: 请粘贴一段你用来指导 AI 修复 Bug 或优化体验的对话记录截图。
- id: S4
  name: 4. 综合验收与项目闭环
  guide_text:
  - 确保最终四个页面能够完整联动，形成流畅的闭环体验。
  - 确认视觉美感符合商业或专业水准，彻底摆脱粗糙感。
  report_prompt:
  - type: image
    prompt: 请粘贴在移动端尺寸（手机视图）下页面的响应式表现截图。
  - type: image
    prompt: 请提供全部四个网页相互联动与最终展示的高清长截图或效果合集。
analysis_prompts:
- '[体验了 Vibecoding 模式后，你认为未来的设计师和产品经理需要具备的最核心技能是什么？]'
- '[你认为精益用户体验中的“假大空文档最小化，直接用可用代码原型验证”思想在这次综合实践中体现得怎么样？]'
grading_rubric:
- dimension: 产品逻辑与完整度
  points: 30
  standard: 至少4个页面完全连通形成闭环体验，跳转逻辑清晰，具备极高的产品完整度。
- dimension: 视觉与体验品质
  points: 40
  standard: 页面审美在线，视觉层级清晰，微动效自然流畅，展现商业级或专业级品质。
- dimension: AI协作与指令迭代
  points: 30
  standard: 能有效通过自然语言纠偏 AI，在对话过程中体现出明确的控制力与问题排查思路。
