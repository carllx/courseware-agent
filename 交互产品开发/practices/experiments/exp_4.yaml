exp_id: 4
name: 基于精益用户体验的综合设计
type: 综合性
hours: 24
group_size: 1
requirement: 必做
summary: 基于精益用户体验的综合互动叙事设计。以同学们的个人作品集为基础，利用 Agent 以自然语言驱动（Vibecoding）快速生成并迭代出 4 个核心页面的全新个人网站（数字产品）。
method_theory: 通过自然语言描述与 AI Agent 协作进行快速原型生成与迭代验证
objectives: |
  （一）掌握“自然语言即代码 (Vibecoding)”的创新开发模式，通过提示词工程驱动项目落地。
  （二）理解精益用户体验 (Lean UX) 的核心，即通过快速生成可用原型来验证设计假设。
  （三）培养跨界产品思维，能够站在用户体验和商业目标的角度指挥 AI 完成多页面产品交付。
equipment: |
  1. 硬件：个人计算机（学校机房或自备）
  2. 软件：V0 / Cursor / CodeGeeX 等 Agent 协作环境
  3. 准备素材：请准备个人作品的图片、视频或音频等素材（最少 10~12 张/项），用于构建你专属的个人网站。
requirements: |
  （一）基于你的 10~12 项个人作品素材，指挥 AI Agent 生成包含至少 4 个相互跳转页面的专属个人网站/数字产品项目。
  （二）通过多轮对话迭代，优化页面的视觉排版、响应式适配与交互体验。
  （三）不需要递交底层项目文件，仅需交付一段 20 秒内的演示视频（要求 1080P 分辨率、H.264 编码的 MP4 格式）。要求在浏览器上模拟用户落地并浏览整个页面产品的全过程，演示需根据前期设定的用户流程图进行。
methods: |
  1. 构思产品核心价值与页面跳转逻辑。
  2. 使用自然语言向执行型 AI Agent 描述功能需求与视觉风格。
  3. 在本地运行生成的网页原型，进行真实体验走查。
  4. 针对体验缺陷，通过追加纠偏指令指挥 AI 进行多轮迭代修改。
conclusions: |
  反思自然语言驱动开发模式（Vibecoding）带来的效率提升与协作难点，总结在指挥 AI 落地创意时的提示词策略。
steps:
- id: S1
  name: 1. 确立综合项目与产品构思
  guide_text:
  - 确定最终叙事主题（个人数字展馆或在地文化重塑门户）。
  - 梳理产品的核心价值主张、目标用户以及所需的 4 个核心页面及跳转关系。
  report_prompt:
  - type: text
    prompt: 请列出你所选项目的4个页面名称及相互跳转逻辑。
- id: S2
  name: 2. 自然语言驱动原型生成 (Vibecoding)
  guide_text:
  - 在 VS Code (或 Cursor 等 AI 编辑器) 中，用详尽的自然语言向 Agent 描述你的整体业务需求和页面风格。
  - 指挥 Agent 自动生成初始版本的互动原型，直接在浏览器预览效果。不要去看也不要纠结底层的代码实现。
  report_prompt:
  - type: text
    prompt: 在初始生成阶段，你向 AI 下达的最关键的一段“核心功能指令”是什么？
  - type: image
    prompt: 请提供初始生成的原型网页在浏览器中的预览截图。
- id: S3
  name: 3. 迭代优化与体验打磨
  guide_text:
  - 像产品经理一样，根据浏览器的预览效果进行走查，找出视觉排版或交互逻辑上的缺陷。
  - 完全通过追加自然语言指令，要求 Agent 修复排版错位、适配多屏幕设备或注入符合情绪的微动效。
  report_prompt:
  - type: text
    prompt: 在多轮对话迭代中，你发现 AI 最难理解或最容易做错的要求是什么？你是如何修改提示词纠正它的？
  - type: image
    prompt: 请粘贴一段你用来指导 AI 修复 Bug 或优化体验的对话记录截图。
- id: S4
  name: 4. 综合验收与项目闭环
  guide_text:
  - 确保最终四个页面能够完整联动，形成流畅的闭环体验。
  - 确认视觉美感符合商业或专业水准，彻底摆脱粗糙感。
  report_prompt:
  - type: image
    prompt: 请粘贴在移动端尺寸（手机视图）下页面的响应式表现截图。
  - type: video
    prompt: 请上传一段 20 秒内的产品走查演示视频（参数要求：1080P 分辨率、H.264 编码的 MP4 格式）。要求模拟用户在浏览器上落地并浏览整个页面产品的全过程，严格遵循用户流程图。
analysis_prompts:
- '[体验了 Vibecoding 模式后，你认为未来的设计师和产品经理需要具备的最核心技能是什么？]'
- '[你认为精益用户体验中的“假大空文档最小化，直接用可用代码原型验证”思想在这次综合实践中体现得怎么样？]'
grading_rubric:
- dimension: 产品逻辑与完整度
  points: 30
  standard: 至少 4 个页面相互连通形成叙事闭环，跳转逻辑清晰且带有情感牵引，具备极高的人文与产品完整度。
- dimension: 视觉美学与情绪体验
  points: 40
  standard: 页面审美在线，视觉层级清晰且跨端自适应良好，微动效与情绪流 (Vibe) 自然流畅，展现极致的交互关怀。
- dimension: AI协作与指令迭代
  points: 30
  standard: 能有效通过自然语言纠偏 AI，在对话过程中体现出明确的控制力与问题排查思路。
