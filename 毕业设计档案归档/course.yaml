# course.yaml 模板
# ============================================================
# 使用方法: 复制到课程根目录，重命名为 course.yaml，按需填写
# Schema: 对齐 ADR 005-013 的所有字段要求
# ⚠️ DMA 专业: 请参考 `.agent/rules/rule_dma_course_design.md`
# ⚠️ 人培合规: 请参考 `.agent/rules/rule_training_plan_compliance.md`
# ============================================================

# ──────────────────────────────────────────────────────────
# 人培参考 (Training Plan Reference)
# ──────────────────────────────────────────────────────────
# 本课程服务年级: XX级 (20XX 入学)
# 适用人培版本:   20XX 人培（数字媒体艺术四年制本科）
# 人培中课程名:   【填写人培中的官方课程名称】
# 人培学分/学时:  X学分 / X学时 (理X+实X)
# 实际开课设置:   X学分 / X学时 (理X+实X), 以实际排课为准
# 人培支撑矩阵:   参见 training_plan_2025.yaml 的 course_matrix
# ──────────────────────────────────────────────────────────

agent:
  standards:
    visual_system: "../../.agent/styles/theme_academic_minimal.yaml"

course:
  name: "毕业设计档案归档"                              # 课程中文名
  code: "ARCHIVE2026"                              # 教务系统课程代码
  semester: "2025-2026-2"
  nature: "专题指导"                            # 专业必修课 / 专业选修课 / 通识课 / ...
  credits: 1.0
  department: ""
  major: ""
  prerequisites: ""
  resources_url: "无"                   # 课程网站 URL（无则填"无"）
  classes:
    - name: ""                          # 班级名称
      # archive_id: 0                    # 可选：班级归档序号，每学期由系部汇总表分配。不同课程、不同班级序号各不相同。
      schedule_time: ""                 # 如: 周三2-5节
      classroom: ""
      # week_range: "1-15"             # 可选: 多班课程需声明起止周次
      # official_weeks: 15             # 可选: 教务注册周数（ADR 012），多班时必填
      # excluded_weeks: []             # 可选: 停课周次列表，进度表/教案自动跳过
      #   ⚠️ 生成器偏移映射会跳过停课周，calendar 内容自动顺延（ADR 013）
      #   ⚠️ excluded_weeks 中的周次必须在 week_range 范围内（audit F11）
      # official_weeks: 15             # 可选: 教务注册周数（ADR 012），多班时必填
      # excluded_weeks: [16]           # 可选: 法定假期停课周，生成器自动跳过并顺延映射（ADR 013）
  # --- 多班课程 (ADR 012 + 013) ---
  # 多班课程须为每个班级声明 week_range + official_weeks
  # excluded_weeks 触发进度表/教案生成器自动跳过逻辑
  # hours 节点应含 per_class: true 以消除学时歧义
  hours:
    total: 0
    theory: 0
    practice: 0
    minutes_per_period: 45                # 每课时分钟数（默认45），用于 steps 分钟校验
  introduction:
    content: |
      课程简介正文。
    design: |
      教学设计理念正文。

teacher:
  name: ""
  title: ""                             # 必填：学术职称（如 教授 / 副教授 / 讲师...）。⚠️ 注意：“专任教师”是岗位而非职称，若无职称填“无”，不可留空。
  office: ""
  department: ""
  team: ""                              # 必填：课程团队成员。如无其他协作教师，请填“无”，且不可留空。

# --- 课程目标 (ADR 005 + ADR 010) ---
# ⚠️ 每维度至少 3 条，每条 desc 必须有独立教学聚焦点
# ⚠️ 必须使用 mappings 数组格式（支持一对多映射）
# ⚠️ requirement/point 编号须与人培方案精确对应
objectives:
  knowledge:
    - index: 1
      desc: ""
      mappings:
        - requirement: ""                # 如: 2 专业知识
          point: ""                      # 如: 2.1 基础知识掌握
          support_level: M               # H/M/L
    - index: 2
      desc: ""
      mappings:
        - requirement: ""
          point: ""
          support_level: M
    - index: 3
      desc: ""
      mappings:
        - requirement: ""
          point: ""
          support_level: M
  ability:
    - index: 1
      desc: ""
      mappings:
        - requirement: ""
          point: ""
          support_level: M
    - index: 2
      desc: ""
      mappings:
        - requirement: ""
          point: ""
          support_level: M
    - index: 3
      desc: ""
      mappings:
        - requirement: ""
          point: ""
          support_level: M
  quality:
    - index: 1
      desc: ""
      mappings:
        - requirement: ""
          point: ""
          support_level: L
    - index: 2
      desc: ""
      mappings:
        - requirement: ""
          point: ""
          support_level: L
    - index: 3
      desc: ""
      mappings:
        - requirement: ""
          point: ""
          support_level: L

semester_config:
  start_date: ""                        # 格式: "YYYY-MM-DD"

textbooks:
  - title: ""
    author: ""
    publisher: ""
    year: ""
    type: textbook                      # textbook / reference

# teaching_requirements 支持两种格式 (ADR 008):
#   纯文本: teaching_requirements: "通过本章学习..."
#   结构化: teaching_requirements:
#              knowledge: "知识维度目标"
#              ability: "能力维度目标"
#              quality: "素质维度目标"
#              method: "过程与方法"
# 推荐使用结构化格式，教案生成器将按维度分行显示
# ⚠️ objectives.mappings[].point 必须与 graduation_requirements.yaml 精确一致
calendar:
  - week: 1
    chapter_title: "第1章 归档全流程指南"        # 必填: 大纲章标题 + 教案 R0 的直接来源 (WYSIWYG)
    topic: "毕业设计档案归档指南"
    content: |-                              # WYSIWYG：每行自带编号前缀，编号跨周连贯
      1.1 总体要求与归档顺序
      1.2 过程性材料汇编避坑
    # exp_id: 1                              # 可选: 含实验内容的周次挂载对应实验 ID
    hours_theory: 2
    hours_practice: 2
    teaching_requirements:
      knowledge: ""
      ability: ""
      # quality: ""                       # 可选
      # method: ""                        # 可选
    focus: ""                           # 教学重点
    difficulty: ""                      # 教学难点
    ideology: ""                        # 课程思政融入点
    teaching_method: ""                 # 教学方法
    supported_objectives: ["知识1"]     # list[str], 关联 objectives
    task: ""                            # 课后任务描述
    lessons:
      - topic: ""
        objectives:
          - ""
        steps:
          # ⚠️ F14 校验规则：
          #   理论 stage (导入+讲授+复习+演示) 分钟 ≈ hours_theory × minutes_per_period (±0.5h)
          #   实践 stage (实践+小结+练习+训练) 分钟 ≈ hours_practice × minutes_per_period (±0.5h)
          #   ∑minutes = (hours_theory + hours_practice) × minutes_per_period
          #   验证: python scripts/validate_steps.py
          # 首周可省略"复习"
          - stage: 导入
            summary: ""
            minutes: 15
          - stage: 讲授
            summary: ""
            # ideology: ""             # 可选: 思政融入点
            minutes: 60
          - stage: 实践
            summary: ""
            minutes: 80
          - stage: 小结
            summary: ""
            minutes: 10
  # --- 常规周模板 (W2 ~ W(N-1)) ---
  # - week: 2
  #   chapter_title: "第二章 {topic}"
  #   topic: ""
  #   content: |-
  #     2.1 ...
  #     2.2 ...
  #   exp_id: 1                            # 含实验内容的周次挂载对应实验 ID
  #     - topic: ""
  #       objectives: [...]
  #       steps:
  #         - stage: 复习        # 常规周必须包含
  #           summary: ""
  #           minutes: 10
  #         - stage: 导入        # 常规周必须包含
  #           summary: ""
  #           minutes: 10
  #         - stage: 讲授
  #           summary: ""
  #           minutes: 60
  #         - stage: 实践
  #           summary: ""
  #           minutes: 80
  #         - stage: 小结
  #           summary: ""
  #           minutes: 10

# --- 实验列表 (ADR 001 + ADR 011) ---
# ⚠️ type 枚举必须含「性」啀缀：验证性 / 综合性 / 设计性 / 演示性
# ⚠️ 实验4（期末大作）惯例应为综合性，禁用 创新/研究 等枚举外属分
# ⚠️ 同一课程实验类型必须涵盖 ≥ 3 种，满足教务「不低于 3 种」要求
# ⚠️ group_size 和 requirement 为必填字段，缺失导致生成器输出残缺
# 推荐分配策略：实验1→验证性 / 实验2/3→设计性+综合性各一 / 实验4→综合性
experiments:
  - id: 1
    name: ""
    type: "验证性"                    # 验证性 / 设计性 / 综合性 / 演示性
    hours: 0
    group_size: 1                         # 必填：每组人数
    requirement: "必做"                   # 必填：必做 / 选做
    # objectives: |                       # 可选：实验目的（多行，【一】【二】分项）
    # equipment: |                        # 可选：设备与软件环境
    # requirements: |                    # 可选：实验要求
    # methods: |                         # 可选：实验步骤与要点
    # conclusions: |                     # 可选：实验结论
    # questions: |                       # 可选：思考题（仅实验1-2）
  - id: 2
    name: ""
    type: "设计性"
    hours: 0
    group_size: 1
    requirement: "必做"
    summary: ""                           # 仅综合性/设计性实验需要：认定表「实验内容简介」（1-3句）
  - id: 3
    name: ""
    type: "综合性"
    hours: 0
    group_size: 1
    requirement: "必做"
    summary: ""
  - id: 4
    name: ""                              # 期末综合项目
    type: "综合性"                    # 实验4惯例应为综合性
    hours: 0
    group_size: 1
    requirement: "必做"
    summary: ""

# --- 考核方式 (ADR 005 + ADR 011) ---
# normal_items.name: "章节测试N" 或 "命题测试N"（无括号）
# normal_items.desc: "对应实验N「实验名称」。考核要求：..."
# ⚠️ final_score_ratio > 0 时必须同时填写 final_item，不可仅有 normal_items
# ⚠️ 强制约束：attendance_ratio + Σ(normal_items.ratio) 必须严格等于 normal_score_ratio
assessment_methods:
  normal_score_ratio: 50
  final_score_ratio: 50
  attendance_ratio: 10
  normal_items:
    - name: 章节测试1
      ratio: 10
      desc: "对应实验1「」。考核要求：..."
    - name: 章节测试2
      ratio: 15
      desc: "对应实验2「」。考核要求：..."
    - name: 章节测试3
      ratio: 15
      desc: "对应实验3「」。考核要求：..."
  final_item:                           # 必填：final_score_ratio > 0 时不可缺少
    name: 期末综合项目考查
    ratio: 100
    desc: "对应实验4「」。考核要求：..."

# --- 考试结构 (ADR 006 + ADR 011) ---
# sections 必须拆分为多个评分维度，禁止笼统一句话
# questions[].type 必须使用枚举标准属分：综合性 / 设计性 / 验证性 / 演示性
exams:
  final_exam:
    - name: 期末综合项目考查
      total_score: 100
      duration: 120
      sections:
        - section_name: ""
          total_score: 0
          questions:
            - content: "对应实验N「」。考核要求：..."
              type: "综合性"            # 验证性/综合性/设计性/演示性
              score: 0

