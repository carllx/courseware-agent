# ──────────────────────────────────────────────────────────
# ⚠️ concept_registry 为独立文件，不内嵌于 course.yaml（ADR 043 R-2）。
# /new_course 工作流 Step 3.2 会自动创建 <课程>/concept_registry.yaml。
# 详见 .agent/templates/practice_schema.md v3.0 的 theory_link 规范。
