# course.yaml 模板
# ============================================================
# 使用方法: 复制到课程根目录，重命名为 course.yaml，按需填写
# Schema: 对齐 ADR 005-013 的所有字段要求
# ⚠️ DMA 专业: 请参考 `.agent/rules/rule_dma_course_design.md`
# ⚠️ 人培合规: 请参考 `.agent/rules/rule_training_plan_compliance.md`
# ============================================================

# ──────────────────────────────────────────────────────────
# 人培参考 (Training Plan Reference)
# ──────────────────────────────────────────────────────────
# 本课程服务年级: XX级 (20XX 入学)
# 适用人培版本:   20XX 人培（数字媒体艺术四年制本科）
# 人培中课程名:   【填写人培中的官方课程名称】
# 人培学分/学时:  X学分 / X学时 (理X+实X)
# 实际开课设置:   X学分 / X学时 (理X+实X), 以实际排课为准
# 人培支撑矩阵:   参见 training_plan_2025.yaml 的 course_matrix
# ──────────────────────────────────────────────────────────

agent:
  standards:
    visual_system: "../../.agent/styles/theme_academic_minimal.yaml"

course:
  name: "毕业设计指导"                              # 课程中文名
  code: "ARCHIVE2026"                              # 教务系统课程代码
  semester: "2025-2026-2"
  nature: "专题指导"                            # 专业必修课 / 专业选修课 / 通识课 / ...
  credits: 1.0
  department: ""
  major: ""
  prerequisites: ""
  resources_url: "无"                   # 课程网站 URL（无则填"无"）
  classes:
    - name: ""                          # 班级名称
      teaching_class_name: 
        full_name: "毕业论文(设计)"
        class_group: "3班"
        grade_and_major: "22数艺专升本"
        course_name: "毕业论文(设计)"
        class_id: null
      student_count: 10
      # archive_id: 0                    # 可选：班级归档序号，每学期由系部汇总表分配。不同课程、不同班级序号各不相同。
      schedule_time: ""                 # 如: 周三2-5节
      classroom: ""
      # week_range: "1-15"             # 可选: 多班课程需声明起止周次
      # official_weeks: 15             # 可选: 教务注册周数（ADR 012），多班时必填
      # excluded_weeks: []             # 可选: 停课周次列表，进度表/教案自动跳过
      #   ⚠️ 生成器偏移映射会跳过停课周，calendar 内容自动顺延（ADR 013）
      #   ⚠️ excluded_weeks 中的周次必须在 week_range 范围内（audit F11）
      # official_weeks: 15             # 可选: 教务注册周数（ADR 012），多班时必填
      # excluded_weeks: [16]           # 可选: 法定假期停课周，生成器自动跳过并顺延映射（ADR 013）
  # --- 多班课程 (ADR 012 + 013) ---
  # 多班课程须为每个班级声明 week_range + official_weeks
  # excluded_weeks 触发进度表/教案生成器自动跳过逻辑
  # hours 节点应含 per_class: true 以消除学时歧义
  hours:
    total: 0
    theory: 0
    practice: 0
    minutes_per_period: 45                # 每课时分钟数（默认45），用于 steps 分钟校验
  introduction:
    content: |
      课程简介正文。
    design: |
      教学设计理念正文。

teacher:
  name: ""
  title: ""                             # 必填：学术职称（如 教授 / 副教授 / 讲师...）。⚠️ 注意：“专任教师”是岗位而非职称，若无职称填“无”，不可留空。
  office: ""
  department: ""
  team: ""                              # 必填：课程团队成员。如无其他协作教师，请填“无”，且不可留空。

