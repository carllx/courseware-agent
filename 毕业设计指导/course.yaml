# --- 实验列表 (ADR 001 + ADR 011) ---
# ⚠️ type 枚举必须含「性」啀缀：验证性 / 综合性 / 设计性 / 演示性
# ⚠️ 实验4（期末大作）惯例应为综合性，禁用 创新/研究 等枚举外属分
# 推荐分配策略：实验1→验证性 / 实验2/3→设计性+综合性各一 / 实验4→综合性
experiments: []

# --- 考核方式 (ADR 005 + ADR 011) ---
# normal_items.name: "章节测试N" 或 "命题测试N"（无括号）
# normal_items.desc: "对应实验N「实验名称」。考核要求：..."
# ⚠️ final_score_ratio > 0 时必须同时填写 final_item，不可仅有 normal_items
# ⚠️ 强制约束：attendance_ratio + Σ(normal_items.ratio) 必须严格等于 normal_score_ratio
assessment_methods:
  normal_score_ratio: 50
  final_score_ratio: 50
  attendance_ratio: 10
  normal_items:
    - name: 章节测试1
      ratio: 10
      desc: "对应实验1「」。考核要求：..."
    - name: 章节测试2
      ratio: 15
      desc: "对应实验2「」。考核要求：..."
    - name: 章节测试3
      ratio: 15
      desc: "对应实验3「」。考核要求：..."
  final_item:                           # 必填：final_score_ratio > 0 时不可缺少
    name: 期末综合项目考查
    ratio: 100
    desc: "对应实验4「」。考核要求：..."

# --- 考试结构 (ADR 006 + ADR 011) ---
# sections 必须拆分为多个评分维度，禁止笼统一句话
# questions[].type 必须使用枚举标准属分：综合性 / 设计性 / 验证性 / 演示性
exams:
  final_exam:
    - name: 期末综合项目考查
      total_score: 100
      duration: 120
      sections:
        - section_name: ""
          total_score: 0
          questions:
            - content: "对应实验N「」。考核要求：..."
              type: "综合性"            # 验证性/综合性/设计性/演示性
              score: 0

