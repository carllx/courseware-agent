          point: ""
          support_level: L

semester_config:
  start_date: ""                        # 格式: "YYYY-MM-DD"

textbooks:
  - title: ""
    author: ""
    publisher: ""
    year: ""
    type: textbook                      # textbook / reference

# teaching_requirements 支持两种格式 (ADR 008):
#   纯文本: teaching_requirements: "通过本章学习..."
#   结构化: teaching_requirements:
#              knowledge: "知识维度目标"
#              ability: "能力维度目标"
#              quality: "素质维度目标"
#              method: "过程与方法"
# 推荐使用结构化格式，教案生成器将按维度分行显示
# ⚠️ objectives.mappings[].point 必须与 graduation_requirements.yaml 精确一致
calendar:
  - week: 1
    chapter_title: "第1章 开题通关局——从“零基础”到拿下毕业设计"
    topic: "毕设开题通关局"
    content: |-
      1.1 确立航线：认识毕设生命周期
      1.2 严守底线：选题的“痛点”与“安全红线”
      1.3 吃透指标：“带着镣铐跳舞”的硬杠杠
      1.4 实战拆解：开题报告核心与 AI 赋能
      1.5 知己知彼：评分标准与答辩技巧
    hours_theory: 2
    hours_practice: 2
    teaching_requirements:
      knowledge: "掌握毕业设计生命周期的四个关键节点；理解基于真实痛点的选题原则；熟悉各专业方向的具体工作量指标与技术红线。"
      ability: "能够运用JTBD模型进行选题痛点挖掘；能够利用AI大模型辅助进行学术理论检索并完成理论应用；能够撰写合规的《任务书》与《开题报告》。"
      quality: "建立全周期的项目管理意识；树立严格的学术规范与防抄袭底线思维。"
      method: "案例分析法、实战演练法、互动讨论法"
    focus: "JTBD痛点挖掘模型的应用与选题验证；《任务书》与《开题报告》核心骨架的撰写。"
    difficulty: "理论框架如何与具体设计实践深度结合（What-Why-How路径）。"
    ideology: "培养学生解决社会真实问题的责任感，恪守学术诚信原则。"
    teaching_method: "现场讲授、案例剖析与实战填表自查。"
    supported_objectives: ["知识1", "能力1", "素质1"]
    task: "根据课堂分发的《任务书自查单》与《开题报告骨架》，于下周前完成个人的《任务书》初稿。"
    lessons:
      - topic: "毕设开题通关局"
        objectives:
          - "明确毕设生死节点，掌握JTBD选题模型，完成合规的开题报告骨架。"
        steps:
          - stage: 导入
            summary: "从往届开题惨痛案例切入，明确毕设严峻性与红线要求。"
            minutes: 15
          - stage: 讲授
            summary: "讲解毕设生命周期、选题痛点模型（JTBD）、各方向硬性产出指标及开题报告的10大核心要素。"
            ideology: "学术诚信与社会责任感。"
            minutes: 60
          - stage: 实践
            summary: "发放脚手架工具（自查单与模板），学生现场利用NotebookLM等AI工具进行选题检索与理论框架构建。"
            minutes: 80
          - stage: 小结
            summary: "回顾开题三板斧，重申时间节点与交付要求。"
            minutes: 10

  - week: 16
    chapter_title: "第16章 归档全流程指南"
    topic: "毕业设计档案归档指南"
    content: |-
      16.1 总体要求与归档顺序
      16.2 过程性材料汇编避坑
    hours_theory: 2
    hours_practice: 2
    teaching_requirements:
      knowledge: "掌握毕业设计各阶段材料的归档逻辑及时间要求。"
      ability: "能够独立完成符合教务标准的档案袋整理与装订。"
    focus: "文件填报中的时间线倒挂防范与装订排版规范。"
    difficulty: "不同层级文件与签名流程的逻辑对应关系。"
    teaching_method: "案例分析与实操演示。"
    supported_objectives: ["能力2", "素质2"]
    task: "按照《进程时间安排表》，完善个人档案袋的原件及复印件。"
    lessons:
      - topic: "毕业设计档案归档指南"
        objectives:
          - "了解毕业设计过程档案袋构成，避开常见被退回雷区。"
        steps:
          - stage: 导入
            summary: "重申材料规范性在毕设最后一公里的重要性。"
            minutes: 15
          - stage: 讲授
            summary: "拆解归档过程中的红线（日期填写、导师签名、装订顺序）。"
            minutes: 60
          - stage: 实践
            summary: "分发材料样本，学生自查手中的档案目录与日期。"
            minutes: 80
          - stage: 小结
            summary: "总结易错清单，提醒最终上交的时间红线。"
            minutes: 10
