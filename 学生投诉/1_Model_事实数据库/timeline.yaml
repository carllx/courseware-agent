  - period: "6月15日 (第16周)"
    event: "集中补课"
    details: "额外安排了4学时的集中补课。该次补课于14日课上放学前口头通知全班，因遗漏在超星群发文字通知，故目前仅能以总务处课室申请表为佐证。"
    hours_taught: 4
    evidence_id: "EVIDENCE_ROOM_JUNE15"
  - period: "6月17日 (第16周)"
    event: "集中项目实践与辅导"
    details: "集中授课与实践辅导12课时。由于教务课室申请系统限制，总务处只能申请1-4节课室。第5-15节因原课室被占用，教师组织班级同学转移至3 实验室 208继续完成项目实践辅导。如需验证可向班委核实。"
    hours_taught: 12
    evidence_id: "EVIDENCE_ROOM_JUNE17"
  - period: "6月22日 & 6月29日 (第17、18周)"
    event: "群内极力追踪大实验验收意向（未获确切回复）"
    details: "这 8 课时缺口是因为：应班委反映大部分同学要求在16周前结课的诉求，教师增加了上课频次与密度，确保在16周前把所有大纲的课程知识都交付给这部分同学，使其达到教学目的并能完成最终实验。在完成大纲交付后，为照顾未能完全吸收进度的小部分同学，特意留出这 8 学时作为专项的“再开课指导”。在收到投诉前，教师于6月22日、29日一直在超星群内极力询问这部分同学的辅导时间意向，但迟迟未能收到确切回复，因此导致在收到投诉时依然呈现8课时的待落实缺口。"
    evidence_id: "EVIDENCE_CHAT_JUNE22_29"
  - period: "7月3日 (第18周)"
    event: "信息可视化课程补课"
    details: "8-11节私下补课（无超星记录）"
    evidence_id: "EVIDENCE_INFOVIZ_JULY3"
  - period: "7月2日（周四）第8-15节"
    event: "期末大实验与项目验收（接诉后紧急破局动作）"
    details: "课程原定的期末收尾环节（计8学时）。在接到举报以后，为了打破群内无人回复的僵局，教师目前已要求班委向班里逐个同学进行确认，旨在加速制定并最终敲定剩余 8 个学时的上课时间，确保在第 18 周考试周之前能够完成所有 60 个学时的教学任务。计划教学内容主要包括：1. 针对性辅导：针对在16周前结课需求安排中，部分同学没有跟上的各种问题进行提炼，并进行针对性辅导；2. 课程收尾：对该课程的最终进度进行全面梳理，并完成最终的收尾与巩固。"
    hours_taught: 8
    evidence_id: "EVIDENCE_NOTICE_JULY_FINAL"
