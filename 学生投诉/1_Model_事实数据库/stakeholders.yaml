stakeholders:
  - role: "教师"
    intentions:
      - "为确保达到教学大纲60学时的要求，积极规划后续教学进度"
      - "为尊重班委与大部分学生'如期结课'的诉求，合理压缩并推进课程进度"
      - "对教务系统停补课审批流程不熟悉，误以为与班委协商排课即可"
      - "考虑到15周后的集中实践环节占用学生原计划外时间，为免强行考勤引发学生备考冲突，主动决定不设置签到"
    actions:
      - "利用额外时间录制3小时47分钟示范视频辅助教学"
      - "规划期末大实验验收通知，首次尝试使用系统停补课功能。原定7月5日申请因考试周被打回后，调整至7月3日，并制定'项目成型者免签'的人性化策略"
  - role: "学生与班委"
    intentions:
      - "绝大部分同学：处于期末与毕业高压期，强烈希望能在第16周前如期结课"
      - "极小部分同学：不希望在第16周结课，且因第16周的集中实践辅导导致教学节奏较快而没能完全吸收"
      - "学生整体时间极度冲突，无法统一抽出整块空闲时间补课"
    actions:
      - "部分学生因无法跟上压缩进度，且因微信/超星群通知淹没导致沟通错位，引发不满并向教务投诉课时不足"
  - role: "教务系统/客观环境"
    status:
      - "系统盲区：未提醒或展示第1-2周星期三(2-5节)实际未排课"
      - "流程门槛：平补课机制不清晰，系统操作门槛增加了合规操作的阻力。教师起初未充分掌握正式停补课功能的存在"
      - "考试周红线：系统不允许在第18周周日（考试周）进行补课，导致7月5日的申请被打回"
