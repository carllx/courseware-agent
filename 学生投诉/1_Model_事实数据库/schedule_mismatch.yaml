schedule_mismatches:
  - context: "教务系统上已为教师（林昕）前期设置好的规范上课时间段，但实际执行出现未完全匹配"
    scheduled_slots:
      - time: "星期三第2-5节"
        weeks: "9-15周"
        room: "2实107"
        teacher: "林昕"
      - time: "星期日第1-4节"
        weeks: "11周，14-15周"
        room: "2实107"
        teacher: "林昕"
      - time: "星期日第2-5节"
        weeks: "8周"
        room: "2实107"
        teacher: "林昕"
      - time: "星期日第6-9节"
        weeks: "10周"
        room: "2实107"
        teacher: "林昕"
      - time: "星期日第8-11节"
        weeks: "7周"
        room: "3实312"
        teacher: "林昕"

  - context: "教务需要教师进行调停补课操作的时间段，但因教师系统操作生疏或身体原因未能及时设置"
    missing_operation_slots:
      - time: "星期三第2-5节"
        weeks: "1-2周"
        room: "2实107"
        teacher: "林昕"
        reason: "由于不熟悉学校教务系统的排课安排及调停课操作规范，导致未能及时进行系统设置"
      - time: "星期日"
        weeks: "7-8周"
        room: "2实107/3实312"
        teacher: "林昕"
        reason: "住院期间，教务系统虽已有调整，但因身体原因未在教务系统进行更正，导致第7、第8周的课没有去上。本人仅在超星群内私下通知学生，没有及时更改教务系统，且后续一系列教务系统通知均未及时关注，没有进行合法、正规的调停课设置操作。"
      
  - context: "主观管理上的核心责任与失误"
    root_cause: "为了赶进度，教师私下与学生定制上课课时，完全绕开了教务系统的正常排课与监管流程。这是导致实际教学进度与系统账面记录发生严重割裂与混乱的根本原因。"
