  bg_base: "#1A1A18"
  bg_surface: "#292825"
  bg_elevated: "#3D3B38"
  primary: "#D94228"
  primary_light: "#F0654D"
  secondary: "#A69B86"
  tertiary: "#E5C222"
  text_main: "#F2EFE8"
  text_secondary: "#9C9993"
