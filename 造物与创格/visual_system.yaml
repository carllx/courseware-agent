style:
  prompt_templates:
    base_en: "brutalist design, raw texture, high contrast tension, gritty lighting, unpolished, emotional and psychological tension, evoking a sense of resistance and weight, dark cinematic atmosphere"
    pedagogical_en: "industrial blueprint style, slightly distressed texture, architectural lines, high-contrast markers in oxidized red and warning yellow, clear structural focus"
    pure_geometry_en: "pure brutalist geometry, heavy concrete-like solid shapes, striking abstract layout, high contrast architectural light"
  prompt_variants:
    Title: "heavy asymmetric editorial layout, imposing dark background, striking typography arrangement, raw material texture"
    Diagram: "brutalist blueprint layout, stark logical nodes with warning yellow accents, strong geometric structures, high contrast"
    List: "structured heavy card grid, deep shadows, numbered items with oxidized red accents, robust typography"
    Comparison: "stark contrast split screen, conflicting forces, left side rigid and constrained, right side chaotic or raw, deep shadows"
    Pedagogical_Layout: "clear industrial instruction layout, high legibility despite the gritty vibe, precise geometric markers"

generation_guide:
  context_routing:
    contemporary: "contemporary industrial brutalism, stark photography"
    historical: "ancient raw material textures, archaeological lighting and heavy shadows"
  pedagogical_routing: "If not explicitly set to themed, pedagogical mode uses clear contrast and markers over raw textures"
