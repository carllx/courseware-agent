# W05_practice.yaml — 力导向生成艺术与地理隐喻
week: 5
title: "力导向生成艺术与地理隐喻"
experiment_link: "实验3"
total_minutes: 135  # hours_practice=3 → 3×45=135

theory_prerequisites:
  - "网络/树拓扑数据结构与节点-边关系"
  - "D3 力导向引擎 (Force-Directed Placement) 物理模型"
  - "Alpha Decay/阻尼参数与能量收敛控制"
  - "空间地理数据编码与 Choropleth Map"
  - "Vibe Coding 排错漏斗 (Console→结构定位→MRE) 与 Bug-driven Prompting"

phases:
  - id: P1
    name: "网络拓扑伦理辩论"
    minutes: 20
    type: discussion
    description: "围绕防疫追踪网络 vs 监控网络的力导向图伦理讨论"
    tools: ["学习通"]
    steps:
      - "展示防疫流调网络与少数派监视网络的力导向图对比"
      - "小组辩论：同种物理形态的可视化因社会语境产生的对立隐喻"
      - "回答：技术中立是否是一种伪命题？"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "课堂实战打卡与交互记录"
    theory_link: "网络拓扑伦理与数据隐喻"
    materials:
      - type: dataset
        title: "本周占位验证数据集"
        file: "assets/practice/placeholder_data.csv"
        format: csv
        schema:
          keys: ["id"]
          values: ["value"]
          types:
            id: categorical
            value: quantitative

  - id: P2
    name: "力导向引擎调参实验"
    minutes: 45
    type: workshop
    description: "通过 AI 生成 D3 力导向图并直面页面崩溃，执行防线排雷战"
    tools: ["Claude/DeepSeek", "VS Code/Cursor", "浏览器 DevTools"]
    steps:
      - "让 AI 生成基础 D3 力导向网络图并手动调节 Alpha Decay 等物理刚性参数"
      - "故意触发现代前端框架的结构性崩溃（页面死白/节点飞出作用域）"
      - "严禁肉眼查错！必须运用报错漏斗（Console红字提取→结构定位→MRE复原）执行对 AI 的原路追责"
      - "记录你最凶狠、有效的一次 Bug-driven Prompting 修复对话"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "参数微调对比截图（至少 3 组）"
      - "经典排障（Bug-driven Prompting）修复对话截图"
    theory_link: "力导向物理模型与 Barnes-Hut 近似"

  - id: P3
    name: "构建'数据生命体'情绪大作"
    minutes: 70
    type: practice
    description: "综合实践——基于自拟情感议题创作 D3 力导向生成艺术作品"
    tools: ["Claude/DeepSeek", "VS Code/Cursor", "浏览器"]
    steps:
      - "选定一个具有情感张力的社会议题（如留守儿童社交网络/城市迁徙引力模型）"
      - "构建或获取对应的节点-边数据集"
      - "通过 Vibe Coding 迭代生成 D3 力导向'数据生命体'作品"
      - "截取 3 帧极致美感瞬间（初始混沌→挣扎演化→最终热寂）"
      - "撰写寓意说明"
    weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
      - "D3 力导向生成艺术 HTML"
      - "3 帧截图（混沌→演化→热寂）"
      - "Bug-driven Prompting 极限排雷修复纪要"
      - "作品寓意说明"
    theory_link: "生成艺术 + 力导向 + 数据隐喻"

homework:
  title: "数据生命体创作"
  description: "基于自拟情感议题，使用 D3 力导向引擎构建'数据生命体'作品"
  weight: "10%"
  scoring_rubric:
    full_marks: 100
    criteria: |
      - 维度一(40分)：有效提交设定工具生成的基础资产及源文件。
      - 维度二(60分)：设计决策说明包含了精确的专业理论溯源分析。
  deliverables:
    - "完整 HTML 文件"
    - "3 帧极致美感截图"
    - "极其凶险的 Bug-driven Prompting 追责纪要截图"
    - "寓意说明（含数据来源与参数选择理由）"
